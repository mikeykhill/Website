<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port VTS & Coastal Harbor Simulation — 140x280 Diorama</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #f2efe9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            color: #f8fafc;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.84);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.22);
            color: #f1f5f9;
            pointer-events: auto;
        }

        #bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            z-index: 10;
            white-space: nowrap;
        }

        .night-toggle-btn {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #e0f2fe;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
        }

        .night-toggle-btn:hover {
            background: rgba(14, 165, 233, 0.28);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.38);
        }

        .night-toggle-btn.is-night {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            border-color: #2dd4bf;
            color: #5eead4;
            box-shadow: 0 0 18px rgba(45, 212, 191, 0.42);
        }

        .night-toggle-btn.is-active-cam {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-color: #7dd3fc;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.48);
        }
    </style>
</head>
<body>

    <div id="bottom-bar" class="hud-panel">
        <button class="night-toggle-btn" id="day-night-btn" title="Toggle Day / Bioluminescent Night (Shortcut: N)">
            <span id="day-night-icon">🌙</span>
            <span id="day-night-label">Night Mode</span>
        </button>
        <button class="night-toggle-btn" id="auto-cam-btn" title="Toggle Automatic Camera Screensaver Cycle">
            <span id="auto-cam-icon">🎥</span>
            <span id="auto-cam-label">Auto Camera: Off</span>
        </button>
    </div>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ============================================================================
        // 1. SCENE, CAMERA, PROCEDURAL ENVIRONMENT MAP & STUDIO LIGHTING (140 x 280)
        // ============================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2efe9);
        scene.fog = new THREE.FogExp2(0xf2efe9, 0.0008);

        const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 1, 1800);
        camera.position.set(185, 112, 190);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.35));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        renderer.localClippingEnabled = true;
        document.body.appendChild(renderer.domElement);

        // Diorama Z-boundary clipping planes so ships entering from the Right (Z = -140)
        // and departing off the Left (Z = +140) slice cleanly at the diorama water walls
        const dioramaClipPlanes = [
            new THREE.Plane(new THREE.Vector3(0, 0, 1), 140.0),  // Z >= -140 (Right edge)
            new THREE.Plane(new THREE.Vector3(0, 0, -1), 140.0)  // Z <= +140 (Left edge)
        ];

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.015;
        controls.minDistance = 18;
        controls.maxDistance = 520;
        controls.target.set(-4, -2, 0);

        // Generate a procedural studio sky + deep marine horizon equirectangular environment map for realistic water specular reflections
        function createStudioEnvMap() {
            const c = document.createElement('canvas');
            c.width = 1024;
            c.height = 512;
            const ctx = c.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0.0, '#1d4ed8');
            grad.addColorStop(0.24, '#60a5fa');
            grad.addColorStop(0.46, '#e0f2fe');
            grad.addColorStop(0.50, '#cbd5e1');
            grad.addColorStop(0.68, '#0a417a');
            grad.addColorStop(1.0, '#062345');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 512);

            // Soft bright studio sun disc reflection
            const sunGrad = ctx.createRadialGradient(740, 145, 5, 740, 145, 135);
            sunGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.96)');
            sunGrad.addColorStop(0.32, 'rgba(224, 242, 254, 0.72)');
            sunGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(590, 10, 300, 280);

            // Soft cloud ribbons for subtle water surface sheen variation
            ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
            for (let i = 0; i < 18; i++) {
                ctx.beginPath();
                ctx.ellipse(
                    (i * 73) % 1024,
                    80 + (i * 29) % 140,
                    60 + (i % 4) * 25,
                    12 + (i % 3) * 6,
                    0, 0, Math.PI * 2
                );
                ctx.fill();
            }

            const envTex = new THREE.CanvasTexture(c);
            envTex.mapping = THREE.EquirectangularReflectionMapping;
            return envTex;
        }

        const studioEnvMap = createStudioEnvMap();
        scene.environment = studioEnvMap;

        // Golden-hour studio directional light + hemisphere sky/ground fill
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xd6cfc2, 0.74);
        hemiLight.position.set(0, 220, 0);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.42);
        sunLight.position.set(135, 185, 95);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const dShadow = 175;
        sunLight.shadow.camera.left = -dShadow;
        sunLight.shadow.camera.right = dShadow;
        sunLight.shadow.camera.top = dShadow;
        sunLight.shadow.camera.bottom = -dShadow;
        sunLight.shadow.camera.near = 25;
        sunLight.shadow.camera.far = 480;
        sunLight.shadow.bias = -0.0004;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x7dd3fc, 0.45);
        fillLight.position.set(-125, 90, -85);
        scene.add(fillLight);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // Expanded Diorama Footprint: X from -106 to +70 (36m deeper hillside, keeping dock -39.5..-24 and water -24..+70 intact)
        const MIN_X = -106;
        const MAX_X = 70;
        const WORLD_X = MAX_X - MIN_X; // 176
        const HALF_Z = 140;
        const WORLD_Z = 280;
        const GRID_NX = 140;
        const GRID_NZ = 280;
        const QUAY_X = -24;        // Concrete seawall edge
        const HILL_EDGE_X = -39.5; // Boundary between wide flat concrete port apron (-39.5 to -24) and terraced hillside (-106 to -39.5)
        const APRON_Y = 3.2;       // Port quay apron elevation
        const SEABED_Y = -13.5;
        const BASE_BOTTOM_Y = -27.5;

        // Warm Editorial Gallery Floor Plane catching soft contact shadows
        const studioFloor = new THREE.Mesh(
            new THREE.PlaneGeometry(1600, 1600),
            new THREE.MeshStandardMaterial({ color: 0xf2efe9, roughness: 0.95, metalness: 0.0 })
        );
        studioFloor.rotation.x = -Math.PI / 2;
        studioFloor.position.y = BASE_BOTTOM_Y - 0.04;
        studioFloor.receiveShadow = true;
        scene.add(studioFloor);

        // ============================================================================
        // 2. PROCEDURAL TEXTURES (VORONOI CAUSTICS, SEDIMENTARY STRATA, ASPHALT, HULLS)
        // ============================================================================
        const NightEnvironment = {
            isNight: false,
            nightMix: 0.0,
            lightFixtures: [],
            volumetricBeams: [],
            glowSprites: [],
            emissiveMaterials: [],
            fluorescentMaterials: [],
            jellyfish: [],
            planktonPoints: null,
            planktonData: [],
            portPointLights: [],
            vehicleHeadlightCones: [],
            shipNightGroups: [],
            softGlowTexture: null,

            getSoftGlowTexture() {
                if (this.softGlowTexture) return this.softGlowTexture;
                const c = document.createElement('canvas');
                c.width = 128;
                c.height = 128;
                const ctx = c.getContext('2d');
                const grad = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
                grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
                grad.addColorStop(0.22, 'rgba(255, 255, 255, 0.72)');
                grad.addColorStop(0.52, 'rgba(255, 255, 255, 0.22)');
                grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 128, 128);
                this.softGlowTexture = new THREE.CanvasTexture(c);
                return this.softGlowTexture;
            },

            // Creates a Fresnel + axial-gradient volumetric light shader that eliminates hard cone edges
            createDiffusedVolumetricMaterial(hexColor, dayOpacity = 0.0, maxOpacity = 0.32, axialPower = 1.4, fresnelPower = 2.3, useClipping = false) {
                const mat = new THREE.ShaderMaterial({
                    uniforms: {
                        uColor: { value: new THREE.Color(hexColor) },
                        uOpacity: { value: dayOpacity }
                    },
                    vertexShader: `
                        #include <clipping_planes_pars_vertex>
                        varying vec2 vUv;
                        varying vec3 vNormalView;
                        varying vec3 vViewPos;
                        void main() {
                            #include <begin_vertex>
                            vUv = uv;
                            vNormalView = normalize(normalMatrix * normal);
                            vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);
                            vViewPos = -mvPosition.xyz;
                            gl_Position = projectionMatrix * mvPosition;
                            #include <clipping_planes_vertex>
                        }
                    `,
                    fragmentShader: `
                        #include <clipping_planes_pars_fragment>
                        uniform vec3 uColor;
                        uniform float uOpacity;
                        varying vec2 vUv;
                        varying vec3 vNormalView;
                        varying vec3 vViewPos;
                        void main() {
                            #include <clipping_planes_fragment>
                            vec3 viewDir = normalize(vViewPos);
                            // Soft Fresnel silhouette roll-off so cone sides feather invisibly into air
                            float fresnel = abs(dot(normalize(vNormalView), viewDir));
                            float edgeSoftness = pow(clamp(fresnel, 0.0, 1.0), ${fresnelPower.toFixed(2)});

                            // Axial attenuation: vUv.y = 1.0 at apex light source, 0.0 at far diffused end
                            float sourceSoft = smoothstep(1.0, 0.80, vUv.y);
                            float farFade = pow(clamp(vUv.y, 0.0, 1.0), ${axialPower.toFixed(2)}) * smoothstep(0.0, 0.35, vUv.y);

                            float alpha = edgeSoftness * sourceSoft * farFade * uOpacity;
                            if (alpha < 0.002) discard;
                            gl_FragColor = vec4(uColor, alpha);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    side: THREE.DoubleSide,
                    clipping: useClipping,
                    clippingPlanes: useClipping ? dioramaClipPlanes : null
                });
                this.volumetricBeams.push({ mat, dayOpacity, maxOpacity });
                return mat;
            },

            createGlowSprite(hexColor, scale = 2.4, dayOpacity = 0.0, maxOpacity = 0.85) {
                const sMat = new THREE.SpriteMaterial({
                    map: this.getSoftGlowTexture(),
                    color: hexColor,
                    transparent: true,
                    opacity: dayOpacity,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                this.glowSprites.push({ mat: sMat, dayOpacity, maxOpacity });
                const sprite = new THREE.Sprite(sMat);
                sprite.scale.set(scale, scale, 1);
                return sprite;
            }
        };

        const ProceduralTextures = {
            noiseCanvas: null,
            seabedCanvas: null,
            seabedCtx: null,
            seabedTex: null,
            baseSeabedCanvas: null,
            causticPoints: [],
            seabedUniforms: {
                uCausticTime: { value: 0.0 },
                uNightMix: { value: 0.0 }
            },

            init() {
                this.noiseCanvas = document.createElement('canvas');
                this.noiseCanvas.width = 512;
                this.noiseCanvas.height = 512;
                const ctx = this.noiseCanvas.getContext('2d');
                const img = ctx.createImageData(512, 512);
                for (let i = 0; i < img.data.length; i += 4) {
                    const v = 120 + (Math.random() - 0.5) * 80;
                    img.data[i] = v;
                    img.data[i + 1] = v;
                    img.data[i + 2] = v;
                    img.data[i + 3] = 255;
                }
                ctx.putImageData(img, 0, 0);

                // Initialize cellular Voronoi caustic seed points
                for (let i = 0; i < 42; i++) {
                    this.causticPoints.push({
                        bx: Math.random() * 512,
                        by: Math.random() * 512,
                        px: Math.random() * Math.PI * 2,
                        py: Math.random() * Math.PI * 2,
                        sx: 0.7 + Math.random() * 0.8,
                        sy: 0.7 + Math.random() * 0.8
                    });
                }
            },

            createPebbleStrataTexture(bgHex, grainHex, pebbleDensity = 95) {
                const c = document.createElement('canvas');
                c.width = 1024;
                c.height = 256;
                const ctx = c.getContext('2d');

                ctx.fillStyle = bgHex;
                ctx.fillRect(0, 0, 1024, 256);

                ctx.fillStyle = grainHex;
                for (let y = 0; y < 256; y += 5) {
                    ctx.globalAlpha = 0.08 + Math.random() * 0.12;
                    ctx.fillRect(0, y, 1024, 2 + Math.random() * 3);
                }
                ctx.globalAlpha = 1.0;

                for (let i = 0; i < 2200; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.24)' : 'rgba(55,35,18,0.18)';
                    ctx.fillRect(Math.random() * 1024, Math.random() * 256, 2, 2);
                }

                const pebbleColors = ['#ffffff', '#f7f3eb', '#e8dfd1', '#d6cbb8', '#a8a29e'];
                for (let i = 0; i < pebbleDensity; i++) {
                    const px = Math.random() * 1024;
                    const py = 16 + Math.random() * 224;
                    const rx = 4 + Math.random() * 10;
                    const ry = 3 + Math.random() * 6.5;
                    const rot = Math.random() * Math.PI;

                    ctx.save();
                    ctx.translate(px, py + 2);
                    ctx.rotate(rot);
                    ctx.fillStyle = 'rgba(40, 26, 12, 0.28)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(rot);
                    ctx.fillStyle = pebbleColors[Math.floor(Math.random() * pebbleColors.length)];
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.globalCompositeOperation = 'overlay';
                ctx.globalAlpha = 0.16;
                ctx.drawImage(this.noiseCanvas, 0, 0, 1024, 256);

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.repeat.set(3, 1);
                tex.anisotropy = 4;
                return tex;
            },

            createCausticSeabedTexture() {
                this.baseSeabedCanvas = document.createElement('canvas');
                this.baseSeabedCanvas.width = 512;
                this.baseSeabedCanvas.height = 512;
                const bCtx = this.baseSeabedCanvas.getContext('2d');

                // Rich multi-toned benthic sediment base (cobalt trenches, olive-sand ridges, rocky patches)
                const grad = bCtx.createLinearGradient(0, 0, 512, 512);
                grad.addColorStop(0.0, '#0d4a80');
                grad.addColorStop(0.28, '#08335e');
                grad.addColorStop(0.55, '#07284b');
                grad.addColorStop(0.78, '#0c3f70');
                grad.addColorStop(1.0, '#14588e');
                bCtx.fillStyle = grad;
                bCtx.fillRect(0, 0, 512, 512);

                // Varied sandy hummocks, gravel beds, and dark rocky reef patches
                for (let i = 0; i < 140; i++) {
                    const sx = Math.random() * 512;
                    const sy = Math.random() * 512;
                    const sr = 14 + Math.random() * 58;
                    const patchGrad = bCtx.createRadialGradient(sx, sy, 2, sx, sy, sr);
                    const roll = Math.random();
                    if (roll > 0.62) {
                        patchGrad.addColorStop(0, 'rgba(125, 185, 215, 0.16)');
                        patchGrad.addColorStop(1, 'rgba(125, 185, 215, 0.0)');
                    } else if (roll > 0.28) {
                        patchGrad.addColorStop(0, 'rgba(4, 18, 40, 0.22)');
                        patchGrad.addColorStop(1, 'rgba(4, 18, 40, 0.0)');
                    } else {
                        patchGrad.addColorStop(0, 'rgba(45, 112, 135, 0.15)');
                        patchGrad.addColorStop(1, 'rgba(45, 112, 135, 0.0)');
                    }
                    bCtx.fillStyle = patchGrad;
                    bCtx.beginPath();
                    bCtx.arc(sx, sy, sr, 0, Math.PI * 2);
                    bCtx.fill();
                }

                // Scattered fine shell/pebble speckles on the ocean floor
                for (let i = 0; i < 1800; i++) {
                    bCtx.fillStyle = Math.random() > 0.45 ? 'rgba(186, 230, 253, 0.14)' : 'rgba(7, 24, 48, 0.22)';
                    bCtx.fillRect(Math.random() * 512, Math.random() * 512, 2 + Math.random() * 2, 2 + Math.random() * 2);
                }

                bCtx.globalCompositeOperation = 'overlay';
                bCtx.globalAlpha = 0.24;
                bCtx.drawImage(this.noiseCanvas, 0, 0, 512, 512);
                bCtx.globalCompositeOperation = 'source-over';
                bCtx.globalAlpha = 1.0;

                this.seabedCanvas = document.createElement('canvas');
                this.seabedCanvas.width = 512;
                this.seabedCanvas.height = 512;
                this.seabedCtx = this.seabedCanvas.getContext('2d');
                this.seabedCtx.drawImage(this.baseSeabedCanvas, 0, 0);

                this.seabedTex = new THREE.CanvasTexture(this.seabedCanvas);
                this.seabedTex.wrapS = THREE.RepeatWrapping;
                this.seabedTex.wrapT = THREE.RepeatWrapping;
                this.seabedTex.repeat.set(2, 4);
                this.seabedTex.anisotropy = 4;

                return this.seabedTex;
            },

            createSeabedBumpTexture() {
                const c = document.createElement('canvas');
                c.width = 512;
                c.height = 512;
                const ctx = c.getContext('2d');

                ctx.fillStyle = '#808080';
                ctx.fillRect(0, 0, 512, 512);

                // Organic sand ripples and rocky micro-craters for 3D bump relief
                for (let i = 0; i < 320; i++) {
                    const bx = Math.random() * 512;
                    const by = Math.random() * 512;
                    const rx = 6 + Math.random() * 28;
                    const ry = 4 + Math.random() * 16;
                    const g = ctx.createRadialGradient(bx, by, 1, bx, by, Math.max(rx, ry));
                    const bright = Math.random() > 0.45;
                    g.addColorStop(0, bright ? 'rgba(235, 235, 235, 0.36)' : 'rgba(30, 30, 30, 0.36)');
                    g.addColorStop(1, 'rgba(128, 128, 128, 0.0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(bx, by, Math.max(rx, ry), 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 0.35;
                ctx.drawImage(this.noiseCanvas, 0, 0, 512, 512);
                ctx.globalAlpha = 1.0;

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(5, 10);
                return tex;
            },

            updateCaustics(time) {
                this.seabedUniforms.uCausticTime.value = time * 0.45;
                this.seabedUniforms.uNightMix.value = NightEnvironment.nightMix;
            },

            createEngineeredAsphaltTexture() {
                const c = document.createElement('canvas');
                c.width = 512;
                c.height = 1024;
                const ctx = c.getContext('2d');

                // Raised stone/concrete curb shoulders along outer edges
                ctx.fillStyle = '#d0cabe';
                ctx.fillRect(0, 0, 512, 1024);

                // Inner curb shadow line
                ctx.fillStyle = '#948e82';
                ctx.fillRect(34, 0, 6, 1024);
                ctx.fillRect(472, 0, 6, 1024);

                // Rich dark asphalt carriageway
                ctx.fillStyle = '#2d343e';
                ctx.fillRect(40, 0, 432, 1024);

                // Subtle darker dual tire wear tracks in Northbound & Southbound lanes
                const wearGrad1 = ctx.createLinearGradient(60, 0, 240, 0);
                wearGrad1.addColorStop(0, 'rgba(15, 23, 42, 0.0)');
                wearGrad1.addColorStop(0.3, 'rgba(15, 23, 42, 0.26)');
                wearGrad1.addColorStop(0.7, 'rgba(15, 23, 42, 0.26)');
                wearGrad1.addColorStop(1, 'rgba(15, 23, 42, 0.0)');
                ctx.fillStyle = wearGrad1;
                ctx.fillRect(60, 0, 180, 1024);

                const wearGrad2 = ctx.createLinearGradient(272, 0, 452, 0);
                wearGrad2.addColorStop(0, 'rgba(15, 23, 42, 0.0)');
                wearGrad2.addColorStop(0.3, 'rgba(15, 23, 42, 0.26)');
                wearGrad2.addColorStop(0.7, 'rgba(15, 23, 42, 0.26)');
                wearGrad2.addColorStop(1, 'rgba(15, 23, 42, 0.0)');
                ctx.fillStyle = wearGrad2;
                ctx.fillRect(272, 0, 180, 1024);

                // Fine aggregate asphalt grain
                ctx.globalAlpha = 0.22;
                ctx.drawImage(this.noiseCanvas, 0, 0, 512, 1024);
                ctx.globalAlpha = 1.0;

                // Crisp solid white outer shoulder lines
                ctx.fillStyle = '#f1f5f9';
                ctx.fillRect(54, 0, 7, 1024);
                ctx.fillRect(451, 0, 7, 1024);

                // Dashed warm highway centerline markings
                ctx.fillStyle = '#facc15';
                for (let y = 20; y < 1024; y += 64) {
                    ctx.fillRect(252, y, 8, 36);
                }

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(1, 32);
                tex.anisotropy = 8;
                return tex;
            },

            createWaterNormalTexture(size = 256) {
                const c = document.createElement('canvas');
                c.width = size;
                c.height = size;
                const ctx = c.getContext('2d');
                const imgData = ctx.createImageData(size, size);
                const data = imgData.data;

                // Ultra-gentle, low-frequency rolling water harmonics (no harsh micro-ripples or sharp crests)
                const harmonics = [
                    [  2,   2, 0.45, 0.0 ],
                    [  3,  -2, 0.35, 1.4 ],
                    [ -2,   4, 0.25, 2.7 ],
                    [  4,   3, 0.18, 0.9 ]
                ];

                const twoPi = Math.PI * 2.0;
                const waves = harmonics.map(h => ({
                    kx: h[0],
                    ky: h[1],
                    coeffU: h[2] * twoPi * h[0],
                    coeffV: h[2] * twoPi * h[1],
                    phase: h[3]
                }));

                const slopeScale = 0.015;
                let ptr = 0;

                for (let y = 0; y < size; y++) {
                    const v = y / size;
                    for (let x = 0; x < size; x++) {
                        const u = x / size;
                        let dhDu = 0.0;
                        let dhDv = 0.0;

                        for (let i = 0; i < waves.length; i++) {
                            const w = waves[i];
                            const theta = twoPi * (w.kx * u + w.ky * v) + w.phase;
                            const c = Math.cos(theta);
                            dhDu += w.coeffU * c;
                            dhDv += w.coeffV * c;
                        }

                        let nx = -dhDu * slopeScale;
                        let ny = -dhDv * slopeScale;
                        let nz = 1.0;
                        const invLen = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
                        nx *= invLen;
                        ny *= invLen;
                        nz *= invLen;

                        data[ptr]     = Math.floor((nx * 0.5 + 0.5) * 255);
                        data[ptr + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
                        data[ptr + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
                        data[ptr + 3] = 255;
                        ptr += 4;
                    }
                }

                ctx.putImageData(imgData, 0, 0);

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.anisotropy = 4;
                return tex;
            },
