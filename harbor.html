        const HarborCollisionSystem = {
            circles: [],
            segments: [],

            init() {
                this.circles = [];
                this.segments = [];

                // 1. North Breakwater Spine & North Lighthouse (from (70, -126) to (32, -104))
                for (let i = 0; i <= 18; i++) {
                    const t = i / 18;
                    const bx = 70 - t * 38;
                    const bz = -126 + Math.sin(t * Math.PI * 0.5) * 22;
                    this.circles.push({ x: bx, z: bz, r: 5.6, tag: 'breakwater' });
                }
                this.circles.push({ x: 32, z: -104, r: 6.2, tag: 'lighthouse' });

                // 2. South Breakwater Spine & South Lighthouse (from (70, 122) to (28, 96))
                for (let i = 0; i <= 20; i++) {
                    const t = i / 20;
                    const bx = 70 - t * 42;
                    const bz = 122 - Math.sin(t * Math.PI * 0.5) * 26;
                    this.circles.push({ x: bx, z: bz, r: 5.8, tag: 'breakwater' });
                }
                this.circles.push({ x: 28, z: 96, r: 6.4, tag: 'lighthouse' });

                // 3. Three South Marina Wooden Finger Piers (Z = 96, 112, 126, X from -24.5 to -5.5)
                [96, 112, 126].forEach(pz => {
                    this.segments.push({
                        ax: -24.5, az: pz,
                        bx: -5.2,  bz: pz,
                        r: 2.35,
                        tag: 'pier'
                    });
                });

                // 4. Ten Lateral Channel Buoys
                const buoyZStations = [-124, -52, 16, 82, 118];
                buoyZStations.forEach(bz => {
                    this.circles.push({ x: -2.5, z: bz, r: 1.75, tag: 'buoy' });
                    this.circles.push({ x: 24.5, z: bz, r: 1.75, tag: 'buoy' });
                });
            },

            // Normalize angle difference into [-PI, +PI]
            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            },

            // Shortest angular interpolation without wrap-around glitches
            lerpAngle(fromAngle, toAngle, t) {
                const diff = this.normalizeAngle(toAngle - fromAngle);
                return fromAngle + diff * t;
            },

            // Compute a vessel's 2D capsule endpoints (Stern A to Bow B) and radius R
            getShipCapsule(ship, posOverride = null, headingOverride = null) {
                const pos = posOverride || ship.position;
                const hdg = headingOverride !== null ? headingOverride : ship.heading;
                const r = ship.beam * 0.52;
                const halfSeg = Math.max(0.5, ship.length * 0.47 - r);
                const sinH = Math.sin(hdg);
                const cosH = Math.cos(hdg);
                return {
                    ax: pos.x - sinH * halfSeg,
                    az: pos.z - cosH * halfSeg,
                    bx: pos.x + sinH * halfSeg,
                    bz: pos.z + cosH * halfSeg,
                    r,
                    halfSeg
                };
            },

            // Closest point on 2D segment AB to point P
            closestPointOnSegment(px, pz, ax, az, bx, bz) {
                const abx = bx - ax;
                const abz = bz - az;
                const lenSq = abx * abx + abz * abz;
                if (lenSq < 1e-6) return { x: ax, z: az, t: 0 };
                const t = THREE.MathUtils.clamp(((px - ax) * abx + (pz - az) * abz) / lenSq, 0.0, 1.0);
                return { x: ax + t * abx, z: az + t * abz, t };
            },

            // Closest pair of points between two 2D line segments A1-B1 and A2-B2
            closestPointsBetweenSegments(a1x, a1z, b1x, b1z, a2x, a2z, b2x, b2z) {
                const d1x = b1x - a1x, d1z = b1z - a1z;
                const d2x = b2x - a2x, d2z = b2z - a2z;
                const rx = a1x - a2x, rz = a1z - a2z;
                const a = d1x * d1x + d1z * d1z;
                const e = d2x * d2x + d2z * d2z;
                const f = d2x * rx + d2z * rz;

                let s = 0.0, t = 0.0;
                if (a <= 1e-6 && e <= 1e-6) {
                    s = t = 0.0;
                } else if (a <= 1e-6) {
                    s = 0.0;
                    t = THREE.MathUtils.clamp(f / e, 0.0, 1.0);
                } else {
                    const c = d1x * rx + d1z * rz;
                    if (e <= 1e-6) {
                        t = 0.0;
                        s = THREE.MathUtils.clamp(-c / a, 0.0, 1.0);
                    } else {
                        const b = d1x * d2x + d1z * d2z;
                        const denom = a * e - b * b;
                        if (denom !== 0.0) {
                            s = THREE.MathUtils.clamp((b * f - c * e) / denom, 0.0, 1.0);
                        } else {
                            s = 0.0;
                        }
                        t = (b * s + f) / e;
                        if (t < 0.0) {
                            t = 0.0;
                            s = THREE.MathUtils.clamp(-c / a, 0.0, 1.0);
                        } else if (t > 1.0) {
                            t = 1.0;
                            s = THREE.MathUtils.clamp((b - c) / a, 0.0, 1.0);
                        }
                    }
                }

                const p1x = a1x + d1x * s;
                const p1z = a1z + d1z * s;
                const p2x = a2x + d2x * t;
                const p2z = a2z + d2z * t;
                return { p1x, p1z, p2x, p2z, s, t };
            },

            // Sanitize a user-clicked or AI target point so it never sits inside a breakwater, pier, buoy, or moored ship
            sanitizeTargetPoint(tx, tz, ship, allShips) {
                const isSmall = ship && (ship.vesselClass !== 'FREIGHTER' && ship.vesselClass !== 'FEEDER' && ship.vesselClass !== 'TANKER');
                let minX = isSmall ? 33.0 : (QUAY_X + ship.beam + 2.0);
                let maxX = isSmall ? 57.0 : (MAX_X - ship.beam - 2.0);
                let minZ = isSmall ? -82.0 : (-HALF_Z + ship.length * 0.6);
                let maxZ = isSmall ? 78.0 : (HALF_Z - ship.length * 0.6);

                let x = THREE.MathUtils.clamp(tx, minX, maxX);
                let z = THREE.MathUtils.clamp(tz, minZ, maxZ);

                if (!isSmall && z > 84 && x < -2.5) {
                    x = -2.0;
                }

                for (let iter = 0; iter < 6; iter++) {
                    for (let i = 0; i < this.circles.length; i++) {
                        const c = this.circles[i];
                        const minD = c.r + ship.length * 0.55 + 1.5;
                        const dx = x - c.x;
                        const dz = z - c.z;
                        const d = Math.hypot(dx, dz);
                        if (d < minD) {
                            const nx = d > 0.01 ? dx / d : -1;
                            const nz = d > 0.01 ? dz / d : 0;
                            x = c.x + nx * minD;
                            z = c.z + nz * minD;
                        }
                    }
                    for (let i = 0; i < this.segments.length; i++) {
                        const seg = this.segments[i];
                        const cp = this.closestPointOnSegment(x, z, seg.ax, seg.az, seg.bx, seg.bz);
                        const minD = seg.r + ship.length * 0.55 + 1.5;
                        const dx = x - cp.x;
                        const dz = z - cp.z;
                        const d = Math.hypot(dx, dz);
                        if (d < minD) {
                            const nx = d > 0.01 ? dx / d : 1;
                            const nz = d > 0.01 ? dz / d : 0;
                            x = cp.x + nx * minD;
                            z = cp.z + nz * minD;
                        }
                    }
                    for (let i = 0; i < allShips.length; i++) {
                        const other = allShips[i];
                        if (other === ship) continue;
                        if (other.state === 'MOORED_OPS' || other.state === 'MOORED_MARINA') {
                            const oCap = this.getShipCapsule(other);
                            const cp = this.closestPointOnSegment(x, z, oCap.ax, oCap.az, oCap.bx, oCap.bz);
                            const minD = oCap.r + ship.length * 0.55 + 2.2;
                            const dx = x - cp.x;
                            const dz = z - cp.z;
                            const d = Math.hypot(dx, dz);
                            if (d < minD) {
                                const nx = d > 0.01 ? dx / d : 1;
                                const nz = d > 0.01 ? dz / d : 0;
                                x = cp.x + nx * minD;
                                z = cp.z + nz * minD;
                            }
                        }
                    }
                }

                if (isSmall) {
                    x = THREE.MathUtils.clamp(x, 32.5, 57.5);
                    z = THREE.MathUtils.clamp(z, -83.0, 78.5);
                } else {
                    x = THREE.MathUtils.clamp(x, QUAY_X + ship.beam + 2.0, MAX_X - ship.beam - 2.0);
                    z = THREE.MathUtils.clamp(z, -HALF_Z + ship.length * 0.6, HALF_Z - ship.length * 0.6);
                }
                return { x, z };
            },

            // Evaluate minimum clearance along a candidate heading feeler up to lookaheadDist
            evaluateFeelerClearance(ship, candHeading, lookaheadDist, allShips) {
                const sinH = Math.sin(candHeading);
                const cosH = Math.cos(candHeading);
                const r = ship.beam * 0.55 + 0.9;
                const startX = ship.position.x;
                const startZ = ship.position.z;
                const endX = startX + sinH * lookaheadDist;
                const endZ = startZ + cosH * lookaheadDist;

                let minClearance = lookaheadDist;

                const steps = 4;
                const isSmall = ship && (ship.vesselClass !== 'FREIGHTER' && ship.vesselClass !== 'FEEDER' && ship.vesselClass !== 'TANKER');
                for (let s = 1; s <= steps; s++) {
                    const frac = s / steps;
                    const dist = frac * lookaheadDist;
                    const sx = startX + sinH * dist;
                    const sz = startZ + cosH * dist;

                    if (isSmall) {
                        if (sx < 32.2 || sx > 57.8 || sz < -84.0 || sz > 79.0) {
                            minClearance = Math.min(minClearance, dist - r);
                            break;
                        }
                    } else {
                        const quayLimit = (sz > 84) ? -4.5 : (QUAY_X + r + 1.5);
                        if (sx < quayLimit || sx > MAX_X - r - 2.0 || sz < -HALF_Z + r + 3.0 || sz > HALF_Z - r - 3.0) {
                            minClearance = Math.min(minClearance, dist - r);
                            break;
                        }
                    }
                }

                for (let i = 0; i < this.circles.length; i++) {
                    const c = this.circles[i];
                    const cp = this.closestPointOnSegment(c.x, c.z, startX, startZ, endX, endZ);
                    const d = Math.hypot(c.x - cp.x, c.z - cp.z);
                    const combinedR = r + c.r + 0.8;
                    if (d < combinedR) {
                        const hitDist = Math.max(0, cp.t * lookaheadDist - (combinedR - d));
                        minClearance = Math.min(minClearance, hitDist);
                    }
                }

                for (let i = 0; i < this.segments.length; i++) {
                    const seg = this.segments[i];
                    const res = this.closestPointsBetweenSegments(startX, startZ, endX, endZ, seg.ax, seg.az, seg.bx, seg.bz);
                    const d = Math.hypot(res.p1x - res.p2x, res.p1z - res.p2z);
                    const combinedR = r + seg.r + 0.8;
                    if (d < combinedR) {
                        const hitDist = Math.max(0, res.s * lookaheadDist - (combinedR - d));
                        minClearance = Math.min(minClearance, hitDist);
                    }
                }

                for (let i = 0; i < allShips.length; i++) {
                    const other = allShips[i];
                    if (other === ship) continue;

                    const otherSin = Math.sin(other.heading);
                    const otherCos = Math.cos(other.heading);
                    for (let predStep = 0; predStep <= 1; predStep++) {
                        const dtPred = predStep * 1.8;
                        const predPos = {
                            x: other.position.x + otherSin * other.speed * dtPred,
                            z: other.position.z + otherCos * other.speed * dtPred
                        };
                        const oCap = this.getShipCapsule(other, predPos, other.heading);
                        const res = this.closestPointsBetweenSegments(startX, startZ, endX, endZ, oCap.ax, oCap.az, oCap.bx, oCap.bz);
                        const d = Math.hypot(res.p1x - res.p2x, res.p1z - res.p2z);
                        const combinedR = r + oCap.r + 1.4;
                        if (d < combinedR) {
                            const hitDist = Math.max(0, res.s * lookaheadDist - (combinedR - d));
                            minClearance = Math.min(minClearance, hitDist);
                        }
                    }
                }

                return Math.max(0, minClearance);
            },

            // Compute safe steering heading and speed multiplier for a navigating vessel
            computeSafeNavigation(ship, desiredHeading, distToGoal, allShips) {
                const lookaheadDist = Math.min(25.0, Math.max(13.0, ship.length * 1.65));
                const candidateOffsets = [
                    0.0,
                    0.22, -0.22,
                    0.45, -0.45,
                    0.72, -0.72,
                    1.05, -1.05,
                    1.42, -1.42,
                    1.85, -1.85
                ];

                let bestHeading = desiredHeading;
                let bestScore = -1e9;
                let forwardClearance = this.evaluateFeelerClearance(ship, ship.heading, lookaheadDist, allShips);

                for (let i = 0; i < candidateOffsets.length; i++) {
                    const offset = candidateOffsets[i];
                    const candHeading = ship.heading + this.normalizeAngle(desiredHeading - ship.heading) + offset;
                    const clearance = this.evaluateFeelerClearance(ship, candHeading, lookaheadDist, allShips);

                    const goalDiff = Math.abs(this.normalizeAngle(candHeading - desiredHeading));
                    const currDiff = Math.abs(this.normalizeAngle(candHeading - ship.heading));

                    const effectiveClearance = (clearance >= distToGoal) ? lookaheadDist : clearance;

                    let score = effectiveClearance * 3.2 - goalDiff * 8.5 - currDiff * 3.0;
                    if (offset > 0) score += 0.25;
                    if (effectiveClearance < ship.length * 0.65) {
                        score -= 60.0;
                    }

                    if (score > bestScore) {
                        bestScore = score;
                        bestHeading = candHeading;
                    }
                }

                const chosenClearance = this.evaluateFeelerClearance(ship, bestHeading, lookaheadDist, allShips);
                const minAvail = Math.min(forwardClearance, chosenClearance);
                const safeStopDist = ship.length * 0.58 + 1.4;
                let speedFactor = THREE.MathUtils.clamp((minAvail - safeStopDist) / (lookaheadDist - safeStopDist), 0.12, 1.0);
                if (forwardClearance < safeStopDist) {
                    speedFactor = 0.05;
                }

                return {
                    heading: bestHeading,
                    speedFactor
                };
            },

            isShipImmovable(ship) {
                return ship.state === 'MOORED_OPS' || ship.state === 'MOORED_MARINA';
            },

            getShipInverseMass(ship) {
                if (this.isShipImmovable(ship)) return 0.0;
                if (ship.vesselClass === 'FREIGHTER' || ship.vesselClass === 'FEEDER') return 0.15;
                return 1.0;
            },

            // Hard positional separation pass guaranteeing zero hull overlap with any vessel or static structure
            resolveAllCollisions(allShips) {
                const iterations = 3;
                for (let iter = 0; iter < iterations; iter++) {
                    for (let i = 0; i < allShips.length; i++) {
                        const ship = allShips[i];
                        if (this.isShipImmovable(ship)) continue;

                        let cap = this.getShipCapsule(ship);

                        const minQuayX = QUAY_X + cap.r + 0.85;
                        const minHullX = Math.min(cap.ax, cap.bx);
                        if (minHullX < minQuayX) {
                            ship.position.x += (minQuayX - minHullX);
                            cap = this.getShipCapsule(ship);
                        }

                        const maxHullX = Math.max(cap.ax, cap.bx);
                        const maxEastX = MAX_X - cap.r - 1.2;
                        if (maxHullX > maxEastX) {
                            ship.position.x -= (maxHullX - maxEastX);
                            cap = this.getShipCapsule(ship);
                        }

                        if (ship.vesselClass !== 'FREIGHTER' && ship.vesselClass !== 'FEEDER') {
                            const minHullZ = Math.min(cap.ax !== undefined ? cap.az : ship.position.z, cap.bz);
                            const maxHullZ = Math.max(cap.az, cap.bz);
                            const zLimit = HALF_Z - cap.r - 2.0;
                            if (minHullZ < -zLimit) ship.position.z += (-zLimit - minHullZ);
                            if (maxHullZ > zLimit) ship.position.z -= (maxHullZ - zLimit);
                            cap = this.getShipCapsule(ship);
                        }

                        const isSmallCraft = (ship.vesselClass !== 'FREIGHTER' && ship.vesselClass !== 'FEEDER' && ship.vesselClass !== 'TANKER');
                        if (isSmallCraft) {
                            if (ship.position.x < 32.8) ship.position.x = 32.8;
                            if (ship.position.x > 57.2) ship.position.x = 57.2;
                            if (ship.position.z < -82.5) ship.position.z = -82.5;
                            if (ship.position.z > 78.0) ship.position.z = 78.0;
                            cap = this.getShipCapsule(ship);
                        }

                        for (let cIdx = 0; cIdx < this.circles.length; cIdx++) {
                            const c = this.circles[cIdx];
                            const cp = this.closestPointOnSegment(c.x, c.z, cap.ax, cap.az, cap.bx, cap.bz);
                            const dx = cp.x - c.x;
                            const dz = cp.z - c.z;
                            const dist = Math.hypot(dx, dz);
                            const minDist = cap.r + c.r + 0.45;
                            if (dist < minDist) {
                                const nx = dist > 1e-4 ? dx / dist : 1.0;
                                const nz = dist > 1e-4 ? dz / dist : 0.0;
                                const overlap = minDist - dist;
                                ship.position.x += nx * overlap;
                                ship.position.z += nz * overlap;
                                ship.speed *= 0.88;
                                cap = this.getShipCapsule(ship);
                            }
                        }

                        for (let sIdx = 0; sIdx < this.segments.length; sIdx++) {
                            const seg = this.segments[sIdx];
                            const res = this.closestPointsBetweenSegments(
                                cap.ax, cap.az, cap.bx, cap.bz,
                                seg.ax, seg.az, seg.bx, seg.bz
                            );
                            const dx = res.p1x - res.p2x;
                            const dz = res.p1z - res.p2z;
                            const dist = Math.hypot(dx, dz);
                            const minDist = cap.r + seg.r + 0.45;
                            if (dist < minDist) {
                                const nx = dist > 1e-4 ? dx / dist : 1.0;
                                const nz = dist > 1e-4 ? dz / dist : 0.0;
                                const overlap = minDist - dist;
                                ship.position.x += nx * overlap;
                                ship.position.z += nz * overlap;
                                ship.speed *= 0.85;
                                cap = this.getShipCapsule(ship);
                            }
                        }
                    }

                    for (let i = 0; i < allShips.length; i++) {
                        for (let j = i + 1; j < allShips.length; j++) {
                            const s1 = allShips[i];
                            const s2 = allShips[j];
                            const w1 = this.getShipInverseMass(s1);
                            const w2 = this.getShipInverseMass(s2);
                            if (w1 + w2 === 0.0) continue;

                            const c1 = this.getShipCapsule(s1);
                            const c2 = this.getShipCapsule(s2);
                            const res = this.closestPointsBetweenSegments(
                                c1.ax, c1.az, c1.bx, c1.bz,
                                c2.ax, c2.az, c2.bx, c2.bz
                            );

                            let dx = res.p1x - res.p2x;
                            let dz = res.p1z - res.p2z;
                            let dist = Math.hypot(dx, dz);
                            const minDist = c1.r + c2.r + 0.75;

                            if (dist < minDist) {
                                if (dist < 1e-4) {
                                    dx = s1.position.x - s2.position.x;
                                    dz = s1.position.z - s2.position.z;
                                    dist = Math.hypot(dx, dz) || 1.0;
                                }
                                const nx = dx / dist;
                                const nz = dz / dist;
                                const overlap = minDist - dist;
                                const totalW = w1 + w2;

                                s1.position.x += nx * overlap * (w1 / totalW);
                                s1.position.z += nz * overlap * (w1 / totalW);
                                s2.position.x -= nx * overlap * (w2 / totalW);
                                s2.position.z -= nz * overlap * (w2 / totalW);

                                if (w1 >= w2 && w1 > 0) {
                                    s1.speed *= 0.90;
                                    const escapeHeading = Math.atan2(nx, nz);
                                    s1.heading = this.lerpAngle(s1.heading, escapeHeading, 0.06);
                                }
                                if (w2 >= w1 && w2 > 0) {
                                    s2.speed *= 0.90;
                                    const escapeHeading = Math.atan2(-nx, -nz);
                                    s2.heading = this.lerpAngle(s2.heading, escapeHeading, 0.06);
                                }
                            }
                        }
                    }
                }

                for (let i = 0; i < allShips.length; i++) {
                    const s = allShips[i];
                    s.root.position.x = s.position.x;
                    s.root.position.z = s.position.z;
                    s.root.rotation.y = s.heading;
                }
            }
        };

        HarborCollisionSystem.init();

        buildExpandedSeaportAndUnderwater();

        // 4. EXPANDED MARINE ECOSYSTEM: 520 REALISTIC SCHOOLING FISH & GLIDING MANTA RAYS
        // ============================================================================
        function createSculptedFishGeometry() {
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const indices = [];

            function pushVert(x, y, z, r, g, b) {
                positions.push(x, y, z);
                colors.push(r, g, b);
            }

            // 8 cross-sectional body rings with natural counter-shading
            const rings = [
                { z:  0.68, rx: 0.015, ry: 0.015 }, // 0: Snout tip
                { z:  0.55, rx: 0.11,  ry: 0.15 },  // 1: Mouth & eyes
                { z:  0.38, rx: 0.19,  ry: 0.28 },  // 2: Gills & operculum
                { z:  0.15, rx: 0.23,  ry: 0.36 },  // 3: Deepest chest
                { z: -0.10, rx: 0.21,  ry: 0.32 },  // 4: Mid torso
                { z: -0.32, rx: 0.15,  ry: 0.22 },  // 5: Rear flank
                { z: -0.52, rx: 0.08,  ry: 0.13 },  // 6: Caudal peduncle
                { z: -0.66, rx: 0.035, ry: 0.07 }   // 7: Tail wrist
            ];

            const ringSegments = 8;
            for (let r = 0; r < rings.length; r++) {
                const ring = rings[r];
                for (let s = 0; s < ringSegments; s++) {
                    const ang = (s / ringSegments) * Math.PI * 2;
                    const cosA = Math.cos(ang);
                    const sinA = Math.sin(ang);

                    const x = cosA * ring.rx;
                    const y = sinA * ring.ry;
                    const z = ring.z;

                    // Counter-shading: dorsal dark ocean indigo, flank iridescent silver, belly white
                    let cr, cg, cb;
                    if (sinA > 0.35) {
                        cr = 0.06; cg = 0.32; cb = 0.58;
                    } else if (sinA < -0.35) {
                        cr = 0.94; cg = 0.96; cb = 0.98;
                    } else {
                        cr = 0.48; cg = 0.78; cb = 0.92;
                    }
                    pushVert(x, y, z, cr, cg, cb);
                }
            }

            for (let r = 0; r < rings.length - 1; r++) {
                const r1 = r * ringSegments;
                const r2 = (r + 1) * ringSegments;
                for (let s = 0; s < ringSegments; s++) {
                    const sNext = (s + 1) % ringSegments;
                    indices.push(r1 + s, r2 + s, r1 + sNext);
                    indices.push(r1 + sNext, r2 + s, r2 + sNext);
                }
            }

            // Snout nose cone cap
            const snoutIdx = positions.length / 3;
            pushVert(0, 0, 0.74, 0.08, 0.38, 0.62);
            for (let s = 0; s < ringSegments; s++) {
                const sNext = (s + 1) % ringSegments;
                indices.push(snoutIdx, sNext, s);
            }

            // Vertical crescent caudal fin (tail)
            const tailStart = rings[rings.length - 1].z;
            const tailBaseIdx = positions.length / 3;
            pushVert( 0.00,  0.00, tailStart,        0.30, 0.70, 0.85); // base
            pushVert( 0.00,  0.34, tailStart - 0.36, 0.18, 0.52, 0.75); // top lobe tip
            pushVert( 0.00,  0.08, tailStart - 0.22, 0.38, 0.78, 0.92); // upper fork
            pushVert( 0.00,  0.00, tailStart - 0.18, 0.45, 0.82, 0.96); // center notch
            pushVert( 0.00, -0.08, tailStart - 0.22, 0.38, 0.78, 0.92); // lower fork
            pushVert( 0.00, -0.34, tailStart - 0.36, 0.18, 0.52, 0.75); // bot lobe tip

            indices.push(tailBaseIdx + 0, tailBaseIdx + 1, tailBaseIdx + 2);
            indices.push(tailBaseIdx + 0, tailBaseIdx + 2, tailBaseIdx + 3);
            indices.push(tailBaseIdx + 0, tailBaseIdx + 3, tailBaseIdx + 4);
            indices.push(tailBaseIdx + 0, tailBaseIdx + 4, tailBaseIdx + 5);
            // Double-sided tail
            indices.push(tailBaseIdx + 0, tailBaseIdx + 2, tailBaseIdx + 1);
            indices.push(tailBaseIdx + 0, tailBaseIdx + 3, tailBaseIdx + 2);
            indices.push(tailBaseIdx + 0, tailBaseIdx + 4, tailBaseIdx + 3);
            indices.push(tailBaseIdx + 0, tailBaseIdx + 5, tailBaseIdx + 4);

            // Dorsal sail fin along spine
            const dorsalIdx = positions.length / 3;
            pushVert(0.0, 0.36,  0.20, 0.10, 0.42, 0.65);
            pushVert(0.0, 0.54, -0.04, 0.08, 0.36, 0.58);
            pushVert(0.0, 0.26, -0.28, 0.14, 0.46, 0.70);
            indices.push(dorsalIdx, dorsalIdx + 1, dorsalIdx + 2);
            indices.push(dorsalIdx, dorsalIdx + 2, dorsalIdx + 1);

            // Pectoral fins on left and right flanks
            [-1, 1].forEach(side => {
                const pecIdx = positions.length / 3;
                pushVert(side * 0.18, -0.05,  0.24, 0.35, 0.72, 0.88);
                pushVert(side * 0.48, -0.16,  0.08, 0.25, 0.62, 0.80);
                pushVert(side * 0.20, -0.12,  0.10, 0.30, 0.68, 0.85);
                indices.push(pecIdx, pecIdx + 1, pecIdx + 2);
                indices.push(pecIdx, pecIdx + 2, pecIdx + 1);
            });

            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        class ExpandedMarineEcosystem {
            constructor(totalFish = 520) {
                this.count = totalFish;
                const fishGeo = createSculptedFishGeometry();

                const fishMat = new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    roughness: 0.22,
                    metalness: 0.68,
                    clippingPlanes: dioramaClipPlanes
                });
                NightEnvironment.fluorescentMaterials.push({ mat: fishMat, dayIntensity: 0.35, maxIntensity: 2.2 });

                this.instancedMesh = new THREE.InstancedMesh(fishGeo, fishMat, this.count);
                this.instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                worldGroup.add(this.instancedMesh);

                this.dummy = new THREE.Object3D();
                this.fishData = [];

                // 7 distinct marine schools across varying depths and marine habitats
                this.schools = [
                    { center: new THREE.Vector3(8, -4.5, -105), radius: 22, angle: 0.0, speed: 0.36, speciesColor: new THREE.Color(0x38bdf8) }, // Mackerel
                    { center: new THREE.Vector3(44, -5.8, -80), radius: 26, angle: 1.5, speed: 0.30, speciesColor: new THREE.Color(0xf59e0b) }, // Amberjack
                    { center: new THREE.Vector3(10, -6.8, -40), radius: 24, angle: 3.1, speed: 0.34, speciesColor: new THREE.Color(0x10b981) }, // Reef Bass
                    { center: new THREE.Vector3(46, -4.2, -14), radius: 28, angle: 0.8, speed: 0.32, speciesColor: new THREE.Color(0xf8fafc) }, // Silver Herring (Shipwreck)

            update(dt, time) {
                // Compute leader trajectory and orientation for each of the 5 flocks
                const flockLeads = [];
                for (let f = 0; f < this.flocks.length; f++) {
                    const flk = this.flocks[f];
                    const flockAngle = time * flk.speed + flk.phase;
                    const fx = flk.cx + Math.cos(flockAngle) * flk.rx;
                    const fz = flk.cz + Math.sin(flockAngle) * flk.rz;
                    const fy = flk.baseAlt + Math.sin(flockAngle * 2.0) * flk.altRange;

                    const tanX = -Math.sin(flockAngle) * flk.rx;
                    const tanZ = Math.cos(flockAngle) * flk.rz;
                    const tanLen = Math.hypot(tanX, tanZ) || 1.0;
                    const fwdX = tanX / tanLen;
                    const fwdZ = tanZ / tanLen;
                    const rightX = fwdZ;
                    const rightZ = -fwdX;
                    const heading = Math.atan2(fwdX, fwdZ);
                    const bankAngle = -flk.speed * 1.6;

                    flockLeads.push({
                        fx, fy, fz,
                        fwdX, fwdZ,
                        rightX, rightZ,
                        heading, bankAngle
                    });
                }

                // Update individual birds within their respective flocks
                for (let i = 0; i < this.birds.length; i++) {
                    const b = this.birds[i];
                    const fl = flockLeads[b.flockIdx];

                    // Subtle organic breathing motion within the formation (relaxed tempo matching 2/3 speed)
                    const bobX = Math.sin(time * 1.3 + b.birdPhase) * 0.35;
                    const bobY = Math.cos(time * 1.6 + b.birdPhase) * 0.28;
                    const bobZ = Math.sin(time * 1.1 + b.birdPhase) * 0.35;

                    const bx = fl.fx - fl.fwdX * b.alongTrack + fl.rightX * (b.crossTrack + bobX);
                    const bz = fl.fz - fl.fwdZ * b.alongTrack + fl.rightZ * (b.crossTrack + bobZ);
                    const by = fl.fy + b.vertOffset + bobY;

                        Math.cos(time * 0.9 + b.birdPhase) * 0.05, // gentle pitch
                        fl.heading + bobX * 0.07,                  // yaw following flock heading
                        fl.bankAngle + bobY * 0.05                // banking into turn

                    b.glideTimer += dt;
                    if (b.isGliding) {

                            b.glideTimer = 0;

        const WATER_W = WATER_MAX_X - WATER_MIN_X; // 94 units
        const WATER_D = WORLD_Z; // 280 units

        const ePos = eastWaterWallGeo.attributes.position;

        // Inject a localized Gaussian wave impulse + foam signature into the 2D Wave Grid
        function disturbWaterGrid(wx, wz, strength = 0.45, radius = 2.6, foamAmount = 0.65) {
            const u = (wx - WATER_MIN_X) / WATER_W;
            const v = (wz + HALF_Z) / WATER_D;
            if (u < 0.01 || u > 0.99 || v < 0.01 || v > 0.99) return;

            const cx = Math.round(u * GRID_NX);
            const cz = Math.round(v * GRID_NZ);
            const rx = Math.ceil((radius / WATER_W) * GRID_NX);
            const rz = Math.ceil((radius / WATER_D) * GRID_NZ);

            for (let dz = -rz; dz <= rz; dz++) {
                const iz = cz + dz;
                if (iz <= 1 || iz >= GRID_NZ - 1) continue;
                for (let dx = -rx; dx <= rx; dx++) {
                    const ix = cx + dx;
                    if (ix <= 1 || ix >= GRID_NX - 1) continue;
                    const worldDx = (dx / GRID_NX) * WATER_W;
                    const worldDz = (dz / GRID_NZ) * WATER_D;
                    const distSq = worldDx * worldDx + worldDz * worldDz;
                    const radSq = radius * radius;
                    if (distSq < radSq) {
                        const falloff = Math.exp(-distSq / (radSq * 0.48));
                        const idx = iz * COLS + ix;
                        currWave[idx] = THREE.MathUtils.clamp(currWave[idx] + strength * falloff, -1.35, 1.35);
                        if (foamAmount > 0) {
                            foamTrailGrid[idx] = Math.min(1.0, foamTrailGrid[idx] + foamAmount * falloff);
                        }
                    }
                }
            }
        }

        // Slow, sculpted 3D ocean swells with trochoidal crest-sharpening so the surface has visible rolling hills & troughs
        function evaluateBaseOceanSwell(wx, wz, time) {
            // 1. Primary long-period diagonal harbor swell rolling in from the open sea (+X / -Z)
            const p1 = wx * 0.062 + wz * 0.034 + time * 0.56;
            const s1 = Math.sin(p1);
            // Trochoidal Gerstner-like peak sharpening: slightly narrower crests and broader, deeper troughs
            const swell1 = (s1 + 0.22 * (s1 * s1 - 0.5)) * 0.72;

            // 2. Secondary cross-swell creating 3D diamond wave interference hills across the basin
            const p2 = wx * 0.044 - wz * 0.058 - time * 0.46;
            const s2 = Math.cos(p2);
            const swell2 = (s2 + 0.18 * (s2 * s2 - 0.5)) * 0.54;

            // 3. Medium rolling harbor undulation for visible surface tilt and normal variation
            const p3 = (wx * 0.78 + wz * 0.62) * 0.095 - time * 0.64;
            const swell3 = Math.sin(p3) * 0.34;

            // 4. Slow secondary cross-roller so no patch of water ever sits flat
            const p4 = (wx * 0.52 - wz * 0.85) * 0.125 + time * 0.52;
            const swell4 = Math.cos(p4) * 0.22;

            // Gently attenuate swell amplitude right against the concrete quay wall (-24) so docked ships heave smoothly
            const quayDist = THREE.MathUtils.clamp((wx - WATER_MIN_X) / 14.0, 0.48, 1.0);
            return (swell1 + swell2 + swell3 + swell4) * quayDist;
        }
        const getAmbientWaveHeight = evaluateBaseOceanSwell;

        // Bilinear lookup of the live 2D shallow-water wave heightfield at any world (wx, wz)
        function sample2DWaveGrid(wx, wz) {
            const u = (wx - WATER_MIN_X) / WATER_W;
            const v = (wz + HALF_Z) / WATER_D;
            if (u < 0 || u > 1 || v < 0 || v > 1) return 0;

            const gx = u * GRID_NX;
            const gz = v * GRID_NZ;
            const ix = Math.min(GRID_NX - 1, Math.max(0, Math.floor(gx)));
            const iz = Math.min(GRID_NZ - 1, Math.max(0, Math.floor(gz)));
            const fx = gx - ix;
            const fz = gz - iz;

            const i00 = iz * COLS + ix;
            const i10 = i00 + 1;
            const i01 = i00 + COLS;
            const i11 = i01 + 1;

            const top = currWave[i00] * (1 - fx) + currWave[i10] * fx;
            const bot = currWave[i01] * (1 - fx) + currWave[i11] * fx;
            return top * (1 - fz) + bot * fz;
        }

        // Combined Ocean Heightfield (Gerstner Swell + Real-Time 2D Shallow-Water Wave Grid)
        function sampleOceanSurface(wx, wz, time) {
            return evaluateBaseOceanSwell(wx, wz, time) + sample2DWaveGrid(wx, wz);
        }

        const cAbyssCobalt = new THREE.Color(0x06294f);
        const cDeepSapphire = new THREE.Color(0x093d74);

        const cCyanWake = new THREE.Color(0x38bdf8);

        const cNightAbyss = new THREE.Color(0x020d1f);
        const cNightSapphire = new THREE.Color(0x051e3e);
        const cNightCrest = new THREE.Color(0x0a3c6e);
        const cBioElectricCyan = new THREE.Color(0x00f5d4);
        const cBioNeonAqua = new THREE.Color(0x38bdf8);
        const tempWaterCol = new THREE.Color();
        const tempBaseAbyss = new THREE.Color();

        const tempWakePeak = new THREE.Color();

        function updateOceanSurfaceAndCutawayWalls(time, dt) {
            // 1. Step the Real-Time 2D Shallow-Water Wave Equation with slower propagation & higher open-water damping
            const c2 = 0.088;      // Slower, heavy maritime wave propagation speed
            const damping = 0.962; // Localized damping so boat wakes blend smoothly into the rolling swells

            for (let iz = 1; iz < GRID_NZ; iz++) {
                const rowOffset = iz * COLS;
                for (let ix = 1; ix < GRID_NX; ix++) {
                    const idx = rowOffset + ix;
                    const laplacian = (
                        currWave[idx - 1] +
                        currWave[idx + 1] +
                        currWave[idx - COLS] +
                        currWave[idx + COLS] -
                        4.0 * currWave[idx]
                    );
                    let nextH = (2.0 * currWave[idx] - prevWave[idx] + c2 * laplacian) * damping;
                    if (nextH > 1.35) nextH = 1.35;
                    if (nextH < -1.35) nextH = -1.35;
                    prevWave[idx] = nextH;
                    foamTrailGrid[idx] *= 0.952;
                }
                // Absorbing boundaries on West & East edges so wakes do not bounce back and clutter the basin
                prevWave[rowOffset] = prevWave[rowOffset + 1] * 0.42;
                prevWave[rowOffset + GRID_NX] = prevWave[rowOffset + GRID_NX - 1] * 0.42;
            }

            // Absorbing boundaries on North & South edges
            const southEdgeOffset = GRID_NZ * COLS;
            const southInnerOffset = (GRID_NZ - 1) * COLS;
            for (let ix = 0; ix <= GRID_NX; ix++) {
                prevWave[ix] = prevWave[COLS + ix] * 0.42;
                prevWave[southEdgeOffset + ix] = prevWave[southInnerOffset + ix] * 0.42;
            }

            // Spatial smoothing pass so wave disturbances are broad, rounded, and liquid
            for (let iz = 1; iz < GRID_NZ; iz++) {
                const rowOffset = iz * COLS;
                for (let ix = 1; ix < GRID_NX; ix++) {
                    const idx = rowOffset + ix;
                    const neighborAvg = 0.25 * (
                        prevWave[idx - 1] +
                        prevWave[idx + 1] +
                        prevWave[idx - COLS] +
                        prevWave[idx + COLS]
                    );
                    smoothWaveScratch[idx] = prevWave[idx] * 0.80 + neighborAvg * 0.20;
                }
            }
            for (let iz = 1; iz < GRID_NZ; iz++) {
                const rowOffset = iz * COLS;
                for (let ix = 1; ix < GRID_NX; ix++) {
                    prevWave[rowOffset + ix] = smoothWaveScratch[rowOffset + ix];
                }
            }

            const temp = prevWave;
            prevWave = currWave;
            currWave = temp;

            // 2. Update 3D Water Surface Vertices & Per-Vertex Sapphire/Foam/Bioluminescent Highlights
            const posAttr = waterGeo.attributes.position;
            const normAttr = waterGeo.attributes.normal;
            const colAttr = waterGeo.attributes.color;
            const posArr = posAttr.array;
            const normArr = normAttr.array;
            const colArr = colAttr.array;
            const nMix = NightEnvironment.nightMix;

            tempBaseAbyss.copy(cAbyssCobalt).lerp(cNightAbyss, nMix);
            tempBaseSapphire.copy(cDeepSapphire).lerp(cNightSapphire, nMix);
            tempBaseCrest.copy(cBrightCerulean).lerp(cNightCrest, nMix);
            tempWakePrimary.copy(cCyanWake).lerp(cBioNeonAqua, nMix);
            tempWakePeak.copy(cCrispFoam).lerp(cBioElectricCyan, nMix);

            const t1 = time * 0.56;
            const t2 = -time * 0.46;
            const t3 = -time * 0.64;
            const t4 = time * 0.52;

            const bAbyssR = tempBaseAbyss.r, bAbyssG = tempBaseAbyss.g, bAbyssB = tempBaseAbyss.b;
            const bSaphR = tempBaseSapphire.r, bSaphG = tempBaseSapphire.g, bSaphB = tempBaseSapphire.b;
            const bCrestR = tempBaseCrest.r, bCrestG = tempBaseCrest.g, bCrestB = tempBaseCrest.b;
            const wPrimR = tempWakePrimary.r, wPrimG = tempWakePrimary.g, wPrimB = tempWakePrimary.b;
            const wPeakR = tempWakePeak.r, wPeakG = tempWakePeak.g, wPeakB = tempWakePeak.b;

            const hasNightBio = nMix > 0.01;

            for (let iz = 0; iz <= GRID_NZ; iz++) {
                const rowOffset = iz * COLS;
                const wz = -HALF_Z + (iz / GRID_NZ) * WATER_D;
                for (let ix = 0; ix <= GRID_NX; ix++) {
                    const idx = rowOffset + ix;
                    const idx3 = idx * 3;

                    // Fast precomputed swell evaluation (zero string/geometry overhead)
                    const p1 = precompPhase1[idx] + t1;
                    const s1 = Math.sin(p1);
                    const swell1 = (s1 + 0.22 * (s1 * s1 - 0.5)) * 0.72;

                    const p2 = precompPhase2[idx] + t2;
                    const s2 = Math.cos(p2);
                    const swell2 = (s2 + 0.18 * (s2 * s2 - 0.5)) * 0.54;

                    const p3 = precompPhase3[idx] + t3;
                    const swell3 = Math.sin(p3) * 0.34;

                    const p4 = precompPhase4[idx] + t4;
                    const swell4 = Math.cos(p4) * 0.22;

                    const swellH = (swell1 + swell2 + swell3 + swell4) * precompQuayDist[ix];
                    const simH = currWave[idx];
                    const totalY = swellH + simH;
                    posArr[idx3 + 1] = totalY;

                    // Direct scalar color blending in fast CPU registers
                    const depthBlend = cachedSeabedDepthBlend[idx];
                    const waveBlend = THREE.MathUtils.clamp((totalY + 1.25) * 0.40, 0.0, 1.0);
                    const crestSlopeBoost = waveBlend * Math.sqrt(waveBlend);

                    const blend1 = depthBlend * 0.50 + waveBlend * 0.50;
                    let cr = bAbyssR + (bSaphR - bAbyssR) * blend1;
                    let cg = bAbyssG + (bSaphG - bAbyssG) * blend1;
                    let cb = bAbyssB + (bSaphB - bAbyssB) * blend1;

                    const blend2 = crestSlopeBoost * (0.62 + depthBlend * 0.32);
                    cr += (bCrestR - cr) * blend2;
                    cg += (bCrestG - cg) * blend2;
                    cb += (bCrestB - cb) * blend2;

                    // Compute gentle slope curvature of localized boat wakes + stern foam trail
                    let curvature = Math.abs(simH) * 0.85;
                    if (ix > 0 && ix < GRID_NX && iz > 0 && iz < GRID_NZ) {
                        const dx = currWave[idx + 1] - currWave[idx - 1];
                        const dz = currWave[idx + COLS] - currWave[idx - COLS];
                        curvature += Math.hypot(dx, dz) * 1.15;
                    }

                    const quaySplash = (ix < 2) ? (1.0 - ix * 0.5) * Math.max(0, totalY + 0.25) * 0.30 : 0;
                    const swellCrestHighlight = Math.pow(THREE.MathUtils.clamp((totalY - 0.55) * 0.8695, 0.0, 1.0), 1.6) * (0.38 + nMix * 0.28);
                    const bioWaveShimmer = hasNightBio
                        ? Math.max(0.0, Math.sin((WATER_MIN_X + (ix / GRID_NX) * WATER_W) * 0.22 + wz * 0.18 + time * 1.6) * Math.cos((WATER_MIN_X + (ix / GRID_NX) * WATER_W) * 0.15 - wz * 0.24 - time * 1.2)) * 0.32 * nMix
                        : 0.0;
                    const foamFactor = THREE.MathUtils.clamp(
                        curvature * (0.42 + nMix * 0.45) + foamTrailGrid[idx] * (0.65 + nMix * 0.55) + quaySplash + swellCrestHighlight + bioWaveShimmer,
                        0.0,
                        1.0
                    );

                    if (foamFactor > 0.05) {
                        if (foamFactor < 0.52) {
                            const fNorm = foamFactor / 0.52;
                            cr += (wPrimR - cr) * fNorm;
                            cg += (wPrimG - cg) * fNorm;
                            cb += (wPrimB - cb) * fNorm;
                        } else {
                            const fNorm = (foamFactor - 0.52) / 0.48;
                            cr = wPrimR + (wPeakR - wPrimR) * fNorm;
                            cg = wPrimG + (wPeakG - wPrimG) * fNorm;
                            cb = wPrimB + (wPeakB - wPrimB) * fNorm;
                        }
                    }

                    colArr[idx3]     = cr;
                    colArr[idx3 + 1] = cg;
                    colArr[idx3 + 2] = cb;
                }
            }

            // Fast analytical finite-difference vertex normals with precomputed reciprocal factors
            for (let iz = 0; iz <= GRID_NZ; iz++) {
                const rowOffset = iz * COLS;
                const rowUpOffset = (iz > 0 ? iz - 1 : 0) * COLS;
                const rowDnOffset = (iz < GRID_NZ ? iz + 1 : GRID_NZ) * COLS;

                for (let ix = 0; ix <= GRID_NX; ix++) {
                    const idx = rowOffset + ix;
                    const idx3 = idx * 3;
                    const ixL = ix > 0 ? ix - 1 : 0;
                    const ixR = ix < GRID_NX ? ix + 1 : GRID_NX;

                    const hL = posArr[(rowOffset + ixL) * 3 + 1];
                    const hR = posArr[(rowOffset + ixR) * 3 + 1];
                    const hU = posArr[(rowUpOffset + ix) * 3 + 1];
                    const hD = posArr[(rowDnOffset + ix) * 3 + 1];

                    const nx = (hL - hR) * invTwoDx;
                    const nz = (hU - hD) * invTwoDz;
                    const invLen = 1.0 / Math.sqrt(nx * nx + 1.0 + nz * nz);
                    normArr[idx3]     = nx * invLen;
                    normArr[idx3 + 1] = invLen;
                    normArr[idx3 + 2] = nz * invLen;
                }
            }

            posAttr.needsUpdate = true;
            normAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            // Animate soft, tranquil water surface ripples with slow, gentle drift
            waterNormalTex.offset.x = (time * 0.005) % 1.0;
            waterNormalTex.offset.y = (time * 0.008) % 1.0;
            waterRoughnessTex.offset.x = (time * 0.002) % 1.0;
            waterRoughnessTex.offset.y = (time * 0.003) % 1.0;

            // 3. Ultra-fast direct buffer synchronization for cutaway walls
            const eArr = eastWaterWallGeo.attributes.position.array;
            for (let iz = 0; iz <= GRID_NZ; iz++) {
                const gridIz = GRID_NZ - iz;
                eArr[iz * 3 + 1] = posArr[(gridIz * COLS + GRID_NX) * 3 + 1];
            }
            eastWaterWallGeo.attributes.position.needsUpdate = true;

            const nArr = northWaterWallGeo.attributes.position.array;
            for (let ix = 0; ix <= GRID_NX; ix++) {
                nArr[ix * 3 + 1] = posArr[ix * 3 + 1];
            }
            northWaterWallGeo.attributes.position.needsUpdate = true;

            const sArr = southWaterWallGeo.attributes.position.array;
            const southRowOffset = GRID_NZ * COLS;
            for (let ix = 0; ix <= GRID_NX; ix++) {
                sArr[ix * 3 + 1] = posArr[(southRowOffset + ix) * 3 + 1];
            }
            southWaterWallGeo.attributes.position.needsUpdate = true;
        }

                    new THREE.BoxGeometry(CONTAINER_W + 0.16, 0.42, CONTAINER_L + 0.12),
                    sharedMats.craneYellow
                );
                spreaderBody.castShadow = true;
                this.spreader.add(spreaderBody);

                // Twist-lock status beacon light on top of headblock (Blue = seeking, Amber = locked, Green = released)
                this.statusLightMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
                const statusBulb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), this.statusLightMat);
                statusBulb.position.set(0, 0.68, 0);
                this.spreader.add(statusBulb);

                // 4 Articulated Corner Guide Flippers
                this.flippers = [];
                const flipperGeo = new THREE.BoxGeometry(0.14, 0.52, 0.32);
                flipperGeo.translate(0, -0.24, 0);
                [
                    [-CONTAINER_W * 0.5 - 0.06, -CONTAINER_L * 0.5 + 0.18,  1],
                    [ CONTAINER_W * 0.5 + 0.06, -CONTAINER_L * 0.5 + 0.18, -1],
                    [-CONTAINER_W * 0.5 - 0.06,  CONTAINER_L * 0.5 - 0.18,  1],
                    [ CONTAINER_W * 0.5 + 0.06,  CONTAINER_L * 0.5 - 0.18, -1]
                ].forEach(([fx, fz, sideSign]) => {
                    const flipper = new THREE.Mesh(flipperGeo, sharedMats.craneRed);
                    flipper.position.set(fx, -0.08, fz);
                    this.spreader.add(flipper);
                    this.flippers.push({ mesh: flipper, sideSign });
                });

                worldGroup.add(this.group);

                // 8-Stage State Machine & Kinematic / Pendulum Physics State
                this.state = 'IDLE';
                this.mode = 'UNLOAD'; // Alternates 'UNLOAD' (Ship -> Shore) and 'LOAD' (Shore -> Ship)
                this.lastMode = this.sectorParity === 0 ? 'LOAD' : 'UNLOAD';
                this.targetShip = null;
                this.activeContainer = null;
                this.targetSlot = null;
                this.targetYardStack = null;
                this.lockTimer = 0;

                this.currCraneZ = zPos;
                this.currTrolleyX = 2.0;
                this.currSpreaderY = -3.4;

                this.velCraneZ = 0;
                this.velTrolleyX = 0;
                this.velSpreaderY = 0;

                this.swayX = 0;
                this.swayZ = 0;
                this.swayVelX = 0;
                this.swayVelZ = 0;
                this.flipperAngle = 0.55;
            }

            setFlipperTarget(open) {
                this.targetFlipperAngle = open ? 0.58 : 0.0;
            }

            assignCycle(ship, mode, shipSlot, yardStack) {
                if (this.state !== 'IDLE') return false;
                this.targetShip = ship;
                this.mode = mode;
                this.lastMode = mode;
                this.targetSlot = shipSlot;
                this.targetSlot.reserved = true;
                this.targetYardStack = yardStack;
                if (mode === 'UNLOAD') {
                    this.targetYardStack.reservedDrop = true;
                } else {
                    this.targetYardStack.reservedPick = true;
                }
                this.lockTimer = 0;
                this.statusLightMat.color.setHex(0x38bdf8); // Blue: seeking source container
                this.setFlipperTarget(true);
                this.state = 'ALIGN_TO_SOURCE';
                return true;
            }

            releaseReservations() {
                if (this.targetSlot) {
                    this.targetSlot.reserved = false;
                    this.targetSlot = null;
                }
                if (this.targetYardStack) {
                    this.targetYardStack.reservedPick = false;
                    this.targetYardStack.reservedDrop = false;
                    this.targetYardStack = null;
                }
            }

            abortCycle() {
                this.releaseReservations();
                if (this.activeContainer) {
                    worldGroup.attach(this.activeContainer);
                    this.activeContainer.visible = false;
                    this.activeContainer = null;
                }
                this.state = 'IDLE';
            }

            moveAxisSmooth(curr, vel, target, maxSpeed, maxAccel, dt) {
                const diff = target - curr;
                const dist = Math.abs(diff);
                if (dist < 0.008 && Math.abs(vel) < 0.02) {
                    return { pos: target, vel: 0, accel: 0, done: true };
                }
                const dir = Math.sign(diff);
                const stoppingSpeed = Math.sqrt(2.0 * maxAccel * dist);
                const desiredVel = dir * Math.min(maxSpeed, stoppingSpeed);
                const maxDeltaV = maxAccel * dt;
                const nextVel = curr === target ? 0 : vel + THREE.MathUtils.clamp(desiredVel - vel, -maxDeltaV, maxDeltaV);
                const accel = (nextVel - vel) / Math.max(0.001, dt);
                let nextPos = curr + nextVel * dt;
                if ((dir > 0 && nextPos > target) || (dir < 0 && nextPos < target)) {
                    nextPos = target;
                }
                const done = Math.abs(target - nextPos) < 0.11 && Math.abs(nextVel) < 0.35;
                return { pos: nextPos, vel: nextVel, accel, done };
            }

            update(dt) {
                let desiredZ = this.homeZ;
                let desiredX = 2.0;
                let desiredY = -3.4;

                if (this.state === 'HOIST_CLEAR') {
                    desiredZ = this.currCraneZ;
                    desiredX = this.currTrolleyX;
                    desiredY = -3.4;
                } else if (this.state !== 'IDLE') {
                    if (!this.targetShip || this.targetShip.state !== 'MOORED_OPS' || !this.targetSlot || !this.targetYardStack) {
                        this.abortCycle();
                        return;
                    }

                    // Compute exact live 3D world position of the target slot on the floating ship
                    const slotWorld = new THREE.Vector3();
                    this.targetShip.cargoGroup.localToWorld(slotWorld.copy(this.targetSlot.localPos));

                    // Compute exact 3D world position of the shore yard stack top container
                    const pickStackIdx = Math.max(0, this.targetYardStack.containers.length - 1);
                    const dropStackIdx = this.targetYardStack.containers.length;

                    const yardPickWorld = new THREE.Vector3(
                        this.targetYardStack.x,
                        APRON_Y + CONTAINER_H * 0.5 + pickStackIdx * CONTAINER_H,
                        this.targetYardStack.z
                    );
                    const yardDropWorld = new THREE.Vector3(
                        this.targetYardStack.x,
                        APRON_Y + CONTAINER_H * 0.5 + dropStackIdx * CONTAINER_H,
                        this.targetYardStack.z
                    );

                    const sourceWorld = this.mode === 'UNLOAD' ? slotWorld : yardPickWorld;
                    const destWorld = this.mode === 'UNLOAD' ? yardDropWorld : slotWorld;
                    const trolleyWorldY = APRON_Y + 19.15;

                    switch (this.state) {
                        case 'ALIGN_TO_SOURCE': {
                            desiredZ = THREE.MathUtils.clamp(sourceWorld.z, this.minZ, this.maxZ);
                            desiredX = sourceWorld.x - this.group.position.x;
                            desiredY = -3.4;
                            break;
                        }
                        case 'LOWER_TO_PICK': {
                            desiredZ = THREE.MathUtils.clamp(sourceWorld.z, this.minZ, this.maxZ);
                            desiredX = sourceWorld.x - this.group.position.x;
                            const pickTopY = sourceWorld.y + CONTAINER_H * 0.5 + 0.20;
                            desiredY = pickTopY - trolleyWorldY;
                            break;
                        }
                        case 'LOCK_CONTAINER': {
                            desiredZ = THREE.MathUtils.clamp(sourceWorld.z, this.minZ, this.maxZ);
                            desiredX = sourceWorld.x - this.group.position.x;
                            const pickTopY = sourceWorld.y + CONTAINER_H * 0.5 + 0.20;
                            desiredY = pickTopY - trolleyWorldY;
                            break;
                        }
                        case 'HOIST_LOAD': {
                            desiredZ = this.currCraneZ;
                            desiredX = this.currTrolleyX;
                            desiredY = -3.4;
                            break;
                        }
                        case 'TRAVERSE_TO_DEST': {
                            desiredZ = THREE.MathUtils.clamp(destWorld.z, this.minZ, this.maxZ);
                            desiredX = destWorld.x - this.group.position.x;
                            desiredY = -3.4;
                            break;
                        }
                        case 'LOWER_TO_PLACE': {
                            desiredZ = THREE.MathUtils.clamp(destWorld.z, this.minZ, this.maxZ);
                            desiredX = destWorld.x - this.group.position.x;
                            const placeTopY = destWorld.y + CONTAINER_H * 0.5 + 0.20;
                            desiredY = placeTopY - trolleyWorldY;
                            break;
                        }
                        case 'UNLOCK_CONTAINER': {
                            desiredZ = THREE.MathUtils.clamp(destWorld.z, this.minZ, this.maxZ);
                            desiredX = destWorld.x - this.group.position.x;
                            const placeTopY = destWorld.y + CONTAINER_H * 0.5 + 0.20;
                            desiredY = placeTopY - trolleyWorldY;
                            break;
                        }
                    }
                }

                // Smoothly integrate gantry (Z), trolley (X), and hoist (Y) with realistic acceleration & braking
                const stepZ = this.moveAxisSmooth(this.currCraneZ, this.velCraneZ, desiredZ, 7.5, 11.0, dt);
                const stepX = this.moveAxisSmooth(this.currTrolleyX, this.velTrolleyX, desiredX, 11.5, 16.0, dt);
                const stepY = this.moveAxisSmooth(this.currSpreaderY, this.velSpreaderY, desiredY, 9.2, 14.5, dt);

                this.currCraneZ = stepZ.pos;
                this.velCraneZ = stepZ.vel;
                this.currTrolleyX = stepX.pos;
                this.velTrolleyX = stepX.vel;
                this.currSpreaderY = stepY.pos;
                this.velSpreaderY = stepY.vel;

                this.group.position.z = this.currCraneZ;
                this.trolley.position.x = this.currTrolleyX;
                this.spreader.position.y = this.currSpreaderY;

                // Update 4 hoist cables to exact spreader depth
                const cableLen = Math.max(0.6, Math.abs(this.currSpreaderY));
                for (let i = 0; i < this.cables.length; i++) {
                    this.cables[i].scale.y = cableLen;
                }

                // 2D Pendulum Sway Physics driven by trolley & gantry acceleration, suppressed near container contact
                const contactDamp = (this.state === 'LOWER_TO_PICK' || this.state === 'LOCK_CONTAINER' ||
                                     this.state === 'LOWER_TO_PLACE' || this.state === 'UNLOCK_CONTAINER') ? 0.80 : 0.92;
                this.swayVelX = (this.swayVelX - stepX.accel * 0.0085 - this.swayX * 14.0 * dt) * contactDamp;
                this.swayVelZ = (this.swayVelZ - stepZ.accel * 0.0075 - this.swayZ * 14.0 * dt) * contactDamp;
                this.swayX = THREE.MathUtils.clamp(this.swayX + this.swayVelX * dt, -0.09, 0.09);
                this.swayZ = THREE.MathUtils.clamp(this.swayZ + this.swayVelZ * dt, -0.08, 0.08);
                this.pendulumPivot.rotation.z = this.swayX;
                this.pendulumPivot.rotation.x = -this.swayZ;

                // Corner guide flipper articulation
                this.flipperAngle = THREE.MathUtils.lerp(this.flipperAngle, this.targetFlipperAngle || 0, dt * 10.0);
                for (let i = 0; i < this.flippers.length; i++) {
                    const fl = this.flippers[i];
                    fl.mesh.rotation.z = fl.sideSign * this.flipperAngle;
                }

                // Advance 8-Stage State Machine
                switch (this.state) {
                    case 'ALIGN_TO_SOURCE':
                        if (stepZ.done && stepX.done) {
                            this.state = 'LOWER_TO_PICK';
                        }
                        break;

                    case 'LOWER_TO_PICK':
                        if (stepY.done && stepX.done && stepZ.done) {
                            this.setFlipperTarget(false); // Fold corner flippers flat to engage twist-locks
                            this.lockTimer = 0;
                            this.state = 'LOCK_CONTAINER';
                        }
                        break;

                    case 'LOCK_CONTAINER':
                        this.lockTimer += dt;
                        if (this.lockTimer >= 0.36) {
                            if (this.mode === 'UNLOAD') {
                                this.activeContainer = this.targetSlot.mesh;
                                this.targetSlot.mesh = null;
                            } else {
                                this.activeContainer = this.targetYardStack.containers.pop();
                            }

                            if (this.activeContainer) {
                                this.spreader.attach(this.activeContainer);
                                this.activeContainer.position.set(0, -CONTAINER_H * 0.5 - 0.20, 0);
                                this.activeContainer.rotation.set(0, 0, 0);
                                this.statusLightMat.color.setHex(0xf59e0b); // Amber: twist-locks engaged & carrying load
                                this.state = 'HOIST_LOAD';
                            } else {
                                this.abortCycle();
                            }
                        }
                        break;

                    case 'HOIST_LOAD':
                        if (stepY.done) {
                            this.state = 'TRAVERSE_TO_DEST';
                        }
                        break;

                    case 'TRAVERSE_TO_DEST':
                        if (stepZ.done && stepX.done) {
                            this.state = 'LOWER_TO_PLACE';
                        }
                        break;

                    case 'LOWER_TO_PLACE':
                        if (stepY.done && stepX.done && stepZ.done) {
                            this.lockTimer = 0;
                            this.setFlipperTarget(true); // Flare flippers open as container seats onto stack
                            this.statusLightMat.color.setHex(0x22c55e); // Green: placement verified
                            this.state = 'UNLOCK_CONTAINER';
                        }
                        break;

                    case 'UNLOCK_CONTAINER':
                        this.lockTimer += dt;
                        if (this.lockTimer >= 0.34) {
                            if (this.activeContainer) {
                                if (this.mode === 'UNLOAD') {
                                    const dropY = APRON_Y + CONTAINER_H * 0.5 + this.targetYardStack.containers.length * CONTAINER_H;
                                    worldGroup.attach(this.activeContainer);
                                    this.activeContainer.position.set(this.targetYardStack.x, dropY, this.targetYardStack.z);
                                    this.activeContainer.rotation.set(0, 0, 0);
                                    this.targetYardStack.containers.push(this.activeContainer);
                                } else {
                                    this.targetShip.cargoGroup.attach(this.activeContainer);
                                    this.activeContainer.position.copy(this.targetSlot.localPos);
                                    this.activeContainer.rotation.set(0, 0, 0);
                                    this.targetSlot.mesh = this.activeContainer;
                                }
                                this.activeContainer = null;
                                PortManager.recordContainerMove(this.targetShip);
                            }
                            this.releaseReservations();
                            this.state = 'HOIST_CLEAR';
                        }
                        break;

                    case 'HOIST_CLEAR':
                        if (stepY.done) {
                            this.statusLightMat.color.setHex(0x38bdf8);
                            this.state = 'IDLE';
                        }
                        break;
                }
            }
        }

        // 6 Ship-to-Shore (STS) Gantry Cranes: 2 per Berth across Berths Alpha, Bravo, and Charlie
        const stsCranes = [
            new STSGantryCrane('STS-01', -95.0, sharedMats.craneRed,    0, -104.0, -86.2, 0),
            new STSGantryCrane('STS-02', -77.0, sharedMats.craneBlue,   0,  -84.0, -68.0, 1),
            new STSGantryCrane('STS-03', -27.0, sharedMats.craneRed,    1,  -36.0, -18.2, 0),
            new STSGantryCrane('STS-04',  -9.0, sharedMats.craneYellow, 1,  -16.0,   0.0, 1),
            new STSGantryCrane('STS-05',  41.0, sharedMats.craneBlue,   2,   32.0,  49.8, 0),
            new STSGantryCrane('STS-06',  59.0, sharedMats.craneTeal,   2,   52.0,  68.0, 1)
        ];

        // ============================================================================
        // 7. HYDRODYNAMIC VESSELS, BOW FOAM CRESTS, KELVIN V-WAKES & PROP WASH
        // ============================================================================
        // Pre-allocated object pool for wake rings & foam patches (Zero GC churn)
        const WAKE_POOL_SIZE = 80;
        const wakeRingPool = [];
        const wakeFoamPool = [];
        const activeWakeParticles = [];

        const foamPatchGeo = new THREE.CircleGeometry(0.78, 12);
        foamPatchGeo.rotateX(-Math.PI / 2);

        const kelvinRippleGeo = new THREE.RingGeometry(0.85, 1.25, 24, 1, Math.PI * 0.68, Math.PI * 0.64);
        kelvinRippleGeo.rotateX(-Math.PI / 2);

        for (let i = 0; i < WAKE_POOL_SIZE; i++) {
            const rMat = new THREE.MeshBasicMaterial({
                color: 0xe0f2fe,
                transparent: true,
                opacity: 0,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const rMesh = new THREE.Mesh(kelvinRippleGeo, rMat);
            rMesh.visible = false;
            worldGroup.add(rMesh);
            wakeRingPool.push({
                active: false,
                mesh: rMesh,
                life: 0,
                decay: 0.48,
                baseScale: 1,
                maxOpacity: 0.5,
                expandRate: 1.35
            });

            const fMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0,
                depthWrite: false
            });
            const fMesh = new THREE.Mesh(foamPatchGeo, fMat);
            fMesh.visible = false;
            worldGroup.add(fMesh);
            wakeFoamPool.push({
                active: false,
                mesh: fMesh,
                life: 0,
                decay: 0.56,
                baseScale: 1,
                maxOpacity: 0.5,
                expandRate: 1.15
            });
        }

        const tempRingDayCol = new THREE.Color(0xe0f2fe);
        const tempRingBioCol = new THREE.Color(0x00f5d4);
        const tempFoamDayCol = new THREE.Color(0xffffff);
        const tempFoamBioCol = new THREE.Color(0x38bdf8);

        function spawnShipWakeAndRipples(x, z, heading, beam = 4.5, speed = 5.0, speedRatio = 0.5) {
            const nMix = NightEnvironment.nightMix;

            // 1. Kelvin Ripple Ring from pool
            let ringP = null;
            for (let i = 0; i < WAKE_POOL_SIZE; i++) {
                if (!wakeRingPool[i].active) {
                    ringP = wakeRingPool[i];
                    break;
                }
            }
            if (ringP) {
                ringP.active = true;
                const wakeOpacity = Math.min(0.65, (0.14 + speedRatio * 0.30) * (1.0 + nMix * 0.65));
                ringP.mesh.material.color.copy(tempRingDayCol).lerp(tempRingBioCol, nMix);
                ringP.mesh.material.opacity = wakeOpacity;
                ringP.mesh.position.set(x, 0.09, z);
                ringP.mesh.rotation.y = heading;
                const initScale = beam * 0.28;
                ringP.mesh.scale.setScalar(initScale);
                ringP.mesh.visible = true;
                ringP.life = 1.0;
                ringP.decay = 0.48;
                ringP.baseScale = initScale;
                ringP.maxOpacity = wakeOpacity;
                ringP.expandRate = 1.35 + speed * 0.11;
                activeWakeParticles.push(ringP);
            }

            // 2. Stern Foam Patch from pool
            let foamP = null;
            for (let i = 0; i < WAKE_POOL_SIZE; i++) {
                if (!wakeFoamPool[i].active) {
                    foamP = wakeFoamPool[i];
                    break;
                }
            }
            if (foamP) {
                foamP.active = true;
                const foamOpacity = Math.min(0.72, (0.16 + speedRatio * 0.32) * (1.0 + nMix * 0.75));
                foamP.mesh.material.color.copy(tempFoamDayCol).lerp(tempFoamBioCol, nMix * 0.75);
                foamP.mesh.material.opacity = foamOpacity;
                foamP.mesh.position.set(
                    x + (Math.random() - 0.5) * beam * 0.24,
                    0.08,
                    z + (Math.random() - 0.5) * beam * 0.24
                );
                foamP.mesh.rotation.y = Math.random() * Math.PI * 2;
                const fScale = beam * 0.22;
                foamP.mesh.scale.setScalar(fScale);
                foamP.mesh.visible = true;
                foamP.life = 1.0;
                foamP.decay = 0.56;
                foamP.baseScale = fScale;
                foamP.maxOpacity = foamOpacity;
                foamP.expandRate = 1.15;
                activeWakeParticles.push(foamP);
            }
        }

        class NavalVessel {
            constructor(config) {
                this.id = config.id || ('IMO ' + Math.floor(910000 + Math.random() * 89000));
                this.name = config.name;
                this.vesselClass = config.vesselClass;
                this.classLabel = config.classLabel;
                this.isCommandTug = !!config.isCommandTug;

                this.length = config.length || 28;
                this.beam = config.beam || 6.4;
                this.maxSpeed = config.maxSpeed || 5.8;
                this.turnRate = config.turnRate || 0.55;

                this.position = new THREE.Vector3(config.x || 0, 0, config.z || 0);
                this.heading = config.heading !== undefined ? config.heading : 0;
                this.speed = 0;
                this.targetSpeed = 0;

                // 4-Point Hydrodynamic Spring-Damper State
                this.heaveY = 0;
                this.heaveVel = 0;
                this.pitch = 0;
                this.pitchVel = 0;
                this.roll = 0;
                this.rollVel = 0;
                this.wakeAccumulator = 0;
                this.waveGridAccumulator = 0;
                this.thrusterTimer = 0;

                this.state = config.initialState || 'PATROL';
                this.waypoints = [];
                // Honor pre-assigned berths from the fleet config so the initially moored freighters are registered
                // with PortManager (otherwise the berths look empty and the STS cranes never receive work)
                this.assignedBerth = config.assignedBerth || null;
                this.targetBerth = this.assignedBerth;
                this.cargoSlots = [];
                this.bayZOffsets = config.bayZOffsets || [-9.6, -4.8, 0.0, 4.8, 9.6];
                this.rowXOffsets = [-1.6, 0.0, 1.6];
                this.maxTiers = 2;
                this.opsTargetMoves = config.opsTargetMoves || 8;
                this.opsCompletedMoves = 0;

                this.root = new THREE.Group();
                this.hullGroup = new THREE.Group();
                this.cargoGroup = new THREE.Group();
                this.hullGroup.add(this.cargoGroup);
                this.root.add(this.hullGroup);

                this.buildVesselMesh(config);
                this.buildBowWaveCrestMesh();
                this.buildVesselNightLights();
                if (this.vesselClass === 'FREIGHTER' || this.vesselClass === 'FEEDER') {
                    this.buildMooringLines();
                }

                this.root.position.copy(this.position);
                this.root.rotation.y = this.heading;
                worldGroup.add(this.root);
            }

            buildVesselNightLights() {
                // COLREGs Port (Red), Starboard (Green), Masthead/Stern (White) & Diffused Forward Searchlight
                this.nightLightGroup = new THREE.Group();
                this.nightLightGroup.visible = false;

                const isLarge = (this.vesselClass === 'FREIGHTER' || this.vesselClass === 'FEEDER' || this.vesselClass === 'TANKER');
                const bulbR = isLarge ? 0.22 : 0.08;
                const navBulbGeo = new THREE.SphereGeometry(bulbR, 8, 8);
                const portRedMat = new THREE.MeshBasicMaterial({ color: 0xff2a2a, clippingPlanes: dioramaClipPlanes });
                const stbdGreenMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, clippingPlanes: dioramaClipPlanes });
                const mastWhiteMat = new THREE.MeshBasicMaterial({ color: 0xfef9c3, clippingPlanes: dioramaClipPlanes });

                const navY = isLarge ? 7.2 : (this.vesselClass === 'SAILBOAT' ? 2.5 : 1.35);
                const navZ = isLarge ? -this.length * 0.34 : this.length * 0.15;
                const haloScale = isLarge ? 1.9 : 0.75;

                const portLight = new THREE.Mesh(navBulbGeo, portRedMat);
                portLight.position.set(this.beam * 0.52, navY, navZ);
                const portHalo = NightEnvironment.createGlowSprite(0xff2a2a, haloScale, 0.0, 0.78);
                portHalo.position.copy(portLight.position);

                const stbdLight = new THREE.Mesh(navBulbGeo, stbdGreenMat);
                stbdLight.position.set(-this.beam * 0.52, navY, navZ);
                const stbdHalo = NightEnvironment.createGlowSprite(0x22c55e, haloScale, 0.0, 0.78);
                stbdHalo.position.copy(stbdLight.position);

                const mastLight = new THREE.Mesh(navBulbGeo, mastWhiteMat);
                mastLight.position.set(0, navY + (isLarge ? 1.6 : 0.7), navZ);
                const mastHalo = NightEnvironment.createGlowSprite(0xfef9c3, haloScale * 1.25, 0.0, 0.85);
                mastHalo.position.copy(mastLight.position);

                this.nightLightGroup.add(portLight, portHalo, stbdLight, stbdHalo, mastLight, mastHalo);

                if (isLarge) {
                    const searchGeo = new THREE.CylinderGeometry(0.28, 2.35, 9.2, 16, 1, true);
                    searchGeo.rotateX(Math.PI / 2);
                    searchGeo.translate(0, -0.32, 4.6);
                    const searchMat = NightEnvironment.createDiffusedVolumetricMaterial(0xe0f2fe, 0.0, 0.28, 1.35, 2.35, true);

            updateMooringLines() {
                if (!this.mooringGroup) return;
                if (this.state !== 'MOORED_OPS' || !this.assignedBerth) {
                    this.mooringGroup.visible = false;
                    return;
                }
                this.mooringGroup.visible = true;
                const shipY = this.heaveY + 2.5;
                const halfL = this.length * 0.41;
                const portEdgeX = this.position.x - this.beam * 0.46;
                const attachments = [
                    { sx: portEdgeX, sz: this.position.z - halfL, bx: QUAY_X - 0.8, bz: this.position.z - halfL - 3.2 },
                    { sx: portEdgeX, sz: this.position.z - halfL * 0.55, bx: QUAY_X - 0.8, bz: this.position.z - halfL * 0.35 },
                    { sx: portEdgeX, sz: this.position.z + halfL * 0.55, bx: QUAY_X - 0.8, bz: this.position.z + halfL * 0.35 },
                    { sx: portEdgeX, sz: this.position.z + halfL, bx: QUAY_X - 0.8, bz: this.position.z + halfL + 3.2 }
                ];
                for (let i = 0; i < 4; i++) {
                    const a = attachments[i];
                    const line = this.mooringLines[i];
                    const start = new THREE.Vector3(a.sx, shipY, a.sz);
                    const end = new THREE.Vector3(a.bx, APRON_Y + 0.45, a.bz);
                    const dist = start.distanceTo(end);
                    line.position.copy(start);
                    line.lookAt(end);
                    line.scale.set(1, 1, dist);
                }
            }
