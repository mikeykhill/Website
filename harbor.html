            return -64.0
                + Math.sin(z * 0.042) * 3.8
                + Math.cos(z * 0.021 - 0.6) * 1.6;
        }

        // Smooth undulating road elevation Y(z) between 9.5 and 13.5
        function getRoadElevation(z) {
            return 11.4
                + Math.sin(z * 0.028 + 0.5) * 1.45
                + Math.cos(z * 0.052) * 0.55;
        }

        // Base natural hillside slope (used to anchor driveway pad heights without circular dependencies)
        function getNaturalHillsideSlopeY(x, z) {
            if (x >= HILL_EDGE_X) return APRON_Y;
            const hillSpan = HILL_EDGE_X - MIN_X; // 66.5 units of deep terraced hillside
            const t = THREE.MathUtils.clamp((HILL_EDGE_X - x) / hillSpan, 0.0, 1.0);
            return APRON_Y
                + Math.pow(t, 1.04) * 24.5
                + Math.sin(z * 0.036 + x * 0.055) * 1.15
                + Math.cos(z * 0.075 - x * 0.04) * 0.55;
        }

        // Two paved connector ramps branching from the winding hillside road down to the concrete port apron (X = HILL_EDGE_X)
        const CONNECTOR_RAMPS = [
            { zCenter: -22.0, halfWidth: 3.1 },
            { zCenter:  64.0, halfWidth: 3.1 }
        ];

        // Pre-compute 26 residential driveways branching East and West off the winding road to Row 2, Row 3 & Row 4 houses
        function initResidentialDriveways() {
            portObjects.driveways = [];
            let dwId = 0;

            for (let z = -124; z <= 124; z += 11.0) {
                const roadX = getRoadCenterX(z);
                const roadY = getRoadElevation(z);
                const uRoad = THREE.MathUtils.clamp((z + HALF_Z) / WORLD_Z, 0.02, 0.98);

                // Skip connector ramp mouths on the East side
                const nearConnectorRamp = CONNECTOR_RAMPS.some(r => Math.abs(z - r.zCenter) < r.halfWidth + 6.5);

                // 1. East (Downhill) Driveway serving Row 2 Roadside Houses
                if (!nearConnectorRamp && Math.abs(z) % 22 < 12) {
                    const startX = roadX + 2.35;
                    const startZ = z;
                    const endX = roadX + 8.0;
                    const endZ = z + 0.8;
                    const endY = getNaturalHillsideSlopeY(endX, endZ) + 0.15;

                    portObjects.driveways.push({
                        id: dwId++,
                        side: 1,
                        rowTier: 2,
                        uRoad,
                        startX,
                        startZ,
                        startY: roadY,
                        endX,
                        endZ,
                        endY,
                        houseX: endX + 0.4,
                        houseZ: endZ - 3.3,
                        lengthFactor: 1.0,
                        occupiedBy: null
                    });
                }

                // 2. West (Uphill) Driveway alternating between Row 3 (Roadside) and Row 4 (Mid-Hillside Terrace)
                const nearChurchCorridor = (z > -20.0 && z < 4.0);
                if (!nearChurchCorridor) {
                    const isLongRow4Driveway = (dwId % 3 === 1);
                    const startX = roadX - 2.35;
                    const startZ = z;
                    const endX = isLongRow4Driveway ? (roadX - 16.6) : (roadX - 8.2);
                    const endZ = z + (isLongRow4Driveway ? -1.0 : 0.8);
                    const endY = getNaturalHillsideSlopeY(endX, endZ) + 0.15;

                    portObjects.driveways.push({
                        id: dwId++,
                        side: -1,
                        rowTier: isLongRow4Driveway ? 4 : 3,
                        uRoad,
                        startX,
                        startZ,
                        startY: roadY,
                        endX,
                        endZ,
                        endY,
                        houseX: endX - 0.5,
                        houseZ: endZ + 3.3,
                        lengthFactor: isLongRow4Driveway ? 1.65 : 1.0,
                        occupiedBy: null
                    });
                }
            }
        }
        initResidentialDriveways();

        // Unified Terrain + Roadbed + Driveway Grading Function (Guarantees flat concrete dock apron from -39.5 to -24.0)
        function getHillsideHeight(x, z) {
            if (x >= HILL_EDGE_X) return APRON_Y;

            let naturalH = getNaturalHillsideSlopeY(x, z);

            const roadX = getRoadCenterX(z);
            const roadY = getRoadElevation(z);
            const distToRoad = Math.abs(x - roadX);

            // 1. Main Winding Coastal Road Shelf Corridor (distToRoad < 5.2)
            if (distToRoad < 5.2) {
                if (distToRoad <= 2.9) {
                    // Perfectly flat engineered roadbed shelf directly under the asphalt ribbon
                    naturalH = roadY;
                } else {
                    // Smooth cut-bank / retaining shoulder blend into the surrounding hillside
                    const blend = smoothstep(2.9, 5.2, distToRoad);
                    naturalH = THREE.MathUtils.lerp(roadY, naturalH, blend);
                }
            }

            // 2. Two Connector Ramps branching from the winding road (x = roadX) down to the concrete port apron (x = HILL_EDGE_X)
            for (let i = 0; i < CONNECTOR_RAMPS.length; i++) {
                const ramp = CONNECTOR_RAMPS[i];
                const dz = Math.abs(z - ramp.zCenter);
                const rStartX = getRoadCenterX(ramp.zCenter) + 2.4;
                const rEndX = HILL_EDGE_X - 0.4;
                if (x >= rStartX - 0.5 && x <= rEndX + 0.5 && dz < ramp.halfWidth + 2.4) {
                    const rampU = THREE.MathUtils.clamp((x - rStartX) / (rEndX - rStartX), 0.0, 1.0);
                    const rampTargetY = THREE.MathUtils.lerp(getRoadElevation(ramp.zCenter), APRON_Y, smoothstep(0.0, 1.0, rampU));
                    if (dz <= ramp.halfWidth) {
                        naturalH = rampTargetY;
                    } else {
                        const zBlend = smoothstep(ramp.halfWidth, ramp.halfWidth + 2.4, dz);
                        naturalH = THREE.MathUtils.lerp(rampTargetY, naturalH, zBlend);
                    }
                }
            }

            // 3. Smoothly grade residential driveway corridors and garage parking pads
            for (let i = 0; i < portObjects.driveways.length; i++) {
                const dw = portObjects.driveways[i];
                if (Math.abs(z - dw.startZ) > 6.5) continue;

                const vx = dw.endX - dw.startX;
                const vz = dw.endZ - dw.startZ;
                const lenSq = vx * vx + vz * vz;
                const t = THREE.MathUtils.clamp(((x - dw.startX) * vx + (z - dw.startZ) * vz) / lenSq, 0.0, 1.0);
                const projX = dw.startX + t * vx;
                const projZ = dw.startZ + t * vz;
                const distToDw = Math.hypot(x - projX, z - projZ);

                if (distToDw < 2.6) {
                    const dwTargetY = THREE.MathUtils.lerp(dw.startY, dw.endY, smoothstep(0.0, 1.0, t));
                    if (distToDw <= 1.25) {
                        naturalH = dwTargetY;
                    } else {
                        const dwBlend = smoothstep(1.25, 2.6, distToDw);
                        naturalH = THREE.MathUtils.lerp(dwTargetY, naturalH, dwBlend);
                    }
                }
            }

            // 4. Grade a flat terraced plateau around the Hillside Parish Church (-88.0, -8.0) so the uphill slope never clips the church
            const churchDx = Math.abs(x - (-88.0));
            const churchDz = Math.abs(z - (-8.0));
            if (churchDx < 10.5 && churchDz < 12.5) {
                const churchPlateauY = getNaturalHillsideSlopeY(-88.0, -8.0);
                const bx = smoothstep(6.8, 10.5, churchDx);
                const bz = smoothstep(8.8, 12.5, churchDz);
                const plateauBlend = Math.max(bx, bz);
                naturalH = THREE.MathUtils.lerp(churchPlateauY, naturalH, plateauBlend);
            }

            return naturalH;
        }

        // Bumpy, Non-Uniform Multi-Octave Bathymetry Function across the marine basin
        function getSeabedDepthY(vx, vz) {
            // 1. Base regional bathymetry: rip-rap quay toe, meandering dredged fairway, and eastern reef shelf
            const meanderShift = Math.sin(vz * 0.032) * 3.8 + Math.cos(vz * 0.055 + 1.1) * 2.2;
            const channelCenter = 5.5 + meanderShift;
            const distFromChannel = Math.abs(vx - channelCenter);

            let depthY = SEABED_Y + 1.8;

            if (vx < -18.5) {
                // Sloping rip-rap stone apron along the base of the concrete quay seawall
                const wallProx = THREE.MathUtils.clamp((-18.5 - vx) / 5.5, 0.0, 1.0);
                depthY = SEABED_Y - 0.4 + wallProx * 3.1;
            } else if (distFromChannel < 22.0) {
                // Dredged shipping channel with natural scour pockets and undulating walls
                const normC = distFromChannel / 22.0;
                const trenchProfile = Math.cos(normC * Math.PI * 0.5);
                depthY = SEABED_Y + 1.4 - 3.6 * (trenchProfile * trenchProfile);
            } else {
                // Eastern shoal shelf rising into bumpy rocky ridges, sandbars, and seamounts
                const shoalT = THREE.MathUtils.clamp((vx - 22.0) / 46.0, 0.0, 1.0);
                depthY = SEABED_Y + 1.4 + Math.pow(shoalT, 0.85) * 3.2;
            }

            // 2. Distinct Underwater Landforms (Seamounts, Sandbar Ridges, and an Abyssal Kettle Trench)
            const landforms = [
                // Raised rocky reef knolls & seamounts on the eastern shelf
                { x: 48.0, z: -90.0, rx: 14.0, rz: 18.0, amp:  2.85 },
                { x: 46.0, z: -18.0, rx: 13.0, rz: 16.0, amp:  2.35 }, // Shipwreck shoal ridge
                { x: 56.0, z: -48.0, rx: 12.0, rz: 14.0, amp:  2.50 },
                { x: 35.0, z: -64.0, rx: 10.0, rz: 12.0, amp:  1.95 }, // Sunken container mound
                { x: 44.0, z:  64.0, rx: 15.0, rz: 19.0, amp:  2.75 },
                { x: 58.0, z:  94.0, rx: 12.0, rz: 15.0, amp:  2.40 },
                { x: 15.0, z:  54.0, rx:  9.5, rz: 12.0, amp:  1.55 }, // Giant anchor sandbar
                // Deep underwater kettle canyon / hydrothermal vent depression
                { x: 52.0, z:  26.0, rx: 12.5, rz: 17.5, amp: -3.45 },
                // Entrance tidal scour hole between breakwaters
                { x: 18.0, z: -108.0, rx: 14.0, rz: 16.0, amp: -1.85 },
                { x: 16.0, z:  104.0, rx: 14.0, rz: 16.0, amp: -1.65 }
            ];

            for (let i = 0; i < landforms.length; i++) {
                const lf = landforms[i];
                const dx = (vx - lf.x) / lf.rx;
                const dz = (vz - lf.z) / lf.rz;
                const d2 = dx * dx + dz * dz;
                if (d2 < 4.5) {
                    depthY += lf.amp * Math.exp(-d2);
                }
            }

            // 3. Multi-octave organic bumps, diagonal tidal sand dunes, and rocky hummocks
            const duneWave = Math.sin(vx * 0.16 + vz * 0.09 + Math.sin(vz * 0.04) * 1.8) * 0.68
                           + Math.cos(vx * 0.11 - vz * 0.14 + 0.7) * 0.54;
            const medBumps = Math.sin(vx * 0.31 + vz * 0.27) * Math.cos(vx * 0.23 - vz * 0.35) * 0.62
                           + Math.sin(vx * 0.48 - vz * 0.41 + 1.9) * 0.34;
            const fineBumps = Math.cos(vx * 0.85 + vz * 0.78) * Math.sin(vx * 0.72 - vz * 0.91) * 0.24;

            // Keep the navigation channel floor slightly smoother than the craggy eastern reef zone
            const roughnessMask = THREE.MathUtils.clamp((vx + 10.0) / 42.0, 0.45, 1.28);
            depthY += (duneWave + medBumps + fineBumps) * roughnessMask;

            return THREE.MathUtils.clamp(depthY, SEABED_Y - 3.9, SEABED_Y + 6.4);
        }

        function createGeologicalRibbon(samples, yTopFn, yBotFn, material) {
            const n = samples.length - 1;
            const geo = new THREE.PlaneGeometry(1, 1, n, 1);
            const pos = geo.attributes.position;

            for (let i = 0; i <= n; i++) {
                const pt = samples[i];
                const topY = yTopFn(pt.x, pt.z, i / n);
                const botY = yBotFn(pt.x, pt.z, i / n);
                pos.setXYZ(i, pt.x, topY, pt.z);
                pos.setXYZ(i + n + 1, pt.x, botY, pt.z);
            }

            geo.computeVertexNormals();
            const mesh = new THREE.Mesh(geo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function buildRealisticEarthStrataCrossSection() {
            const topSurfaceY = (x, z) => {
                if (x < QUAY_X) return getHillsideHeight(x, z);
                return getSeabedDepthY(x, z);
            };
            const interface1Y = (x, z) => {
                const base = x < QUAY_X ? -14.2 + (-24 - x) * 0.048 : -16.8;
                return base + Math.sin(x * 0.075 + z * 0.045) * 1.15 + Math.cos(z * 0.09 - x * 0.05) * 0.65;
            };
            const interface2Y = (x, z) => {
                const base = x < QUAY_X ? -20.2 + (-24 - x) * 0.024 : -22.0;
                return base + Math.cos(x * 0.065 - z * 0.05) * 1.05 + Math.sin(z * 0.08 + 1.2) * 0.6;
            };
            const bottomFlatY = () => BASE_BOTTOM_Y;
            const STRATA_NX = 176;

            // 1. East Perimeter Cutaway Wall (X = +70, Z from +140 to -140)
            const eastSamples = [];
            for (let i = 0; i <= GRID_NZ; i++) {
                eastSamples.push({ x: MAX_X, z: HALF_Z - (i / GRID_NZ) * WORLD_Z });
            }
            worldGroup.add(createGeologicalRibbon(eastSamples, topSurfaceY, interface1Y, sharedMats.topCreamStrata));
            worldGroup.add(createGeologicalRibbon(eastSamples, interface1Y, interface2Y, sharedMats.midTanStrata));
            worldGroup.add(createGeologicalRibbon(eastSamples, interface2Y, bottomFlatY, sharedMats.botBrownStrata));

            // 2. South Perimeter Cutaway Wall (Z = +140, X from -106 to +70)
            const southSamples = [];
            for (let i = 0; i <= STRATA_NX; i++) {
                southSamples.push({ x: MIN_X + (i / STRATA_NX) * WORLD_X, z: HALF_Z });
            }
            worldGroup.add(createGeologicalRibbon(southSamples, topSurfaceY, interface1Y, sharedMats.topCreamStrata));
            worldGroup.add(createGeologicalRibbon(southSamples, interface1Y, interface2Y, sharedMats.midTanStrata));
            worldGroup.add(createGeologicalRibbon(southSamples, interface2Y, bottomFlatY, sharedMats.botBrownStrata));

            // 3. North Perimeter Cutaway Wall (Z = -140, X from +70 to -106)
            const northSamples = [];
            for (let i = 0; i <= STRATA_NX; i++) {
                northSamples.push({ x: MAX_X - (i / STRATA_NX) * WORLD_X, z: -HALF_Z });
            }
            worldGroup.add(createGeologicalRibbon(northSamples, topSurfaceY, interface1Y, sharedMats.topCreamStrata));
            worldGroup.add(createGeologicalRibbon(northSamples, interface1Y, interface2Y, sharedMats.midTanStrata));
            worldGroup.add(createGeologicalRibbon(northSamples, interface2Y, bottomFlatY, sharedMats.botBrownStrata));

            // 4. West Hillside Back Cutaway Wall (X = -106, Z from -140 to +140)
            const westSamples = [];
            for (let i = 0; i <= 140; i++) {
                westSamples.push({ x: MIN_X, z: -HALF_Z + (i / 140) * WORLD_Z });
            }
            worldGroup.add(createGeologicalRibbon(westSamples, topSurfaceY, interface1Y, sharedMats.topCreamStrata));
            worldGroup.add(createGeologicalRibbon(westSamples, interface1Y, interface2Y, sharedMats.midTanStrata));
            worldGroup.add(createGeologicalRibbon(westSamples, interface2Y, bottomFlatY, sharedMats.botBrownStrata));

            // 5. Embed 380+ 3D River Pebbles & Stones protruding naturally along the middle & bottom strata
            const pebbleGeo = new THREE.DodecahedronGeometry(0.42, 1);
            const pebbleMats = [
                sharedMats.pebbleWhite,
                sharedMats.pebbleCream,
                sharedMats.pebbleTan,
                sharedMats.pebbleGrey
            ];

            const addWallPebble = (px, py, pz) => {
                const pMat = pebbleMats[Math.floor(Math.random() * pebbleMats.length)];
                const p = new THREE.Mesh(pebbleGeo, pMat);
                p.position.set(px, py, pz);
                p.scale.set(0.65 + Math.random() * 1.45, 0.45 + Math.random() * 0.85, 0.65 + Math.random() * 1.35);
                p.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
                worldGroup.add(p);
            };

            // East & West Outer Walls
            for (let i = 0; i < 120; i++) {
                const pz = (Math.random() - 0.5) * (WORLD_Z - 6);
                const py = -16.8 - Math.random() * 9.8;
                addWallPebble(MAX_X + 0.08, py, pz);
                addWallPebble(MIN_X - 0.08, py + 1.5, pz);
            }
            // North & South Outer Walls
            for (let i = 0; i < 85; i++) {
                const px = MIN_X + 3 + Math.random() * (WORLD_X - 6);
                const py = -16.2 - Math.random() * 10.4;
                addWallPebble(px, py, HALF_Z + 0.08);
                addWallPebble(px, py, -HALF_Z - 0.08);
            }
        }

        function buildHillsideTerrainRoadAndVillage() {
            // 1. High-Resolution Expanded Hillside Terrain Mesh (covering X from -106 to HILL_EDGE_X = -39.5, width = 66.5m)
            const hillW = HILL_EDGE_X - MIN_X; // 66.5 units
            const hillCenterX = (MIN_X + HILL_EDGE_X) * 0.5; // -72.75
            const hillGeo = new THREE.PlaneGeometry(hillW, WORLD_Z, 148, 260);
            hillGeo.rotateX(-Math.PI / 2);

            const pos = hillGeo.attributes.position;
            const colors = [];
            const cLow = new THREE.Color(0x7ca95c);
            const cMid = new THREE.Color(0x68964b);
            const cHigh = new THREE.Color(0x88b366);
            const cBank = new THREE.Color(0x8c8577);

            for (let i = 0; i < pos.count; i++) {
                const wx = pos.getX(i) + hillCenterX;
                const wz = pos.getZ(i);
                const wy = getHillsideHeight(wx, wz);
                pos.setY(i, wy);

                const roadX = getRoadCenterX(wz);
                const distToRoad = Math.abs(wx - roadX);
                const t = THREE.MathUtils.clamp((wy - APRON_Y) / 24.5, 0.0, 1.0);
                const col = cLow.clone().lerp(cMid, t);
                if (Math.sin(wx * 0.25 + wz * 0.18) > 0.22) col.lerp(cHigh, 0.35);
                if (distToRoad < 3.4) col.lerp(cBank, 0.65);
                colors.push(col.r, col.g, col.b);
            }
            hillGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            hillGeo.computeVertexNormals();

            const hillMesh = new THREE.Mesh(hillGeo, sharedMats.hillsideGrass);
            hillMesh.position.set(hillCenterX, 0, 0);
            hillMesh.receiveShadow = true;
            hillMesh.castShadow = true;
            worldGroup.add(hillMesh);

            // Stone retaining wall at X = -39.5 separating the wide concrete port dock apron (-39.5..-24) from the hillside toe
            const retainingWall = new THREE.Mesh(
                new THREE.BoxGeometry(1.1, 2.5, WORLD_Z),
                sharedMats.concreteWall
            );
            retainingWall.position.set(HILL_EDGE_X - 0.35, APRON_Y + 0.65, 0);
            retainingWall.castShadow = true;
            retainingWall.receiveShadow = true;
            worldGroup.add(retainingWall);

            // 2. Engineered Winding Coastal Road Ribbon (width = 5.2, sitting at roadY + 0.08 with zero clipping)
            const roadPoints = [];
            const numSamples = 260;
            for (let i = 0; i <= numSamples; i++) {
                const z = -HALF_Z + (i / numSamples) * WORLD_Z;
                const x = getRoadCenterX(z);
                const y = getRoadElevation(z) + 0.08;
                roadPoints.push(new THREE.Vector3(x, y, z));
            }
            portObjects.roadCurve = new THREE.CatmullRomCurve3(roadPoints);

            const roadWidth = 5.2;
            const ribbonGeo = new THREE.PlaneGeometry(roadWidth, WORLD_Z, 8, numSamples);
            ribbonGeo.rotateX(-Math.PI / 2);
            const rPos = ribbonGeo.attributes.position;

            for (let i = 0; i <= numSamples; i++) {
                const u = i / numSamples;
                const pt = portObjects.roadCurve.getPointAt(u);
                const tan = portObjects.roadCurve.getTangentAt(u).normalize();
                const normalX = tan.z;
                const normalZ = -tan.x;

                for (let c = 0; c <= 8; c++) {
                    const frac = (c / 8) - 0.5;
                    const vx = pt.x + normalX * (frac * roadWidth);
                    const vz = pt.z + normalZ * (frac * roadWidth);
                    const isCurbEdge = (c === 0 || c === 8);
                    const vy = pt.y + (isCurbEdge ? 0.14 : Math.cos(frac * Math.PI) * 0.04);
                    rPos.setXYZ(i * 9 + c, vx, vy, vz);
                }
            }
            ribbonGeo.computeVertexNormals();

            const roadMesh = new THREE.Mesh(ribbonGeo, sharedMats.windingRoad);
            roadMesh.receiveShadow = true;
            worldGroup.add(roadMesh);

            // Continuous Stone Retaining Embankment Wall on the downhill side of the road shelf
            const embSamples = [];
            for (let i = 0; i <= numSamples; i++) {
                const u = i / numSamples;
                const pt = portObjects.roadCurve.getPointAt(u);
                const tan = portObjects.roadCurve.getTangentAt(u).normalize();
                embSamples.push({
                    x: pt.x + tan.z * (roadWidth * 0.5 + 0.15),
                    z: pt.z - tan.x * (roadWidth * 0.5 + 0.15),
                    yTop: pt.y + 0.12,
                    yBot: pt.y - 2.6
                });
            }
            const embGeo = new THREE.PlaneGeometry(1, 1, numSamples, 1);
            const embPos = embGeo.attributes.position;
            for (let i = 0; i <= numSamples; i++) {
                const s = embSamples[i];
                embPos.setXYZ(i, s.x, s.yTop, s.z);
                embPos.setXYZ(i + numSamples + 1, s.x, s.yBot, s.z);
            }
            embGeo.computeVertexNormals();
            const embMesh = new THREE.Mesh(embGeo, sharedMats.concreteWall);
            embMesh.castShadow = true;
            embMesh.receiveShadow = true;
            worldGroup.add(embMesh);

            // Guardrails & Warm Coastal Streetlamps along the Winding Road (leaving clear openings at every driveway mouth!)
            const lampPoleGeo = new THREE.CylinderGeometry(0.08, 0.11, 3.2, 6);
            const lampArmGeo = new THREE.BoxGeometry(0.9, 0.08, 0.08);
            const lampBulbGeo = new THREE.SphereGeometry(0.22, 8, 8);
            // Wide, open-ended diffused atmospheric light volume + ground pool instead of a hard cone
            const lampHazeGeo = new THREE.CylinderGeometry(0.32, 2.55, 3.15, 16, 1, true);
            lampHazeGeo.translate(0, -1.55, 0);
            const lampPoolGeo = new THREE.PlaneGeometry(4.6, 4.6);
            lampPoolGeo.rotateX(-Math.PI / 2);

            const lampPoleMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5, metalness: 0.6 });
            const lampBulbMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
            const lampConeMat = NightEnvironment.createDiffusedVolumetricMaterial(0xfde047, 0.0, 0.34, 1.15, 2.2);
            const lampPoolMat = new THREE.MeshBasicMaterial({
                map: NightEnvironment.getSoftGlowTexture(),
                color: 0xfde047,
                transparent: true,
                opacity: 0.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                polygonOffset: true,
                polygonOffsetFactor: -4,
                polygonOffsetUnits: -4
            });
            NightEnvironment.lightFixtures.push({ mat: lampPoolMat, dayOpacity: 0.0, maxOpacity: 0.44 });
            const railPostGeo = new THREE.BoxGeometry(0.16, 0.75, 0.16);
            const railBeamGeo = new THREE.BoxGeometry(0.12, 0.22, 3.4);

            for (let i = 6; i < numSamples - 6; i += 4) {
                const u = i / numSamples;
                const pt = portObjects.roadCurve.getPointAt(u);
                const tan = portObjects.roadCurve.getTangentAt(u).normalize();
                const normalX = tan.z;
                const normalZ = -tan.x;
                const roadYaw = Math.atan2(tan.x, tan.z);

                const onRampMouth = CONNECTOR_RAMPS.some(r => Math.abs(pt.z - r.zCenter) < r.halfWidth + 1.8);
                const onEastDrivewayMouth = portObjects.driveways.some(dw => dw.side === 1 && Math.abs(pt.z - dw.startZ) < 2.6);
                const onWestDrivewayMouth = portObjects.driveways.some(dw => dw.side === -1 && Math.abs(pt.z - dw.startZ) < 2.6);

                if (!onRampMouth && !onEastDrivewayMouth) {
                    const gx = pt.x + normalX * (roadWidth * 0.5 + 0.05);
                    const gz = pt.z + normalZ * (roadWidth * 0.5 + 0.05);
                    const post = new THREE.Mesh(railPostGeo, sharedMats.pipeSilver);
                    post.position.set(gx, pt.y + 0.38, gz);
                    post.rotation.y = roadYaw;
                    worldGroup.add(post);

                    if (i % 8 === 0) {
                        const beam = new THREE.Mesh(railBeamGeo, sharedMats.pipeSilver);
                        beam.position.set(gx, pt.y + 0.55, gz);
                        beam.rotation.y = roadYaw;
                        worldGroup.add(beam);
                    }
                }

                // Warm Coastal Streetlamps spaced evenly every 16 samples
                if (i % 16 === 0 && !onRampMouth) {
                    const side = (i % 32 === 0) ? -1 : 1;
                    const blockedByDriveway = (side === 1 && onEastDrivewayMouth) || (side === -1 && onWestDrivewayMouth);
                    if (!blockedByDriveway) {
                        const lx = pt.x + normalX * side * (roadWidth * 0.5 + 0.25);
                        const lz = pt.z + normalZ * side * (roadWidth * 0.5 + 0.25);

                        const lampGroup = new THREE.Group();
                        lampGroup.position.set(lx, pt.y, lz);
                        lampGroup.rotation.y = roadYaw;

                        const pole = new THREE.Mesh(lampPoleGeo, lampPoleMat);
                        pole.position.y = 1.6;
                        lampGroup.add(pole);

                        const arm = new THREE.Mesh(lampArmGeo, lampPoleMat);
                        arm.position.set(-side * 0.4, 3.15, 0);
                        lampGroup.add(arm);

                        const bulb = new THREE.Mesh(lampBulbGeo, lampBulbMat);
                        bulb.position.set(-side * 0.78, 3.02, 0);
                        lampGroup.add(bulb);

                        // Soft radial glow halo around the streetlamp bulb
                        const bulbHalo = NightEnvironment.createGlowSprite(0xfef08a, 2.3, 0.0, 0.78);
                        bulbHalo.position.set(-side * 0.78, 3.0, 0);
                        lampGroup.add(bulbHalo);

                        // Soft Fresnel-diffused atmospheric light haze
                        const lightHaze = new THREE.Mesh(lampHazeGeo, lampConeMat);
                        lightHaze.position.set(-side * 0.78, 3.02, 0);
                        lampGroup.add(lightHaze);

                        // Warm diffused ground light pool on the asphalt below
                        const groundPool = new THREE.Mesh(lampPoolGeo, lampPoolMat);
                        groundPool.position.set(-side * 1.05, 0.06, 0);
                        lampGroup.add(groundPool);

                        worldGroup.add(lampGroup);
                    }
                }
            }

            // Two Paved Connector Ramps linking the Winding Road down to the Concrete Port Apron at HILL_EDGE_X
            CONNECTOR_RAMPS.forEach(ramp => {
                const rStartX = getRoadCenterX(ramp.zCenter) + 2.2;
                const rEndX = HILL_EDGE_X + 0.2;
                const rLen = rEndX - rStartX;
                const rampGeo = new THREE.PlaneGeometry(rLen, ramp.halfWidth * 1.85, 28, 4);
                rampGeo.rotateX(-Math.PI / 2);
                const rpPos = rampGeo.attributes.position;
                for (let k = 0; k < rpPos.count; k++) {
                    const wx = rpPos.getX(k) + (rStartX + rEndX) * 0.5;
                    const wz = rpPos.getZ(k) + ramp.zCenter;
                    rpPos.setY(k, getHillsideHeight(wx, wz) + 0.08);
                }
                rampGeo.computeVertexNormals();
                const rampMesh = new THREE.Mesh(rampGeo, sharedMats.windingRoad);
                rampMesh.position.set((rStartX + rEndX) * 0.5, 0, ramp.zCenter);
                rampMesh.receiveShadow = true;
                worldGroup.add(rampMesh);
            });

            // Helper: Builds a true 3D pitched gable roof (dual sloped roof planes + inset gable end walls) with zero Z-fighting
            const createPitchedGableRoof = (spanX, lengthZ, ridgeH, roofMat, gableWallMat, overhangX = 0.32, overhangZ = 0.34) => {
                const roofGroup = new THREE.Group();
                const halfW = spanX * 0.5;
                const slopeW = Math.hypot(halfW + overhangX, ridgeH);
                const slopeAngle = Math.atan2(ridgeH, halfW + overhangX);
                const roofLen = lengthZ + overhangZ * 2;
                const boardThick = 0.14;

                // Left & Right sloped roof planes meeting cleanly at the ridge cap
                [-1, 1].forEach(side => {
                    const plane = new THREE.Mesh(
                        new THREE.BoxGeometry(slopeW, boardThick, roofLen),
                        roofMat
                    );
                    plane.position.set(
                        side * (halfW + overhangX) * 0.5,
                        ridgeH * 0.5,
                        0
                    );
                    plane.rotation.z = -side * slopeAngle;
                    plane.castShadow = true;
                    plane.receiveShadow = true;
                    roofGroup.add(plane);
                });

                // Ridge cap beam along the peak
                const ridgeCap = new THREE.Mesh(
                    new THREE.BoxGeometry(0.26, 0.22, roofLen + 0.06),
                    roofMat
                );
                ridgeCap.position.set(0, ridgeH + 0.04, 0);
                roofGroup.add(ridgeCap);

                // Triangular Gable End Walls (inset slightly from spanX so they never Z-fight with the roof eaves)
                if (gableWallMat) {
                    const triShape = new THREE.Shape();
                    const insetW = halfW - 0.03;
                    triShape.moveTo(-insetW, 0);
                    triShape.lineTo(insetW, 0);
                    triShape.lineTo(0, ridgeH - 0.02);
                    triShape.closePath();

                    const gableDepth = lengthZ - 0.04;
                    const gableGeo = new THREE.ExtrudeGeometry(triShape, {
                        depth: gableDepth,
                        bevelEnabled: false
                    });
                    gableGeo.translate(0, 0, -gableDepth * 0.5);
                    const gableMesh = new THREE.Mesh(gableGeo, gableWallMat);
                    gableMesh.castShadow = true;
                    gableMesh.receiveShadow = true;
                    roofGroup.add(gableMesh);
                }

                return roofGroup;
            };

            // 3. Landmark White Hillside Parish Church with Stained-Glass Windows, Rose Window & Copper Spire (Zero Z-Fighting)
            const churchX = -88.0;
            const churchZ = -8.0;
            const churchY = getHillsideHeight(churchX, churchZ);
            const churchGroup = new THREE.Group();
            churchGroup.position.set(churchX, churchY, churchZ);
            churchGroup.rotation.y = 0.05;

            const churchTexBundle = ProceduralTextures.createChurchFacadeTexture();
            const churchFacadeMat = new THREE.MeshStandardMaterial({
                map: churchTexBundle.map,
                emissiveMap: churchTexBundle.emissiveMap,
                emissive: new THREE.Color(0xffd97d),
                emissiveIntensity: 0.0,
                roughness: 0.62
            });
            NightEnvironment.emissiveMaterials.push({ mat: churchFacadeMat, maxIntensity: 1.65 });

            const churchPlasterMat = new THREE.MeshStandardMaterial({ color: 0xfaf8f2, roughness: 0.68 });
            const churchSlateRoofMat = new THREE.MeshStandardMaterial({
                map: ProceduralTextures.createRoofTileTexture('#3b4d61', 'SLATE'),
                roughness: 0.72
            });
            const copperVerdiMat = new THREE.MeshStandardMaterial({
                map: ProceduralTextures.createRoofTileTexture('#2d6a5b', 'METAL'),
                roughness: 0.45,
                metalness: 0.35
            });
            const goldCrossMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.25, metalness: 0.85 });

            // Raised Stone Courtyard Plinth (top sits cleanly at y = +0.40, while all church walls start at y = +0.40)
            const churchCourtyard = new THREE.Mesh(
                new THREE.BoxGeometry(13.2, 6.4, 18.8),
                sharedMats.concreteWall
            );
            churchCourtyard.position.set(0, -2.8, 0.4);
            churchCourtyard.castShadow = true;
            churchCourtyard.receiveShadow = true;
            churchGroup.add(churchCourtyard);

            // Courtyard stone coping trim & front entrance steps
            const courtyardPaving = new THREE.Mesh(
                new THREE.BoxGeometry(13.5, 0.22, 19.1),
                sharedMats.stoneCurb
            );
            courtyardPaving.position.set(0, 0.32, 0.4);
            courtyardPaving.receiveShadow = true;
            churchGroup.add(courtyardPaving);

            for (let st = 0; st < 3; st++) {
                const step = new THREE.Mesh(
                    new THREE.BoxGeometry(2.6, 0.22, 4.2 - st * 0.5),
                    sharedMats.stoneCurb
                );
                step.position.set(6.4 + st * 0.35, 0.22 - st * 0.16, 4.2);
                churchGroup.add(step);
            }

            const baseFloorY = 0.42;

            // Main Nave Body (Z from -6.8 to +4.4, length = 11.2, width = 7.8, height = 6.2)
            const naveW = 7.8, naveH = 6.2, naveL = 11.2;
            const nave = new THREE.Mesh(new THREE.BoxGeometry(naveW, naveH, naveL), churchFacadeMat);
            nave.position.set(0, baseFloorY + naveH * 0.5, -1.2);
            nave.castShadow = true;
            nave.receiveShadow = true;
            churchGroup.add(nave);

            // True 3D Pitched Gable Roof over the Main Nave (oriented cleanly along Z!)
            const naveGableRoof = createPitchedGableRoof(naveW, naveL, 2.75, churchSlateRoofMat, churchPlasterMat, 0.42, 0.42);
            naveGableRoof.position.set(0, baseFloorY + naveH, -1.2);
            churchGroup.add(naveGableRoof);

            // Transverse Transept Wing (wider, lower cross-wing so no faces are coplanar with the nave)
            const tranW = 10.4, tranH = 5.1, tranL = 4.2;
            const transept = new THREE.Mesh(new THREE.BoxGeometry(tranW, tranH, tranL), churchFacadeMat);
            transept.position.set(0, baseFloorY + tranH * 0.5, -3.2);
            transept.castShadow = true;
            transept.receiveShadow = true;
            churchGroup.add(transept);

            const tranRoof = createPitchedGableRoof(tranL, tranW, 1.95, churchSlateRoofMat, churchPlasterMat, 0.35, 0.38);
            tranRoof.rotation.y = Math.PI / 2;
            tranRoof.position.set(0, baseFloorY + tranH, -3.2);
            churchGroup.add(tranRoof);

            // Rear Semicircular Sanctuary Apse (at Z = -6.8, slightly narrower & lower than nave)
            const apse = new THREE.Mesh(
                new THREE.CylinderGeometry(2.65, 2.65, 4.8, 12),
                churchPlasterMat
            );
            apse.position.set(0, baseFloorY + 2.4, -7.1);
            apse.castShadow = true;
            churchGroup.add(apse);

            const apseDome = new THREE.Mesh(
                new THREE.ConeGeometry(2.9, 2.1, 12),
                copperVerdiMat
            );
            apseDome.position.set(0, baseFloorY + 5.85, -7.1);
            apseDome.castShadow = true;
            churchGroup.add(apseDome);

            // Front Bell Tower (Belfry) positioned cleanly at the front of the nave (Z = +5.8) so it never Z-fights with the nave roof
            const belfryW = 4.2, belfryH = 12.6;
            const belfry = new THREE.Mesh(new THREE.BoxGeometry(belfryW, belfryH, belfryW), churchPlasterMat);
            belfry.position.set(0, baseFloorY + belfryH * 0.5, 5.8);
            belfry.castShadow = true;
            belfry.receiveShadow = true;
            churchGroup.add(belfry);

            // Stone stringcourse ledges on the Bell Tower
            [5.8, 9.4, 12.5].forEach(ly => {
                const ledge = new THREE.Mesh(
                    new THREE.BoxGeometry(belfryW + 0.28, 0.24, belfryW + 0.28),
                    sharedMats.stoneCurb
                );
                ledge.position.set(0, baseFloorY + ly, 5.8);
                churchGroup.add(ledge);
            });

            // Illuminated Rose Window on the Harbor-Facing Side (+X) & Arched Belfry Louvers + Clock Faces
            const roseFrame = new THREE.Mesh(
                new THREE.CylinderGeometry(1.15, 1.15, 0.22, 16),
                sharedMats.stoneCurb
            );
            roseFrame.rotation.z = Math.PI / 2;
            roseFrame.position.set(belfryW * 0.5 + 0.05, baseFloorY + 4.2, 5.8);
            churchGroup.add(roseFrame);

            const roseGlassMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                emissive: new THREE.Color(0xfbbf24),
                emissiveIntensity: 0.15,
                roughness: 0.2
            });
            NightEnvironment.emissiveMaterials.push({ mat: roseGlassMat, maxIntensity: 1.9 });
            const roseGlass = new THREE.Mesh(
                new THREE.CylinderGeometry(0.92, 0.92, 0.26, 16),
                roseGlassMat
            );
            roseGlass.rotation.z = Math.PI / 2;
            roseGlass.position.copy(roseFrame.position);
            churchGroup.add(roseGlass);

            // 4 Belfry Bell-Chamber Arches & Illuminated Clock Dials
            for (let side = 0; side < 4; side++) {
                const sidePivot = new THREE.Group();
                sidePivot.position.set(0, baseFloorY + 10.8, 5.8);
                sidePivot.rotation.y = (side * Math.PI) / 2;

                const louverArch = new THREE.Mesh(
                    new THREE.BoxGeometry(1.45, 2.05, 0.16),
                    sharedMats.darkRubber
                );
                louverArch.position.set(0, 0, belfryW * 0.5 + 0.02);
                sidePivot.add(louverArch);

                const clockFace = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.62, 0.62, 0.16, 14),
                     goldCrossMat
                );
                clockFace.rotation.x = Math.PI / 2;
                clockFace.position.set(0, -2.5, belfryW * 0.5 + 0.03);
                sidePivot.add(clockFace);

                churchGroup.add(sidePivot);
            }

            // Harbor-Facing Covered Narthex Entrance Porch on the +X side of the Bell Tower
            const narthex = new THREE.Mesh(new THREE.BoxGeometry(1.8, 3.2, 3.1), churchPlasterMat);
            narthex.position.set(belfryW * 0.5 + 0.85, baseFloorY + 1.6, 5.8);
            narthex.castShadow = true;
            churchGroup.add(narthex);

            const narthexRoof = createPitchedGableRoof(3.1, 2.0, 1.05, churchSlateRoofMat, churchPlasterMat, 0.24, 0.24);
            narthexRoof.rotation.y = Math.PI / 2;
            narthexRoof.position.set(belfryW * 0.5 + 0.85, baseFloorY + 3.2, 5.8);
            churchGroup.add(narthexRoof);

            // Tall Octagonal Copper Spire & Golden Cross atop the Belfry
            const steeple = new THREE.Mesh(
                new THREE.ConeGeometry(2.75, 9.6, 8),
                copperVerdiMat
            );
            steeple.position.set(0, baseFloorY + belfryH + 4.8, 5.8);
            steeple.castShadow = true;
            churchGroup.add(steeple);

            const spireCrossV = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.3, 8), goldCrossMat);
            spireCrossV.position.set(0, baseFloorY + belfryH + 10.3, 5.8);
            const spireCrossH = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.25, 8), goldCrossMat);
            spireCrossH.rotation.z = Math.PI / 2;
            spireCrossH.position.set(0, baseFloorY + belfryH + 10.65, 5.8);
            churchGroup.add(spireCrossV, spireCrossH);

            worldGroup.add(churchGroup);

            // 4. Build 26 Paved 3D Residential Driveways, Curbs, Bollard Lights & Attached Garages
            const houseWallPalettes = [
                '#f5ebe0', // 0: Warm Cream Clapboard
                '#e07a5f', // 1: Terracotta Coral Stucco
                '#f2cc8f', // 2: Sunlit Mustard Siding
                '#81b29a', // 3: Coastal Sage Green
                '#6d9dc5', // 4: Nordic Fjord Blue
                '#c85a48', // 5: Harbor Brick Red
                '#faedcd', // 6: Sand Ivory Clapboard
                '#e29578'  // 7: Warm Ochre Clay
            ];
            const roofTileConfigs = [
                { hex: '#c85a32', style: 'TILE' },  // Terracotta Barrel Tile
                { hex: '#3b4d61', style: 'SLATE' }, // Coastal Slate Blue
                { hex: '#334155', style: 'SLATE' }, // Charcoal Slate Shingle
                { hex: '#b4692c', style: 'TILE' },  // Warm Ochre Clay Tile
                { hex: '#9e3d22', style: 'TILE' },  // Deep Red Clay Tile
                { hex: '#2d6a5b', style: 'METAL' }  // Standing-Seam Copper Green
            ];

            const houseMats = houseWallPalettes.map((hex, idx) => {
                const bundle = ProceduralTextures.createHouseFacadeTexture(hex, idx);
                const mat = new THREE.MeshStandardMaterial({
                    map: bundle.map,
                    emissiveMap: bundle.emissiveMap,
                    emissive: new THREE.Color(0xffd97d),
                    emissiveIntensity: 0.0,
                    roughness: 0.70
                });
                NightEnvironment.emissiveMaterials.push({ mat, maxIntensity: 1.55 });
                return mat;
            });
            const gablePlasterMats = houseWallPalettes.map(hex =>
                new THREE.MeshStandardMaterial({ color: hex, roughness: 0.74 })
            );
            const roofMats = roofTileConfigs.map(cfg =>
                new THREE.MeshStandardMaterial({
                    map: ProceduralTextures.createRoofTileTexture(cfg.hex, cfg.style),
                    roughness: cfg.style === 'METAL' ? 0.45 : 0.74,
                    metalness: cfg.style === 'METAL' ? 0.30 : 0.05
                })
            );
            const timberTrimMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.82 });
            const whiteTrimMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.55 });
            const chimneyBrickMat = new THREE.MeshStandardMaterial({ color: 0x8c3b2b, roughness: 0.85 });

            const drivewaySurfaceMat = new THREE.MeshStandardMaterial({
                color: 0x3b424f,
                roughness: 0.80,
                polygonOffset: true,
                polygonOffsetFactor: -3,
                polygonOffsetUnits: -3
            });
            const garageDoorMat = new THREE.MeshStandardMaterial({
                color: 0xe2e8f0,
                roughness: 0.55
            });

            const placedBuildings = [{ x: churchX, z: churchZ, r: 12.8 }];
            let houseCounter = 0;

            const isClearOfRoadRampsAndDriveways = (px, pz, minRoadClearance = 5.2, ignoreDrivewayId = -1) => {
                if (px > HILL_EDGE_X - 2.4 || px < MIN_X + 3.5) return false;
                const rX = getRoadCenterX(pz);
                if (Math.abs(px - rX) < minRoadClearance) return false;
                if (Math.abs(px - getRoadCenterX(pz - 3.0)) < minRoadClearance) return false;
                if (Math.abs(px - getRoadCenterX(pz + 3.0)) < minRoadClearance) return false;
                for (let i = 0; i < CONNECTOR_RAMPS.length; i++) {
                    const ramp = CONNECTOR_RAMPS[i];
                    if (px > rX - 2.0 && Math.abs(pz - ramp.zCenter) < ramp.halfWidth + 4.8) return false;
                }
                for (let i = 0; i < portObjects.driveways.length; i++) {
                    const dw = portObjects.driveways[i];
                    if (dw.id === ignoreDrivewayId) continue;
                    const cp = HarborCollisionSystem.closestPointOnSegment(px, pz, dw.startX, dw.startZ, dw.endX, dw.endZ);
                    if (Math.hypot(px - cp.x, pz - cp.z) < 2.8) return false;
                }
                return true;
            };

            // Helper: Adds a brick/stone chimney with terracotta chimney pots
            const addDetailedChimney = (parentGroup, cx, cy, cz) => {
                const cStack = new THREE.Mesh(new THREE.BoxGeometry(0.68, 1.9, 0.68), chimneyBrickMat);
                cStack.position.set(cx, cy, cz);
                cStack.castShadow = true;
                parentGroup.add(cStack);

                const cCap = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.16, 0.82), sharedMats.stoneCurb);
                cCap.position.set(cx, cy + 0.96, cz);
                parentGroup.add(cCap);

                [-0.16, 0.16].forEach(pz => {
                    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.12, 0.36, 8), sharedMats.craneRed);
                    pot.position.set(cx, cy + 1.18, cz + pz);
                    parentGroup.add(pot);
                });
            };

            const buildCoastalHouse = (hx, hz, facingAngle, attachedDriveway = null) => {
                const ignoreId = attachedDriveway ? attachedDriveway.id : -1;
                if (!attachedDriveway && !isClearOfRoadRampsAndDriveways(hx, hz, 5.2, ignoreId)) return false;
                if (placedBuildings.some(b => Math.hypot(b.x - hx, b.z - hz) < b.r)) return false;

                const houseType = houseCounter % 8; // 8 distinct architectural coastal house types (0..7)
                const paletteIdx = (houseCounter * 3 + Math.floor(Math.abs(hz))) % houseMats.length;
                const roofIdx = (houseCounter * 2 + (attachedDriveway ? 1 : 0)) % roofMats.length;
                houseCounter++;

                const wallMat = houseMats[paletteIdx];
                const gableMat = gablePlasterMats[paletteIdx];
                const rMat = roofMats[roofIdx];

                const hy = getHillsideHeight(hx, hz);
                const hGroup = new THREE.Group();
                hGroup.position.set(hx, hy, hz);
                hGroup.rotation.y = facingAngle + (attachedDriveway ? 0 : (Math.random() - 0.5) * 0.14);

                let footprintW = 4.2;
                let footprintD = 4.4;

                if (houseType === 0) {
                    // TYPE 0: Classic Gabled Coastal Cottage with Covered Front Timber Porch
                    const w = 3.9, h = 3.6, d = 4.4;
                    footprintW = w + 1.1; footprintD = d;

                    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                    body.position.y = h * 0.5;
                    body.castShadow = true; body.receiveShadow = true;
                    hGroup.add(body);

                    const roof = createPitchedGableRoof(w, d, 1.85, rMat, gableMat);
                    roof.position.y = h;
                    hGroup.add(roof);

                    // Covered Front Porch (+X side) with timber posts & shed roof
                    const porchDeck = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.28, d * 0.78), sharedMats.woodPier);
                    porchDeck.position.set(w * 0.5 + 0.58, 0.14, 0);
                    hGroup.add(porchDeck);

                    const porchRoof = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.14, d * 0.82), rMat);
                    porchRoof.position.set(w * 0.5 + 0.62, 2.15, 0);
                    porchRoof.rotation.z = -0.28;
                    porchRoof.castShadow = true;
                    hGroup.add(porchRoof);

                    [-d * 0.34, 0, d * 0.34].forEach(pz => {
                        const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.95, 0.14), whiteTrimMat);
                        post.position.set(w * 0.5 + 1.08, 1.05, pz);
                        hGroup.add(post);
                    });

                    addDetailedChimney(hGroup, -w * 0.25, h + 1.0, -d * 0.24);

                } else if (houseType === 1) {
                    // TYPE 1: L-Shaped Mediterranean Villa with Projecting Wing & Upper Sun-Deck Balcony
                    const w1 = 3.8, h1 = 4.3, d1 = 4.6;
                    const w2 = 2.4, h2 = 3.1, d2 = 2.5;
                    footprintW = w1 + 1.4; footprintD = d1 + 0.4;

                    const mainWing = new THREE.Mesh(new THREE.BoxGeometry(w1, h1, d1), wallMat);
                    mainWing.position.set(-0.35, h1 * 0.5, 0);
                    mainWing.castShadow = true; mainWing.receiveShadow = true;
                    hGroup.add(mainWing);

                    const mainRoof = createPitchedGableRoof(w1, d1, 1.55, rMat, gableMat);
                    mainRoof.position.set(-0.35, h1, 0);
                    hGroup.add(mainRoof);

                    // Projecting perpendicular front wing (lower height so roofs never Z-fight)
                    const sideWing = new THREE.Mesh(new THREE.BoxGeometry(w2, h2, d2), wallMat);
                    sideWing.position.set(w1 * 0.5 + 0.45, h2 * 0.5, -d1 * 0.22);
                    sideWing.castShadow = true; sideWing.receiveShadow = true;
                    hGroup.add(sideWing);

                    const sideRoof = createPitchedGableRoof(d2, w2, 1.15, rMat, gableMat);
                    sideRoof.rotation.y = Math.PI / 2;
                    sideRoof.position.set(w1 * 0.5 + 0.45, h2, -d1 * 0.22);

            // Render each of the 26 Residential Driveways + Attached Garage Wings + Driveway Houses
            portObjects.driveways.forEach(dw => {

                };

                // Build contoured 3D Paved Driveway Ribbon from the main road edge to the parking pad
                const dwDx = dw.endX - dw.startX;
                const dwDz = dw.endZ - dw.startZ;
                const dwLen = Math.hypot(dwDx, dwDz);
                const dwYaw = Math.atan2(dwDx, dwDz);
                const dwSegs = 18;
                const dwWidth = 2.35;

                const dwGeo = new THREE.PlaneGeometry(dwWidth, dwLen, 4, dwSegs);
                dwGeo.rotateX(-Math.PI / 2);
                const dPos = dwGeo.attributes.position;

                const dirX = dwDx / dwLen;
                const dirZ = dwDz / dwLen;
                const perpX = dirZ;
                const perpZ = -dirX;

                for (let s = 0; s <= dwSegs; s++) {
                    const fracLen = s / dwSegs;
                    const cx = dw.startX + dwDx * fracLen;
                    const cz = dw.startZ + dwDz * fracLen;
                    // Flare the driveway apron wider where it meets the main road
                    const flare = (1.0 - smoothstep(0.0, 0.28, fracLen)) * 0.95 + 1.0;

                    for (let c = 0; c <= 4; c++) {
                        const across = ((c / 4) - 0.5) * dwWidth * flare;
                        const vx = cx + perpX * across;
                        const vz = cz + perpZ * across;
                        const isCurb = (c === 0 || c === 4);
                        const vy = getHillsideHeight(vx, vz) + (isCurb ? 0.13 : 0.09);

                worldGroup.add(bollardHalo);

            // 5. Populate All 5 Tiered Rows of Coastal Houses across the Expanded Hillside (-106 to -39.5)
            for (let z = -133; z <= 133; z += 5.8) {
                const roadX = getRoadCenterX(z);

                const row4X = roadX - 16.2 - Math.random() * 2.4;

            // 6. Populate 385+ Lush Coastal Trees across the Expanded Hillside (strictly behind X = -41.8 and clear of driveways)
            const treeCrownMats = [
                new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.85, flatShading: true }),
                new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.85, flatShading: true }),

            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });

                const tx = (MIN_X + 2.2) + Math.random() * (HILL_EDGE_X - 2.3 - (MIN_X + 2.2));

            }

            // 7. Spawn 18 Textured 3D Vehicles (Sedans, SUVs, Vans, Box Trucks, Buses) with Collision-Free Traffic & Smooth Driveway Turns
            const carColorHexes = ['#dc2626', '#0284c7', '#eab308', '#f8fafc', '#16a34a', '#ea580c', '#2563eb', '#0d9488', '#be185d'];
            const headLightMat = new THREE.MeshBasicMaterial({ color: 0xfef9c3 });
            const amberSignalMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
            const grilleMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6, metalness: 0.4 });
            const bumperChromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.25, metalness: 0.8 });

            // Shared 3D Wheel & Alloy Rim Geometries
            const wheelTireGeo = new THREE.CylinderGeometry(0.27, 0.27, 0.20, 14);
            wheelTireGeo.rotateZ(Math.PI / 2);
            const wheelRimGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.21, 10);
            wheelRimGeo.rotateZ(Math.PI / 2);

            const addWheelSet = (parentGroup, wheelCoords, scale = 1.0) => {
                wheelCoords.forEach(([wx, wy, wz]) => {
                    const wGroup = new THREE.Group();
                    wGroup.position.set(wx, wy, wz);
                    wGroup.scale.setScalar(scale);
                    const tire = new THREE.Mesh(wheelTireGeo, sharedMats.darkRubber);
                    tire.castShadow = true;
                    const rim = new THREE.Mesh(wheelRimGeo, bumperChromeMat);
                    wGroup.add(tire, rim);
                    parentGroup.add(wGroup);
                });
            };

            const sharedCarHeadBeamGeo = new THREE.CylinderGeometry(0.18, 1.15, 4.4, 12, 1, true);
            sharedCarHeadBeamGeo.rotateX(Math.PI / 2);
            sharedCarHeadBeamGeo.translate(0, -0.14, 2.2);
            const sharedCarHeadBeamMat = NightEnvironment.createDiffusedVolumetricMaterial(0xfef9c3, 0.0, 0.34, 1.4, 2.2);
            const sharedCarRoadPoolGeo = new THREE.PlaneGeometry(2.6, 4.8);
            sharedCarRoadPoolGeo.rotateX(-Math.PI / 2);
            const sharedCarRoadPoolMat = new THREE.MeshBasicMaterial({
                map: NightEnvironment.getSoftGlowTexture(),
                color: 0xfef9c3,
                transparent: true,
                opacity: 0.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            NightEnvironment.lightFixtures.push({ mat: sharedCarRoadPoolMat, dayOpacity: 0.0, maxOpacity: 0.36 });

            // Smooth tangent-continuous entry curve peeling off from uLead along the road lane into the driveway
            const buildDrivewayEntryCurve = (dw, laneOffset, dir) => {
                const uLead = THREE.MathUtils.clamp(dw.uRoad - dir * 0.015, 0.01, 0.99);
                const uLead2 = THREE.MathUtils.clamp(dw.uRoad - dir * 0.008, 0.01, 0.99);
                const uApex = THREE.MathUtils.clamp(dw.uRoad - dir * 0.002, 0.01, 0.99);

                const sampleLanePoint = (uVal, latMultiplier = 1.0) => {
                    const pt = portObjects.roadCurve.getPointAt(uVal);
                    const tan = portObjects.roadCurve.getTangentAt(uVal).normalize();
                    const nx = tan.z;
                    const nz = -tan.x;
                    return new THREE.Vector3(
                        pt.x + nx * laneOffset * latMultiplier,
                        pt.y + 0.05,
                        pt.z + nz * laneOffset * latMultiplier
                    );
                };

                const p0 = sampleLanePoint(uLead, 1.0);
                const p1 = sampleLanePoint(uLead2, 1.05);
                const pApexRoad = sampleLanePoint(uApex, 1.35);

                const dwDx = dw.endX - dw.startX;
                const dwDz = dw.endZ - dw.startZ;
                const pMouth = new THREE.Vector3(
                    dw.startX + dwDx * 0.12,
                    getHillsideHeight(dw.startX + dwDx * 0.12, dw.startZ + dwDz * 0.12) + 0.09,
                    dw.startZ + dwDz * 0.12
                );
                const pApron = new THREE.Vector3(
                    (pApexRoad.x + pMouth.x) * 0.5,
                    getHillsideHeight((pApexRoad.x + pMouth.x) * 0.5, (pApexRoad.z + pMouth.z) * 0.5) + 0.09,
                    (pApexRoad.z + pMouth.z) * 0.5
                );
                const pMid = new THREE.Vector3(
                    dw.startX + dwDx * 0.55,
                    getHillsideHeight(dw.startX + dwDx * 0.55, dw.startZ + dwDz * 0.55) + 0.09,
                    dw.startZ + dwDz * 0.55
                );
                const pPad = new THREE.Vector3(
                    dw.endX,
                    getHillsideHeight(dw.endX, dw.endZ) + 0.09,
                    dw.endZ
                );

                return {
                    uLead,
                    curve: new THREE.CatmullRomCurve3([p0, p1, pApron, pMouth, pMid, pPad])
                };
            };

            // Smooth 90-degree reverse-out curve from the garage pad backing into the upstream lane so the nose faces forward
            const buildDrivewayReverseExitCurve = (dw, laneOffset, dir) => {
                const uBackEnd = THREE.MathUtils.clamp(dw.uRoad - dir * 0.015, 0.01, 0.99);
                const uBackMid = THREE.MathUtils.clamp(dw.uRoad - dir * 0.008, 0.01, 0.99);
                const uApex = THREE.MathUtils.clamp(dw.uRoad - dir * 0.002, 0.01, 0.99);

                const sampleLanePoint = (uVal, latMultiplier = 1.0) => {
                    const pt = portObjects.roadCurve.getPointAt(uVal);
                    const tan = portObjects.roadCurve.getTangentAt(uVal).normalize();
                    const nx = tan.z;
                    const nz = -tan.x;
                    return new THREE.Vector3(
                        pt.x + nx * laneOffset * latMultiplier,
                        pt.y + 0.05,
                        pt.z + nz * laneOffset * latMultiplier
                    );
                };

                const dwDx = dw.endX - dw.startX;
                const dwDz = dw.endZ - dw.startZ;
                const pPad = new THREE.Vector3(
                    dw.endX,
                    getHillsideHeight(dw.endX, dw.endZ) + 0.09,
                    dw.endZ
                );
                const pMid = new THREE.Vector3(
                    dw.startX + dwDx * 0.55,
                    getHillsideHeight(dw.startX + dwDx * 0.55, dw.startZ + dwDz * 0.55) + 0.09,
                    dw.startZ + dwDz * 0.55
                );
                const pMouth = new THREE.Vector3(
                    dw.startX + dwDx * 0.12,
                    getHillsideHeight(dw.startX + dwDx * 0.12, dw.startZ + dwDz * 0.12) + 0.09,
                    dw.startZ + dwDz * 0.12
                );
                const pApexRoad = sampleLanePoint(uApex, 1.32);
                const pApron = new THREE.Vector3(
                    (pApexRoad.x + pMouth.x) * 0.5,
                    getHillsideHeight((pApexRoad.x + pMouth.x) * 0.5, (pApexRoad.z + pMouth.z) * 0.5) + 0.09,
                    (pApexRoad.z + pMouth.z) * 0.5
                );
                const pLane1 = sampleLanePoint(uBackMid, 1.05);
                const pLaneEnd = sampleLanePoint(uBackEnd, 1.0);

                return {
                    uMerge: uBackEnd,
                    curve: new THREE.CatmullRomCurve3([pPad, pMid, pMouth, pApron, pLane1, pLaneEnd])
                };
            };

            for (let i = 0; i < 18; i++) {
                const dir = i % 2 === 0 ? 1 : -1;
                const vType = i % 5; // 0: Sedan, 1: SUV, 2: Delivery Van, 3: Box Truck, 4: Coastal Bus
                const canUseDriveways = (vType <= 2); // Sedans, SUVs & Vans turn into and out of residential driveways
                const vGroup = new THREE.Group();
                const primaryHex = carColorHexes[i % carColorHexes.length];

                [-0.46, 0.46].forEach(lx => {

                // Evenly space vehicles per lane at startup so no two vehicles start on top of each other
                const laneSlotIdx = Math.floor(i / 2); // 0..8 per direction

                };

                // Start 4 residential cars already parked in same-side driveways so driveway activity is immediate
                if (canUseDriveways && i < 8) {
                    const sameSideDriveways = portObjects.driveways.filter(d => d.side === dir && !d.occupiedBy);
                    const initDw = sameSideDriveways[Math.floor(i / 2)];
                    if (initDw) {
                        initDw.occupiedBy = carObj;
                        carObj.activeDriveway = initDw;
                        carObj.u = initDw.uRoad;
                        carObj.entryCurveData = buildDrivewayEntryCurve(initDw, laneOffset, dir);
                        carObj.exitCurveData = buildDrivewayReverseExitCurve(initDw, laneOffset, dir);
                        carObj.state = 'PARKED_AT_HOUSE';
                        carObj.dwProgress = 1.0;
                        carObj.currentSpeed = 0;
                        carObj.parkTimer = 1.2 + i * 0.65;

                }

                portObjects.roadCars.push(carObj);

        }

        function buildExpandedSeaportAndUnderwater() {
            // 1. High-Resolution Sculpted & Bumpy Seabed Mesh (96 x 280 with 140 x 280 subdivisions)
            const seabedW = 96;
            const seabedCenterX = 22;
            const seabedGeo = new THREE.PlaneGeometry(seabedW, WORLD_Z, 140, 280);
            seabedGeo.rotateX(-Math.PI / 2);
            const sbPos = seabedGeo.attributes.position;

            for (let i = 0; i < sbPos.count; i++) {
                const wx = sbPos.getX(i) + seabedCenterX;
                const wz = sbPos.getZ(i);
                sbPos.setY(i, getSeabedDepthY(wx, wz));
            }
            seabedGeo.computeVertexNormals();

            // Compute organic vertex colors based on elevation, slope steepness, and local sediment variation
            const sbNorm = seabedGeo.attributes.normal;
            const sbColors = new Float32Array(sbPos.count * 3);
            const cTrenchAbyss = new THREE.Color(0x051c38);
            const cMidMud      = new THREE.Color(0x0a3966);
            const cSandRidge   = new THREE.Color(0x1f6e9c);
            const cShoalCrest  = new THREE.Color(0x3b8ea5);
            const cSteepRock   = new THREE.Color(0x162a40);
            const tmpSbCol     = new THREE.Color();

            for (let i = 0; i < sbPos.count; i++) {
                const wx = sbPos.getX(i) + seabedCenterX;
                const wy = sbPos.getY(i);
                const wz = sbPos.getZ(i);
                const ny = sbNorm.getY(i); // 1.0 = flat, smaller = steeper bump slope

                const hNorm = THREE.MathUtils.clamp((wy - (SEABED_Y - 3.6)) / 9.2, 0.0, 1.0);
                const slopeFactor = THREE.MathUtils.clamp((1.0 - ny) * 3.8, 0.0, 1.0);
                const patchNoise = 0.5 + 0.5 * Math.sin(wx * 0.24 + wz * 0.19) * Math.cos(wx * 0.17 - wz * 0.28);

                if (hNorm < 0.38) {
                    tmpSbCol.copy(cTrenchAbyss).lerp(cMidMud, hNorm / 0.38);
                } else if (hNorm < 0.72) {
                    tmpSbCol.copy(cMidMud).lerp(cSandRidge, (hNorm - 0.38) / 0.34);
                } else {
                    tmpSbCol.copy(cSandRidge).lerp(cShoalCrest, (hNorm - 0.72) / 0.28);
                }

                // Darken steep rocky ledges and highlight raised sandy hummocks
                tmpSbCol.lerp(cSteepRock, slopeFactor * 0.58);
                tmpSbCol.offsetHSL(0, 0, (patchNoise - 0.5) * 0.06);

                sbColors[i * 3]     = tmpSbCol.r;
                sbColors[i * 3 + 1] = tmpSbCol.g;
                sbColors[i * 3 + 2] = tmpSbCol.b;
            }
            seabedGeo.setAttribute('color', new THREE.BufferAttribute(sbColors, 3));

            const seabedMat = new THREE.MeshStandardMaterial({
                map: ProceduralTextures.createCausticSeabedTexture(),
                bumpMap: ProceduralTextures.createSeabedBumpTexture(),
                bumpScale: 0.42,
                vertexColors: true,
                roughness: 0.88,
                metalness: 0.05
            });

            seabedMat.onBeforeCompile = (shader) => {
                shader.uniforms.uCausticTime = ProceduralTextures.seabedUniforms.uCausticTime;
                shader.uniforms.uNightMix = ProceduralTextures.seabedUniforms.uNightMix;

                shader.vertexShader = `
                    varying vec3 vSeabedWorldPos;
                    varying float vSeabedSlope;
                ` + shader.vertexShader.replace(
                    '#include <worldpos_vertex>',
                    `
                    #include <worldpos_vertex>
                    vSeabedWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
                    vSeabedSlope = clamp(1.0 - normal.y, 0.0, 1.0);
                    `
                );

                shader.fragmentShader = `
                    uniform float uCausticTime;
                    uniform float uNightMix;
                    varying vec3 vSeabedWorldPos;
                    varying float vSeabedSlope;

                    vec2 causticHash2(vec2 p) {
                        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
                        return fract(sin(p) * 43758.5453);
                    }

                    float causticValueNoise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        vec2 u = f * f * (3.0 - 2.0 * f);
                        vec2 a = causticHash2(i);
                        vec2 b = causticHash2(i + vec2(1.0, 0.0));
                        vec2 c = causticHash2(i + vec2(0.0, 1.0));
                        vec2 d = causticHash2(i + vec2(1.0, 1.0));
                        return mix(mix(a.x, b.x, u.x), mix(c.x, d.x, u.x), u.y);
                    }

                    // Soft-edged cellular Voronoi ridge distance with organic cell jitter
                    float softVoronoiCausticLayer(vec2 p, float timeShift) {
                        vec2 n = floor(p);
                        vec2 f = fract(p);
                        float f1 = 8.0;
                        float f2 = 8.0;

                        for (int j = -1; j <= 1; j++) {
                            for (int i = -1; i <= 1; i++) {
                                vec2 g = vec2(float(i), float(j));
                                vec2 o = causticHash2(n + g);
                                o = 0.5 + 0.44 * sin(timeShift + 6.28318 * o);
                                vec2 r = g + o - f;
                                float d = dot(r, r);
                                if (d < f1) {
                                    f2 = f1;
                                    f1 = d;
                                } else if (d < f2) {
                                    f2 = d;
                                }
                            }
                        }

                        float ridgeDist = sqrt(f2) - sqrt(f1);
                        float softBand = 1.0 - smoothstep(0.02, 0.58, ridgeDist);
                        float softPool = 1.0 - smoothstep(0.0, 0.78, sqrt(f1));
                        return pow(softBand, 1.65) * 0.82 + pow(softPool, 2.2) * 0.24;
                    }

                    float evaluateSoftOceanCaustics(vec2 worldXZ, float t) {
                        vec2 lowFreq = worldXZ * 0.055;
                        vec2 warp1 = vec2(
                            causticValueNoise(lowFreq + vec2(t * 0.14, -t * 0.11)),
                            causticValueNoise(lowFreq + vec2(-t * 0.12, t * 0.15) + vec2(17.3, 9.2))
                        ) - 0.5;
                        vec2 warp2 = vec2(
                            causticValueNoise(lowFreq * 2.1 - vec2(t * 0.19, t * 0.16) + vec2(41.1, 23.7)),
                            causticValueNoise(lowFreq * 2.1 + vec2(t * 0.17, -t * 0.21) + vec2(11.8, 63.4))
                        ) - 0.5;

                        vec2 warpedXZ = worldXZ + warp1 * 8.5 + warp2 * 3.8;

                        vec2 uv1 = warpedXZ * 0.115 + vec2(t * 0.12, -t * 0.09);
                        float c1 = softVoronoiCausticLayer(uv1, t * 0.78);

            // Function to generate a realistic tiered kelp plant with holdfast, flexible stipes, pneumatocysts & wavy fronds
            function buildRealisticKelpPlant(height, frondsPerTier, bladeMat) {
                const plantRoot = new THREE.Group();
                const holdfastGeo = new THREE.ConeGeometry(0.48, 0.35, 6);
                const holdfast = new THREE.Mesh(holdfastGeo, kelpStemMat);
                holdfast.position.y = 0.17;
                plantRoot.add(holdfast);

                const tierCount = 4;
                const tierH = height / tierCount;
                const tiers = [];
                let parentGroup = plantRoot;

                for (let t = 0; t < tierCount; t++) {
                    const tierPivot = new THREE.Group();
                    tierPivot.position.set(0, t === 0 ? 0.25 : tierH, 0);

                    const topR = Math.max(0.03, 0.05 + (1 - t / tierCount) * 0.035);
                    const botR = topR + 0.02;
                    const stemGeo = new THREE.CylinderGeometry(topR, botR, tierH, 6);
                    stemGeo.translate(0, tierH * 0.5, 0);
                    const stemMesh = new THREE.Mesh(stemGeo, kelpStemMat);
                    tierPivot.add(stemMesh);

                    const fronds = [];
                    for (let f = 0; f < frondsPerTier; f++) {
                        const ang = (t * 1.62 + f * Math.PI) + (Math.random() - 0.5) * 0.35;
                        const frondPivot = new THREE.Group();
                        frondPivot.position.set(0, tierH * (0.35 + f * 0.35), 0);
                        frondPivot.rotation.y = ang;

                        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), kelpBulbMat);
                        bulb.position.set(0.09, 0, 0);
                        frondPivot.add(bulb);

                        const leafL = 1.1 + (t / tierCount) * 0.85 + Math.random() * 0.45;
                        const leafW = 0.22 + (1.0 - Math.abs(t - 2) / 2.0) * 0.16;
                        const leafGeo = new THREE.BufferGeometry();
                        const lPos = [];
                        const lIdx = [];
                        const segs = 4;
                        for (let s = 0; s <= segs; s++) {
                            const sF = s / segs;
                            const lx = 0.12 + sF * leafL;
                            const ly = Math.sin(sF * Math.PI * 0.85) * 0.22 - Math.pow(sF, 1.6) * 0.35;
                            const lz = Math.sin(sF * Math.PI * 1.5) * 0.12;
                            const w = Math.max(0.035, leafW * (1.0 - Math.abs(sF - 0.45) * 1.3) * 0.5);
                            lPos.push(lx, ly, lz + w);
                            lPos.push(lx, ly, lz - w);
                        }
                        for (let s = 0; s < segs; s++) {
                            const i1 = s * 2, i2 = i1 + 1, i3 = (s + 1) * 2, i4 = i3 + 1;
                            lIdx.push(i1, i3, i2, i2, i3, i4);
                            lIdx.push(i1, i2, i3, i2, i4, i3);
                        }
                        leafGeo.setAttribute('position', new THREE.Float32BufferAttribute(lPos, 3));
                        leafGeo.setIndex(lIdx);

            lane1X: -27.0, // Seaside Southbound Lane (under STS cranes)

            southZ: 62.0,
            turnR: 1.4,
            turnCenterX: -28.4,
            straightLen: 180.0,
            turnArcLen: 4.398229715, // Math.PI * 1.4
            totalLen: 368.79645943,  // 2 * 180.0 + 2 * 4.398229715

            getPose(s) {
                const total = this.totalLen;
                s = ((s % total) + total) % total;
                const sl = this.straightLen;
                const tl = this.turnArcLen;

                // 1. Southbound straightaway: Lane 1 (s in [0, sl))
                if (s < sl) {
                    return { x: this.lane1X, z: this.northZ + s, heading: 0.0, inTurn: false };
                }
                s -= sl;
                // 2. South U-turn arc: connecting Lane 1 to Lane 2 (s in [0, tl))
                if (s < tl) {
                    const u = s / tl;
                    const phi = u * Math.PI;
                    const x = this.turnCenterX + this.turnR * Math.cos(phi);
                    const z = this.southZ + this.turnR * Math.sin(phi);
                    const heading = Math.atan2(-Math.sin(phi), Math.cos(phi));
                    return { x, z, heading, inTurn: true };
                }
                s -= tl;
                // 3. Northbound straightaway: Lane 2 (s in [0, sl))
                if (s < sl) {
                    return { x: this.lane2X, z: this.southZ - s, heading: Math.PI, inTurn: false };
                }
                s -= sl;
                // 4. North U-turn arc: connecting Lane 2 to Lane 1 (s in [0, tl))
                const u = s / tl;
                const psi = u * Math.PI;
                const x = this.turnCenterX - this.turnR * Math.cos(psi);
                const z = this.northZ - this.turnR * Math.sin(psi);
                const heading = Math.atan2(Math.sin(psi), -Math.cos(psi));
                return { x, z, heading, inTurn: true };
            }
        };
