            createTaperedHullGeometry(len, beam, depth, bowSharpness = 0.32) {
                const halfW = beam * 0.5;
                const halfL = len * 0.5;
                const shape = new THREE.Shape();

                shape.moveTo(-halfW * 0.86, -halfL);
                shape.lineTo(halfW * 0.86, -halfL);
                shape.lineTo(halfW, halfL * (1 - bowSharpness * 2));
                shape.quadraticCurveTo(halfW * 0.92, halfL * 0.88, 0, halfL);
                shape.quadraticCurveTo(-halfW * 0.92, halfL * 0.88, -halfW, halfL * (1 - bowSharpness * 2));
                shape.closePath();

                const geo = new THREE.ExtrudeGeometry(shape, {
                    depth: depth,
                    bevelEnabled: true,
                    bevelSegments: 2,
                    steps: 1,
                    bevelSize: 0.18,
                    bevelThickness: 0.2
                });
                geo.rotateX(Math.PI / 2);
                geo.translate(0, depth * 0.65, 0);

                // Normalize UVs across the hull bounding box so procedural waterlines, rub-rails, and stripes map cleanly on the sides
                geo.computeBoundingBox();
                const bb = geo.boundingBox;
                const pos = geo.attributes.position;
                const norm = geo.attributes.normal;
                const uv = geo.attributes.uv;
                const spanY = Math.max(0.01, bb.max.y - bb.min.y);
                const spanZ = Math.max(0.01, bb.max.z - bb.min.z);
                const spanX = Math.max(0.01, bb.max.x - bb.min.x);

                for (let i = 0; i < pos.count; i++) {
                    const ny = Math.abs(norm.getY(i));
                    const vx = pos.getX(i);
                    const vy = pos.getY(i);
                    const vz = pos.getZ(i);
                    if (ny > 0.75) {
                        // Top/bottom faces map to upper solid paint region of hull texture
                        uv.setXY(i, (vx - bb.min.x) / spanX, 0.82);
                    } else {
                        // Side hull plating maps Z along U and vertical height Y along V (0 = keel, 1 = gunwale)
                        const u = (vz - bb.min.z) / spanZ;
                        const v = THREE.MathUtils.clamp((vy - bb.min.y) / spanY, 0.02, 0.98);
                        uv.setXY(i, u, v);
                    }
                }
                uv.needsUpdate = true;
                return geo;
            }

            buildSmallCraftCabinMaterial(wallHex, stripeHex) {
                const bundle = ProceduralTextures.createSmallCraftCabinTexture(wallHex, stripeHex);
                const mat = new THREE.MeshStandardMaterial({

                    roughness: 0.42,
                    metalness: 0.15,
                    clippingPlanes: dioramaClipPlanes
                });
                NightEnvironment.emissiveMaterials.push({ mat, maxIntensity: 1.35 });
                return mat;
            }

            populateRandomContainerManifest(fillRatio = 0.65) {
                for (let i = 0; i < this.cargoSlots.length; i++) {
                    const slot = this.cargoSlots[i];
                    if (slot.mesh) {
                        this.cargoGroup.remove(slot.mesh);
                        slot.mesh = null;
                    }
                    slot.reserved = false;
                }

                const bays = this.bayZOffsets.length;
                const rows = this.rowXOffsets.length;
                for (let b = 0; b < bays; b++) {
                    for (let r = 0; r < rows; r++) {
                        if (Math.random() < fillRatio + 0.15) {
                            const tier0 = this.cargoSlots.find(s => s.bayIdx === b && s.rowIdx === r && s.tier === 0);
                            if (tier0) {
                                const cMesh = createSingleContainerMesh();
                                cMesh.position.copy(tier0.localPos);
                                this.cargoGroup.add(cMesh);
                                tier0.mesh = cMesh;
                            }
                            if (Math.random() < fillRatio * 0.75) {
                                const tier1 = this.cargoSlots.find(s => s.bayIdx === b && s.rowIdx === r && s.tier === 1);
                                if (tier1) {
                                    const cMesh2 = createSingleContainerMesh();
                                    cMesh2.position.copy(tier1.localPos);
                                    this.cargoGroup.add(cMesh2);
                                    tier1.mesh = cMesh2;
                                }
                            }
                        }
                    }
                }
            }

            getLoadedContainerCount() {
                let count = 0;
                for (let i = 0; i < this.cargoSlots.length; i++) {
                    if (this.cargoSlots[i].mesh) count++;
                }
                return count;
            }

            getTopUnloadableSlot(sectorParity) {
                const candidateBays = sectorParity === 0 ? [0, 1] : [2, 3];
                for (let tier = this.maxTiers - 1; tier >= 0; tier--) {
                    for (let bIdx = 0; bIdx < candidateBays.length; bIdx++) {
                        const bay = candidateBays[bIdx];
                        for (let r = 0; r < this.rowXOffsets.length; r++) {
                            const slot = this.cargoSlots.find(
                                s => s.bayIdx === bay && s.rowIdx === r && s.tier === tier
                            );
                            if (slot && slot.mesh && !slot.reserved) {
                                return slot;
                            }
                        }
                    }
                }
                return null;
            }

            getBottomLoadableSlot(sectorParity) {
                const candidateBays = sectorParity === 0 ? [0, 1] : [2, 3];
                for (let tier = 0; tier < this.maxTiers; tier++) {
                    for (let bIdx = 0; bIdx < candidateBays.length; bIdx++) {
                        const bay = candidateBays[bIdx];
                        for (let r = 0; r < this.rowXOffsets.length; r++) {
                            const slot = this.cargoSlots.find(
                                s => s.bayIdx === bay && s.rowIdx === r && s.tier === tier
                            );
                            if (slot && !slot.mesh && !slot.reserved) {
                                if (tier === 0) return slot;
                                const below = this.cargoSlots.find(
                                    s => s.bayIdx === bay && s.rowIdx === r && s.tier === tier - 1
                                );
                                if (below && below.mesh) return slot;
                            }
                        }
                    }
                }
                return null;
            }

            recycleRightToLeftAppearance() {
                const shipNames = [
                    'M/V NORDIC MAERSK', 'CMA CGM ATLANTIC', 'M/V PACIFIC LEADER',
                    'MSC GULSUN', 'ONE INNOVATION', 'HAPAG LLOYD EXPRESS', 'MAERSK MC-KINNEY',
                    'EVER GOLDEN', 'COSCO SHIPPING PLANET', 'OOCL HONG KONG', 'YANG MING WISH'
                ];
                const otherNames = PortManager.vessels.filter(v => v !== this).map(v => v.name);
                const availableNames = shipNames.filter(n => !otherNames.includes(n));
                const pool = availableNames.length > 0 ? availableNames : shipNames;
                this.name = pool[Math.floor(Math.random() * pool.length)];
                this.id = 'IMO ' + Math.floor(910000 + Math.random() * 89000);

                const hullColors = ['#1e293b', '#0f3f5c', '#7f1d1d', '#14532d', '#1e3a8a', '#334155'];
                const otherColors = PortManager.vessels.filter(v => v !== this).map(v => v.hullColor);
                const availableColors = hullColors.filter(c => !otherColors.includes(c));
                const colorPool = availableColors.length > 0 ? availableColors : hullColors;
                const newHullHex = colorPool[Math.floor(Math.random() * colorPool.length)];
                this.hullColor = newHullHex;
                if (this.hullMat) {
                    this.hullMat.map = ProceduralTextures.createShipHullTexture(newHullHex);
                    this.hullMat.needsUpdate = true;
                }
                this.populateRandomContainerManifest(0.68);
                this.opsCompletedMoves = 0;
                this.opsTargetMoves = 6 + Math.floor(Math.random() * 4);
            }

            update(dt, time, allShips) {
                // 1. State Machine & Navigation
                if (this.vesselClass === 'FREIGHTER' || this.vesselClass === 'FEEDER') {
                    this.updateFreighterCycle(dt, time, allShips);
                } else {
                    this.updateSmallCraftNavigation(dt, time, allShips);
                }

                // 2. 4-Point Hydrodynamic Buoyancy (Bow, Stern, Port, Starboard wave sampling)
                const sinH = Math.sin(this.heading);
                const cosH = Math.cos(this.heading);
                const halfL = this.length * 0.36;
                const halfW = this.beam * 0.38;

                const hBow = sampleOceanSurface(this.position.x + sinH * halfL, this.position.z + cosH * halfL, time);
                const hStern = sampleOceanSurface(this.position.x - sinH * halfL, this.position.z - cosH * halfL, time);
                const hPort = sampleOceanSurface(this.position.x + cosH * halfW, this.position.z - sinH * halfW, time);
                const hStbd = sampleOceanSurface(this.position.x - cosH * halfW, this.position.z + sinH * halfW, time);

                const avgWaveY = (hBow + hStern + hPort + hStbd) * 0.25;
                const targetPitch = Math.atan2(hStern - hBow, this.length * 0.72) * 0.75;
                const targetRoll = Math.atan2(hPort - hStbd, this.beam * 0.76) * 0.82;

                const heaveStiff = (this.state === 'MOORED_OPS' || this.state === 'MOORED_MARINA') ? 10.0 : 14.0;
                this.heaveVel = (this.heaveVel + (avgWaveY - this.heaveY) * heaveStiff * dt) * 0.88;
                this.heaveY += this.heaveVel * dt;

                this.pitchVel = (this.pitchVel + (targetPitch - this.pitch) * 12.0 * dt) * 0.86;
                this.pitch += this.pitchVel * dt;

                this.rollVel = (this.rollVel + (targetRoll - this.roll) * 14.0 * dt) * 0.86;
                this.roll += this.rollVel * dt;

                this.root.position.set(this.position.x, this.heaveY, this.position.z);
                this.root.rotation.y = this.heading;
                this.hullGroup.rotation.set(this.pitch, 0, this.roll);

                // 3. Bow Wave Crest & Propagating 2D Wake Ripples
                const speedRatio = THREE.MathUtils.clamp(Math.abs(this.speed) / Math.max(1.0, this.maxSpeed), 0.0, 1.0);
                if (this.bowWaveMat) {
                    this.bowWaveMat.opacity = Math.pow(speedRatio, 1.35) * 0.68;
                    const sScale = 0.82 + speedRatio * 0.35;
                    this.bowWaveMesh.scale.set(sScale, 1, sScale);
                }

                if (speedRatio > 0.08 && Math.abs(this.position.z) < HALF_Z - 2) {
                    const wakePower = Math.pow(speedRatio, 1.65);
                    this.waveGridAccumulator += dt * (2.5 + speedRatio * 6.5);
                    if (this.waveGridAccumulator >= 1.0) {
                        this.waveGridAccumulator = 0;
                        const bowX = this.position.x + sinH * (this.length * 0.44);
                        const bowZ = this.position.z + cosH * (this.length * 0.44);
                        const sternX = this.position.x - sinH * (this.length * 0.46);
                        const sternZ = this.position.z - cosH * (this.length * 0.46);

                        disturbWaterGrid(bowX, bowZ, 0.16 * wakePower, Math.max(2.2, this.beam * 0.48), 0.32 * wakePower);
                        disturbWaterGrid(sternX, sternZ, -0.20 * wakePower, Math.max(2.4, this.beam * 0.54), 0.52 * wakePower);
                    }

                    this.wakeAccumulator += dt * this.speed;
                    if (this.wakeAccumulator > Math.max(1.8, this.beam * 0.42)) {
                        this.wakeAccumulator = 0;
                        const sternX = this.position.x - sinH * (this.length * 0.46);
                        const sternZ = this.position.z - cosH * (this.length * 0.46);
                        spawnShipWakeAndRipples(sternX, sternZ, this.heading, this.beam, this.speed, speedRatio);
                    }
                }

                this.updateMooringLines();
            }

            updateFreighterCycle(dt, time, allShips) {
                this.heading = HarborCollisionSystem.lerpAngle(this.heading, 0.0, dt * 2.5);

                if (this.state === 'ENTERING_FROM_RIGHT') {
                    this.targetSpeed = this.maxSpeed * 1.25;
                    this.speed = THREE.MathUtils.lerp(this.speed, this.targetSpeed, dt * 1.8);
                    this.position.x = THREE.MathUtils.lerp(this.position.x, 6.0, dt * 1.2);
                    this.position.z += this.speed * dt;

                    if (!this.assignedBerth) {
                        const target = this.targetBerth || PortManager.berths.find(b => !b.currentShip);
                        if (target) {
                            this.assignedBerth = target;
                            target.currentShip = this;
                            this.state = 'APPROACHING_BERTH';
                        }
                    } else {
                        this.state = 'APPROACHING_BERTH';
                    }

                } else if (this.state === 'APPROACHING_BERTH') {
                    if (!this.assignedBerth) {
                        const target = this.targetBerth || PortManager.berths.find(b => !b.currentShip);
                        if (target) {
                            this.assignedBerth = target;
                            target.currentShip = this;
                        } else {
                            this.state = 'ENTERING_FROM_RIGHT';
                            return;
                        }
                    }
                    const berthZ = this.assignedBerth.z;
                    const distZ = berthZ - this.position.z;

                    if (distZ > 28.0) {
                        this.position.x = THREE.MathUtils.lerp(this.position.x, 6.0, dt * 1.4);
                        this.targetSpeed = this.maxSpeed * 1.45;
                    } else if (distZ > 0.45) {
                        this.position.x = THREE.MathUtils.lerp(this.position.x, -11.5, dt * 0.85);
                        this.targetSpeed = Math.max(0.85, Math.min(this.maxSpeed * 0.75, distZ * 0.22));
                    } else {
                        this.position.z = berthZ;
                        this.speed = 0;
                        this.state = 'BERTHING_LATERAL';
                        return;
                    }

                    this.speed = THREE.MathUtils.lerp(this.speed, this.targetSpeed, dt * 2.2);
                    this.position.z += this.speed * dt;

                } else if (this.state === 'BERTHING_LATERAL') {
                    const targetQuayX = QUAY_X + this.beam * 0.5 + 1.05;
                    this.position.z = THREE.MathUtils.lerp(this.position.z, this.assignedBerth.z, dt * 2.5);
                    const dx = targetQuayX - this.position.x;
                    this.speed = Math.abs(dx) * 0.45;

                    this.thrusterTimer += dt;
                    if (this.thrusterTimer > 0.35) {
                        this.thrusterTimer = 0;
                        disturbWaterGrid(this.position.x + this.beam * 0.55, this.position.z + this.length * 0.28, -0.14, 2.4, 0.45);
                        disturbWaterGrid(this.position.x + this.beam * 0.55, this.position.z - this.length * 0.28, -0.14, 2.4, 0.45);
                    }

                    if (Math.abs(dx) > 0.12) {
                        this.position.x += Math.sign(dx) * Math.min(Math.abs(dx), 2.4 * dt);
                    } else {
                        this.position.x = targetQuayX;
                        this.speed = 0;
                        this.opsCompletedMoves = 0;
                        if (!this.opsTargetMoves || this.opsTargetMoves < 4) {
                            this.opsTargetMoves = 6 + Math.floor(Math.random() * 4);
                        }
                        this.state = 'MOORED_OPS';
                    }

                } else if (this.state === 'MOORED_OPS') {
                    const targetQuayX = QUAY_X + this.beam * 0.5 + 1.05;
                    this.position.x = THREE.MathUtils.lerp(this.position.x, targetQuayX, dt * 4.0);
                    if (this.assignedBerth) {
                        this.position.z = THREE.MathUtils.lerp(this.position.z, this.assignedBerth.z, dt * 4.0);
                    }
                    this.speed = 0;

                } else if (this.state === 'UNBERTHING') {
                    const departureLaneX = 16.5;
                    const dx = departureLaneX - this.position.x;
                    this.speed = 1.6;

                    this.thrusterTimer += dt;
                    if (this.thrusterTimer > 0.35) {
                        this.thrusterTimer = 0;
                        disturbWaterGrid(this.position.x - this.beam * 0.45, this.position.z + this.length * 0.28, -0.15, 2.4, 0.45);
                        disturbWaterGrid(this.position.x - this.beam * 0.45, this.position.z - this.length * 0.28, -0.15, 2.4, 0.45);
                    }

                    if (Math.abs(dx) > 0.6) {
                        this.position.x += Math.sign(dx) * Math.min(Math.abs(dx), 2.8 * dt);
                        this.position.z += 0.75 * dt;
                    } else {
                        this.targetBerth = this.assignedBerth;
                        if (this.assignedBerth && this.assignedBerth.currentShip === this) {
                            this.assignedBerth.currentShip = null;
                        }
                        this.assignedBerth = null;
                        this.state = 'DEPARTING_LEFT';
                    }

                } else if (this.state === 'DEPARTING_LEFT') {
                    this.targetSpeed = this.maxSpeed * 1.55;
                    this.speed = THREE.MathUtils.lerp(this.speed, this.targetSpeed, dt * 2.0);
                    this.position.x = THREE.MathUtils.lerp(this.position.x, 17.5, dt * 1.2);
                    this.position.z += this.speed * dt;

                    if (this.position.z > HALF_Z + this.length * 0.85) {
                        this.position.z = -HALF_Z - this.length * 0.85;
                        this.position.x = 6.0;
                        this.speed = this.maxSpeed * 1.25;
                        this.recycleRightToLeftAppearance();
                        if (this.targetBerth) {
                            this.assignedBerth = this.targetBerth;
                            this.targetBerth.currentShip = this;
                        }
                        this.state = 'APPROACHING_BERTH';
                    }
                }
            }

            updateSmallCraftNavigation(dt, time, allShips) {
                if (this.state === 'MOORED_MARINA' || this.state === 'STANDBY') {
                    this.speed = THREE.MathUtils.lerp(this.speed, 0, dt * 3.0);
                    return;
                }

                if (this.waypoints.length === 0) {
                    if (this.state === 'PATROL') {
                        const nextX = 35.0 + Math.random() * 20.0;
                        const nextZ = -78.0 + Math.random() * 152.0;
                        const safePt = HarborCollisionSystem.sanitizeTargetPoint(nextX, nextZ, this, allShips);
                        this.waypoints.push({ x: safePt.x, z: safePt.z, precision: false });
                    } else {
                        this.state = 'STANDBY';
                        return;
                    }
                }

                const wp = this.waypoints[0];
                const dx = wp.x - this.position.x;
                const dz = wp.z - this.position.z;
                const dist = Math.hypot(dx, dz);
                const stopRadius = wp.precision ? 2.4 : 6.0;

                if (dist < stopRadius) {
                    const finishedWp = this.waypoints.shift();
                    if (finishedWp && finishedWp.onReach) {
                        finishedWp.onReach(this);
                    }
                    return;
                }

                const desiredHeading = Math.atan2(dx, dz);
                const nav = HarborCollisionSystem.computeSafeNavigation(this, desiredHeading, dist, allShips);
                this.heading = HarborCollisionSystem.lerpAngle(this.heading, nav.heading, dt * (this.turnRate * 3.2));

                const approachSlowdown = wp.precision ? THREE.MathUtils.clamp(dist / 12.0, 0.25, 1.0) : 0.85;
                this.targetSpeed = this.maxSpeed * nav.speedFactor * approachSlowdown;
                this.speed = THREE.MathUtils.lerp(this.speed, this.targetSpeed, dt * 2.4);

                this.position.x += Math.sin(this.heading) * this.speed * dt;
                this.position.z += Math.cos(this.heading) * this.speed * dt;

                // Strict boundary enforcement between the two lighthouses
                const clampedX = THREE.MathUtils.clamp(this.position.x, 32.8, 57.2);
                const clampedZ = THREE.MathUtils.clamp(this.position.z, -82.5, 78.0);
                if (clampedX !== this.position.x || clampedZ !== this.position.z) {
                    this.position.x = clampedX;
                    this.position.z = clampedZ;
                    const toCenterHeading = Math.atan2(45.0 - this.position.x, 0.0 - this.position.z);
                    this.heading = HarborCollisionSystem.lerpAngle(this.heading, toCenterHeading, dt * 4.0);
                }
            }
        }

            lastDepartedBerthId: -1,

            isChannelClearForUnberthing(berth) {
                for (let i = 0; i < this.vessels.length; i++) {
                    const v = this.vessels[i];
                    if (berth && v === berth.currentShip) continue;
                    if (v.vesselClass === 'FREIGHTER' || v.vesselClass === 'FEEDER') {
                        if (v.state !== 'MOORED_OPS') {
                            return false;
                        }
                    }
                }
                return true;
            },

            isBerthReadyForDeparture(berth) {
                const ship = berth.currentShip;
                if (!ship || ship.state !== 'MOORED_OPS') return false;
                const anyCraneBusy = berth.cranes.some(c => c.state !== 'IDLE');
                if (anyCraneBusy) return false;

                // Ready if assigned cargo moves target is completed
                if (ship.opsCompletedMoves >= ship.opsTargetMoves) return true;

                // Also ready if no moves can be found by either crane
                const canMove0 = this.canCraneAssignMove(berth.cranes[0], ship, berth);
                const canMove1 = this.canCraneAssignMove(berth.cranes[1], ship, berth);
                if (!canMove0 && !canMove1 && ship.opsCompletedMoves > 0) {
                    ship.opsCompletedMoves = ship.opsTargetMoves;
                    return true;
                }
                return false;
            },

            canCraneAssignMove(crane, ship, berth) {
                if (!crane || !ship) return false;
                const berthStacks = portObjects.yardStacks.filter(
                    st => st.berthId === berth.id && (crane.sectorParity === 0 ? st.bayIdx < 3 : st.bayIdx >= 3)
                );
                const unloadSlot = ship.getTopUnloadableSlot(crane.sectorParity);
                const dropStack = berthStacks.find(st => !st.reservedDrop && !st.reservedPick && st.containers.length < st.maxTiers);
                if (unloadSlot && dropStack) return true;

                const loadSlot = ship.getBottomLoadableSlot(crane.sectorParity);
                const pickStack = berthStacks.find(st => !st.reservedPick && !st.reservedDrop && st.containers.length > 0);
                if (loadSlot && pickStack) return true;

                return false;
            },

            scheduleBerthCranes() {
                // 1. Channel clearance check: only 1 vessel moves in channel at a time
                const channelClear = this.isChannelClearForUnberthing();

                // 2. Identify all berths ready to unberth
                const readyBerths = [];
                for (let bIdx = 0; bIdx < this.berths.length; bIdx++) {
                    const berth = this.berths[bIdx];
                    if (this.isBerthReadyForDeparture(berth)) {
                        readyBerths.push(berth);
                    }
                }

                // 3. Staggered random departure arbiter
                if (channelClear && readyBerths.length > 0) {
                    // Filter out the berth that just departed so consecutive departures alternate/stagger
                    let eligible = readyBerths.filter(b => b.id !== this.lastDepartedBerthId);
                    if (eligible.length === 0) eligible = readyBerths;

                    // Fair randomized selection among ready berths
                    const chosenBerth = eligible[Math.floor(Math.random() * eligible.length)];
                    chosenBerth.currentShip.state = 'UNBERTHING';
                    this.lastDepartedBerthId = chosenBerth.id;
                }

                // 4. Update HUD and assign cargo operations to idle cranes
                for (let bIdx = 0; bIdx < this.berths.length; bIdx++) {
                    const berth = this.berths[bIdx];
                    const ship = berth.currentShip;
                    const statusEl = document.getElementById('berth-status-' + bIdx);
                    const craneEl = document.getElementById('berth-crane-' + bIdx);
                    const remEl = document.getElementById('berth-rem-' + bIdx);

                    if (!ship) {
                        if (statusEl) { statusEl.innerText = 'OPEN BERTH'; statusEl.style.color = '#94a3b8'; }
                        if (craneEl) craneEl.innerText = berth.cranes.map(c => c.id).join(', ') + ': STANDBY';
                        if (remEl) remEl.innerText = 'Awaiting Inbound';
                        continue;
                    }

                    if (ship.state !== 'MOORED_OPS') {
                        if (statusEl) {
                            if (ship.state === 'UNBERTHING' || ship.state === 'DEPARTING_LEFT') {
                                statusEl.innerText = 'DEPARTING';
                                statusEl.style.color = '#f59e0b';
                            } else {
                                statusEl.innerText = 'INBOUND';
                                statusEl.style.color = '#38bdf8';
                            }
                        }
                        if (craneEl) craneEl.innerText = ship.name;
                        if (remEl) {
                            if (ship.state === 'UNBERTHING' || ship.state === 'DEPARTING_LEFT') {
                                remEl.innerText = 'Clearing Berth';
                            } else {
                                remEl.innerText = 'Approaching Berth';
                            }
                        }
                        continue;
                    }

                    // Moored ops: check if completed moves waiting on VTS hold
                    if (ship.opsCompletedMoves >= ship.opsTargetMoves) {
                        if (statusEl) {
                            statusEl.innerText = 'VTS HOLD';
                            statusEl.style.color = '#facc15';
                        }
                        if (craneEl) {
                            craneEl.innerText = berth.cranes.map(c => c.id + ':RDY').join(' | ');
                        }
                        if (remEl) {
                            remEl.innerText = 'Moves Done (' + ship.opsCompletedMoves + '/' + ship.opsTargetMoves + ')';
                        }
                        continue;
                    }

                    if (statusEl) { statusEl.innerText = 'CARGO OPS'; statusEl.style.color = '#4ade80'; }
                    if (craneEl) {
                        craneEl.innerText = berth.cranes.map(c => c.id + ':' + (c.state === 'IDLE' ? 'RDY' : c.mode)).join(' | ');
                    }
                    if (remEl) {
                        remEl.innerText = 'Moves: ' + ship.opsCompletedMoves + '/' + ship.opsTargetMoves;
                    }

                    const inFlightMoves = berth.cranes.filter(c => c.state !== 'IDLE').length;
                    if (ship.opsCompletedMoves + inFlightMoves >= ship.opsTargetMoves) continue;

                    berth.cranes.forEach(crane => {
                        if (crane.state !== 'IDLE') return;
                        if (ship.opsCompletedMoves + berth.cranes.filter(c => c.state !== 'IDLE').length >= ship.opsTargetMoves) return;

                        const nextMode = crane.lastMode === 'UNLOAD' ? 'LOAD' : 'UNLOAD';
                        const berthStacks = portObjects.yardStacks.filter(
                            st => st.berthId === berth.id && (crane.sectorParity === 0 ? st.bayIdx < 3 : st.bayIdx >= 3)
                        );

                        if (nextMode === 'UNLOAD') {
                            const slot = ship.getTopUnloadableSlot(crane.sectorParity);
                            const yardStack = berthStacks.find(st => !st.reservedDrop && !st.reservedPick && st.containers.length < st.maxTiers);
                            if (slot && yardStack) {
                                crane.assignCycle(ship, 'UNLOAD', slot, yardStack);
                                return;
                            }
                        }

                        const loadSlot = ship.getBottomLoadableSlot(crane.sectorParity);
                        const pickStack = berthStacks.find(st => !st.reservedPick && !st.reservedDrop && st.containers.length > 0);
                        if (loadSlot && pickStack) {
                            crane.assignCycle(ship, 'LOAD', loadSlot, pickStack);
                        } else {
                            const fallbackSlot = ship.getTopUnloadableSlot(crane.sectorParity);
                            const fallbackStack = berthStacks.find(st => !st.reservedDrop && !st.reservedPick && st.containers.length < st.maxTiers);
                            if (fallbackSlot && fallbackStack) {
                                crane.assignCycle(ship, 'UNLOAD', fallbackSlot, fallbackStack);
                            }
                        }
                    });
                }
            },

        ];
        let autoCamEnabled = false;
        let autoCamIndex = 0;
        let autoCamTimer = 0;
        const AUTO_CAM_DURATION = 90.0; // 90 seconds (1.5 minutes) per camera angle for slow, relaxing screensaver tour

        const autoCamBtn = document.getElementById('auto-cam-btn');
        const autoCamLabel = document.getElementById('auto-cam-label');

        function updateAutoCamLabel() {
            if (!autoCamEnabled) {
                autoCamLabel.innerText = 'Auto Camera: Off';
                autoCamBtn.title = 'Toggle Automatic Camera Screensaver (1.5 min per angle, endless loop)';
                return;
            }
            const mode = autoCamSequence[autoCamIndex];
            let name = 'Overview';
            if (mode === 'follow') {
                const sv = PortManager.selectedVessel || PortManager.commandTug;
                name = sv ? ('Tracking ' + sv.name) : 'Vessel Tracking';
            } else if (cameraPresets[mode]) {
                name = cameraPresets[mode].label || mode;
            }
            autoCamLabel.innerText = 'Auto Cam: ' + name;
            autoCamBtn.title = 'Auto Camera: ' + name + ' (1.5 min per angle, endless loop). Click to stop.';
        }

        function applyAutoCamStep(mode) {
            PortManager.cameraMode = mode;
            if (mode === 'follow') {
                // Pick an interesting moving or working vessel to follow
                const movingShips = PortManager.vessels.filter(v => v.speed > 0.3 || v.state === 'MOORED_OPS' || v.state === 'DISPATCHED' || v.state === 'TRANSIT_OUT');
                if (movingShips.length > 0) {
                    PortManager.selectedVessel = movingShips[autoCamIndex % movingShips.length];
                } else {
                    PortManager.selectedVessel = PortManager.commandTug;
                }
                const sv = PortManager.selectedVessel || PortManager.commandTug;
                activeCamTransition = {
                    pos: new THREE.Vector3(sv.position.x + 44, 25, sv.position.z + 40),
                    target: new THREE.Vector3(sv.position.x, 2, sv.position.z),
                    timer: 0
                };
            } else if (cameraPresets[mode]) {
                activeCamTransition = {
                    pos: cameraPresets[mode].pos.clone(),
                    target: cameraPresets[mode].target.clone(),
                    timer: 0
                };
            }
            updateAutoCamLabel();
        }

        function toggleAutoCamera() {
            autoCamEnabled = !autoCamEnabled;
            if (autoCamEnabled) {
                autoCamBtn.classList.add('is-active-cam');
                autoCamTimer = 0;
                applyAutoCamStep(autoCamSequence[autoCamIndex]);
            } else {
                autoCamBtn.classList.remove('is-active-cam');
                PortManager.cameraMode = 'overview';
                activeCamTransition = null;
                updateAutoCamLabel();
            }
        }

        autoCamBtn.addEventListener('click', toggleAutoCamera);

        // Day / Bioluminescent Night Toggle Handler & Keyboard Shortcut ('N')
        const dayNightBtn = document.getElementById('day-night-btn');
        const dayNightIcon = document.getElementById('day-night-icon');
        const dayNightLabel = document.getElementById('day-night-label');

        function toggleDayNightMode() {
            NightEnvironment.isNight = !NightEnvironment.isNight;
            if (NightEnvironment.isNight) {
                dayNightBtn.classList.add('is-night');
                dayNightIcon.innerText = '☀️';

        dayNightBtn.addEventListener('click', toggleDayNightMode);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'n' || e.key === 'N') {
                toggleDayNightMode();

        });

        const dayBgCol = new THREE.Color(0xf2efe9);
        const nightBgCol = new THREE.Color(0x050a14);
        const dayFloorCol = new THREE.Color(0xf2efe9);
        const nightFloorCol = new THREE.Color(0x070d19);
        const daySunCol = new THREE.Color(0xfffbeb);
        const nightMoonCol = new THREE.Color(0x60a5fa);
        const dayHemiSky = new THREE.Color(0xffffff);
        const nightHemiSky = new THREE.Color(0x1e3a8a);
        const dayHemiGround = new THREE.Color(0xd6cfc2);
        const nightHemiGround = new THREE.Color(0x090d16);
        const dayWaterEmissive = new THREE.Color(0x041e42);
        const nightWaterEmissive = new THREE.Color(0x03284c);

        function updateDayNightAtmosphereAndBioluminescence(dt, time) {
            const targetMix = NightEnvironment.isNight ? 1.0 : 0.0;
            NightEnvironment.nightMix = THREE.MathUtils.lerp(NightEnvironment.nightMix, targetMix, Math.min(1.0, dt * 3.2));
            const m = NightEnvironment.nightMix;

            // 1. Interpolate Scene Background, Fog, Studio Floor & Directional/Hemisphere Lights
            scene.background.copy(dayBgCol).lerp(nightBgCol, m);
            scene.fog.color.copy(scene.background);
            studioFloor.material.color.copy(dayFloorCol).lerp(nightFloorCol, m);

            sunLight.color.copy(daySunCol).lerp(nightMoonCol, m);
            sunLight.intensity = THREE.MathUtils.lerp(1.42, 0.38, m);

            hemiLight.color.copy(dayHemiSky).lerp(nightHemiSky, m);
            hemiLight.groundColor.copy(dayHemiGround).lerp(nightHemiGround, m);
            hemiLight.intensity = THREE.MathUtils.lerp(0.74, 0.28, m);

            fillLight.intensity = THREE.MathUtils.lerp(0.45, 0.34, m);
            renderer.toneMappingExposure = THREE.MathUtils.lerp(1.12, 1.24, m);

            // Water surface & side walls emissive glow
            waterSurfaceMat.emissive.copy(dayWaterEmissive).lerp(nightWaterEmissive, m);
            waterSurfaceMat.emissiveIntensity = THREE.MathUtils.lerp(0.30, 0.56, m);
            waterSurfaceMat.envMapIntensity = THREE.MathUtils.lerp(1.38, 0.45, m);

            // 2. Update Window Emissive Materials (Houses, Church, Ship Superstructures)
            for (let i = 0; i < NightEnvironment.emissiveMaterials.length; i++) {
                const item = NightEnvironment.emissiveMaterials[i];
                item.mat.emissiveIntensity = item.maxIntensity * m;
            }

            // 3. Update Underwater Fluorescent Coral, Starfish, Fish, Manta Rays & Jellyfish Materials
            for (let i = 0; i < NightEnvironment.fluorescentMaterials.length; i++) {
                const fm = NightEnvironment.fluorescentMaterials[i];
                const dayInt = fm.dayIntensity || 0.0;
                fm.mat.emissiveIntensity = THREE.MathUtils.lerp(dayInt, fm.maxIntensity, m);
            }

            // 4. Update Streetlamp Ground Pools, Diffused Volumetric Beams, Radial Glow Halos & PointLights
            for (let i = 0; i < NightEnvironment.lightFixtures.length; i++) {
                const lf = NightEnvironment.lightFixtures[i];
                const dayOp = lf.dayOpacity || 0.0;
                lf.mat.opacity = THREE.MathUtils.lerp(dayOp, lf.maxOpacity, m);
            }
            for (let i = 0; i < NightEnvironment.volumetricBeams.length; i++) {
                const vb = NightEnvironment.volumetricBeams[i];
                const dayOp = vb.dayOpacity || 0.0;
                vb.mat.uniforms.uOpacity.value = THREE.MathUtils.lerp(dayOp, vb.maxOpacity, m);
            }
            for (let i = 0; i < NightEnvironment.glowSprites.length; i++) {
                const gs = NightEnvironment.glowSprites[i];
                const dayOp = gs.dayOpacity || 0.0;
                gs.mat.opacity = THREE.MathUtils.lerp(dayOp, gs.maxOpacity, m);
            }
            for (let i = 0; i < NightEnvironment.portPointLights.length; i++) {
                const pl = NightEnvironment.portPointLights[i];
                pl.light.intensity = pl.maxIntensity * m;
            }
            const showShipLights = m > 0.08;
            for (let i = 0; i < NightEnvironment.shipNightGroups.length; i++) {
                NightEnvironment.shipNightGroups[i].visible = showShipLights;
            }

            // 5. Animate 38 Pulsing 3D Bioluminescent Jellyfish
            for (let i = 0; i < NightEnvironment.jellyfish.length; i++) {
                const jf = NightEnvironment.jellyfish[i];
                const cycle = time * jf.speed + jf.phase;
                const pulse = Math.sin(cycle);
                const contract = 1.0 - Math.max(0, pulse) * 0.22;
                const stretch = 1.0 + Math.max(0, pulse) * 0.26;

                jf.bell.scale.set(contract, stretch, contract);
                jf.group.position.y = jf.baseY + Math.sin(cycle * 0.5) * 1.15;
                jf.group.position.x = jf.baseX + Math.cos(cycle * 0.35 + i) * 0.9;
                jf.group.position.z = jf.baseZ + Math.sin(cycle * 0.35 + i) * 0.9;

                for (let t = 0; t < jf.tentacles.length; t++) {
                    const tent = jf.tentacles[t];
                    tent.rotation.x = Math.sin(cycle + t * 0.9) * 0.24;
                    tent.rotation.z = Math.cos(cycle + t * 0.9) * 0.24;
                }
            }

            // 6. Animate Drifting Bioluminescent Plankton Sparkles
            if (NightEnvironment.planktonPoints && m > 0.01) {
                const pAttr = NightEnvironment.planktonPoints.geometry.attributes.position;
                for (let i = 0; i < NightEnvironment.planktonData.length; i++) {
                    const pd = NightEnvironment.planktonData[i];
                    const px = pd.baseX + Math.sin(time * pd.speed + pd.phase) * 0.85;
                    const py = pd.baseY + Math.cos(time * pd.speed * 0.8 + pd.phase) * 0.45;
                    const pz = pd.baseZ + Math.cos(time * pd.speed + pd.phase) * 0.85;
                    pAttr.setXYZ(i, px, py, pz);
                }
                pAttr.needsUpdate = true;
            }
        }

        // ============================================================================
        // 10. MAIN SIMULATION & RENDERING LOOP
        // ============================================================================
        const clock = new THREE.Clock();
        let causticFrameCounter = 0;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const time = clock.getElapsedTime();

            // 0. Update Day / Bioluminescent Night Atmosphere, Lights & Underwater Bio-Fluorescence
            updateDayNightAtmosphereAndBioluminescence(dt, time);

            // 1. Update Ocean Floor Caustics Shader Uniform
            ProceduralTextures.updateCaustics(time);

            // 2. Step 2D Shallow-Water Wave Equation & Sync Cutaway Water Walls
            updateOceanSurfaceAndCutawayWalls(time, dt);

            // 3. Update Port VTS Scheduler, 6 STS Gantry Cranes & All Vessels
            PortManager.update(dt, time);

            // 4. Update 520 Schooling Fish, Flying Seagulls, Tiered Kelp Forests & Hydrothermal Bubbles
            marineEcosystem.update(time);
            harborBirds.update(dt, time);

            // Realistic multi-tier kelp forest wave surge & frond flutter (Hoisted loop invariants)
            const kelpFlutterTime = time * 3.4;
            for (let i = 0; i < portObjects.kelpPlants.length; i++) {
                const kp = portObjects.kelpPlants[i];
                const surgeTimeZ = time * kp.surgeRate + kp.phase;
                const surgeTimeX = time * (kp.surgeRate * 0.82) + kp.phase;
                for (let t = 0; t < kp.tiers.length; t++) {
                    const tier = kp.tiers[t];
                    const heightFactor = (t + 1) * 0.075;
                    const phaseLag = t * 0.32;
                    tier.pivot.rotation.z = Math.sin(surgeTimeZ - phaseLag) * heightFactor;
                    tier.pivot.rotation.x = Math.cos(surgeTimeX - phaseLag) * (heightFactor * 0.65);

                    for (let f = 0; f < tier.fronds.length; f++) {
                        const frond = tier.fronds[f];
                        frond.pivot.rotation.z = Math.sin(kelpFlutterTime + frond.phase) * 0.14;
                    }
                }
            }
            for (let i = 0; i < portObjects.underwaterBubbles.length; i++) {
                const ub = portObjects.underwaterBubbles[i];
                ub.mesh.position.y += ub.speed * dt;
                ub.mesh.position.x = ub.baseX + Math.sin(time * 3.1 + ub.phase) * 0.38;
                ub.mesh.position.z = ub.baseZ + Math.cos(time * 2.7 + ub.phase) * 0.38;
                if (ub.mesh.position.y >= ub.maxY) {
                    ub.mesh.position.y = ub.minY;
                }
            }

            // 5. Update Twin Lighthouses, Control Tower Radar, Slewing Cranes & 10 Buoys
            portObjects.lighthouses.forEach((beam, idx) => {
                beam.rotation.y = time * (idx === 0 ? -0.95 : 0.82);
            });
            if (portObjects.radarScanner) {
                portObjects.radarScanner.rotation.y = time * 2.4;
            }
            portObjects.slewingCranes.forEach(sc => {
                sc.pivot.rotation.y = Math.sin(time * 0.45 + sc.basePhase) * 0.65;
            });

            portObjects.navigationLights.forEach(nl => {
                const bh = sampleOceanSurface(nl.baseX, nl.baseZ, time);
                nl.group.position.y = bh;
                nl.group.rotation.z = Math.sin(time * 2.4 + nl.phase) * 0.15;
                nl.group.rotation.x = Math.cos(time * 2.1 + nl.phase) * 0.13;
                const blink = Math.sin(time * 4.2 + nl.phase) > 0.2 ? 1.0 : 0.25;
                nl.beacon.scale.setScalar(0.85 + blink * 0.35);
            });

            // 6. Update RTG Yard Cranes, Terminal Tractors & Hillside Road Vehicles
            portObjects.rtgCranes.forEach(rtg => {
                rtg.mesh.position.z += rtg.dir * rtg.speed * dt;
                if (rtg.mesh.position.z > rtg.maxZ) rtg.dir = -1;
                if (rtg.mesh.position.z < rtg.minZ) rtg.dir = 1;
            });

            // Realistic Anti-Collision Closed-Loop Apron Traffic for Quay Terminal Tractors
            const totalTruckCircuitLen = YardTruckCircuit.totalLen;
            const numActiveYardTrucks = portObjects.yardTrucks.length;

            portObjects.yardTrucks.forEach((yt, i) => {
                // 1. Forward gap along the circuit to closest lead vehicle ahead
                let minGap = Infinity;
                let leadTruck = null;
                for (let j = 0; j < numActiveYardTrucks; j++) {
                    if (i === j) continue;
                    const other = portObjects.yardTrucks[j];
                    let gap = other.trackDist - yt.trackDist;
                    while (gap < 0) gap += totalTruckCircuitLen;
                    while (gap >= totalTruckCircuitLen) gap -= totalTruckCircuitLen;
                    if (gap < minGap) {
                        minGap = gap;
                        leadTruck = other;
                    }
                }

                // 2. Intelligent car-following & safe braking distance model
                const safeStopGap = 9.2; // Safe bumper-to-bumper buffer (chassis is 5.6m)
                const slowRange = 22.0;  // Proactive deceleration horizon
                let targetSpeed = yt.cruiseSpeed;
                let isBraking = false;

                if (minGap < safeStopGap) {
                    targetSpeed = 0.0;
                    isBraking = true;
                } else if (minGap < slowRange) {
                    const t = (minGap - safeStopGap) / (slowRange - safeStopGap);
                    const leadSpd = leadTruck ? leadTruck.currentSpeed : 0.0;
                    targetSpeed = (leadSpd * 0.8) * (1.0 - t) + yt.cruiseSpeed * Math.pow(t, 1.6);
                    isBraking = true;
                }

                // 3. Authentic speed reduction through hairpin U-turns
                const curPose = YardTruckCircuit.getPose(yt.trackDist);
                if (curPose.inTurn) {
                    targetSpeed = Math.min(targetSpeed, 3.8);
                }

                // 4. Periodic operational pauses at berth container transfer points
                if (yt.pauseTimer > 0) {
                    yt.pauseTimer -= dt;
                    targetSpeed = 0.0;
                    isBraking = true;
                } else {
                    yt.pauseCooldown -= dt;
                    if (yt.pauseCooldown <= 0 && !curPose.inTurn && minGap > 28.0) {
                        const curZ = yt.mesh.position.z;
                        const nearBerth = (Math.abs(curZ - (-86.0)) < 8.0) ||
                                          (Math.abs(curZ - (-18.0)) < 8.0) ||
                                          (Math.abs(curZ - 50.0) < 8.0);
                        if (nearBerth && Math.random() < 0.04) {
                            yt.pauseTimer = 2.4 + Math.random() * 2.2;
                            yt.pauseCooldown = 28.0 + Math.random() * 24.0;
                            targetSpeed = 0.0;
                            isBraking = true;
                        }
                    }
                }

                // 5. Smooth acceleration and realistic air-brake deceleration
                const accelRate = targetSpeed < yt.currentSpeed ? 6.2 : 2.2;
                yt.currentSpeed += (targetSpeed - yt.currentSpeed) * Math.min(1.0, dt * accelRate);

                // 6. Advance distance along circuit
                yt.trackDist = (yt.trackDist + yt.currentSpeed * dt) % totalTruckCircuitLen;

                // 7. Update 3D position and continuous yaw heading
                const nextPose = YardTruckCircuit.getPose(yt.trackDist);
                yt.mesh.position.set(nextPose.x, APRON_Y, nextPose.z);
                yt.mesh.rotation.y = nextPose.heading;

                // 8. Dynamic rear brake lights
                if (yt.brakeLightMat) {
                    if (isBraking || yt.currentSpeed < 0.3) {
                        yt.brakeLightMat.color.setHex(0xff2222);
                    } else {
                        yt.brakeLightMat.color.setHex(0x550a0a);
                    }
                }
            });

            if (portObjects.roadCurve) {
                // Helper: forward wrapped distance in u [0, 0.98) from uFrom to uTo along travel direction dir
                const getForwardDeltaU = (uFrom, uTo, dir) => {
                    const span = 0.98;
                    let diff = (uTo - uFrom) * dir;
                    while (diff < 0) diff += span;
                    while (diff >= span) diff -= span;
                    return diff;
                };

                portObjects.roadCars.forEach(rc => {
                    let isBraking = false;

                    if (rc.state === 'CRUISING_ROAD') {
                        rc.cooldown = Math.max(0, rc.cooldown - dt);

                        // 1. Check for a free same-side driveway ahead to turn into smoothly
                        if (rc.canUseDriveways && rc.cooldown <= 0 && !rc.activeDriveway) {
                            for (let dIdx = 0; dIdx < portObjects.driveways.length; dIdx++) {
                                const dw = portObjects.driveways[dIdx];
                                if (dw.side !== rc.dir || dw.occupiedBy) continue;
                                const uLead = THREE.MathUtils.clamp(dw.uRoad - rc.dir * 0.015, 0.01, 0.99);
                                const distToTurnStart = getForwardDeltaU(rc.u, uLead, rc.dir);
                                // Reserve driveway ~8 meters before the turn-in point so the car decelerates smoothly into the turn
                                if (distToTurnStart > 0.002 && distToTurnStart < 0.028) {
                                    dw.occupiedBy = rc;
                                    rc.activeDriveway = dw;
                                    rc.entryCurveData = rc.buildEntryCurve(dw, rc.laneOffset, rc.dir);
                                    rc.exitCurveData = rc.buildExitCurve(dw, rc.laneOffset, rc.dir);
                                    break;
                                }
                            }
                        }

                        // 2. Intelligent Car-Following: find closest vehicle or merging obstacle ahead in the same lane
                        let desiredSpeed = rc.maxSpeed;
                        let minAheadDeltaU = 1.0;
                        let leadCarSpeed = rc.maxSpeed;

                        for (let j = 0; j < portObjects.roadCars.length; j++) {
                            const other = portObjects.roadCars[j];
                            if (other === rc || other.dir !== rc.dir) continue;

                            let obstacleU = null;
                            let obstacleSpeed = other.currentSpeed;

                            if (other.state === 'CRUISING_ROAD' || other.state === 'SHIFTING_TO_DRIVE') {
                                obstacleU = other.u;
                            } else if (other.state === 'ENTERING_DRIVEWAY' && other.dwProgress < 0.58) {
                                // Car ahead is still peeling off the road into a driveway
                                obstacleU = other.u;
                                obstacleSpeed = other.maxSpeed * 0.25;
                            } else if (other.state === 'BACKING_OUT_DRIVEWAY' && other.exitCurveData) {
                                // Car ahead is backing out of a driveway into our lane
                                obstacleU = other.exitCurveData.uMerge;
                                obstacleSpeed = 0.0;
                            }

                            if (obstacleU !== null) {
                                const dU = getForwardDeltaU(rc.u, obstacleU, rc.dir);
                                if (dU > 0.0 && dU < minAheadDeltaU) {
                                    minAheadDeltaU = dU;
                                    leadCarSpeed = obstacleSpeed;
                                }
                            }
                        }

                        const safeFollowU = 0.048; // ~13.5m headway
                        const minStopU = 0.021;    // ~5.8m minimum bumper-to-bumper spacing
                        if (minAheadDeltaU < safeFollowU) {
                            isBraking = true;
                            if (minAheadDeltaU <= minStopU) {
                                desiredSpeed = 0.0;
                            } else {
                                const followT = (minAheadDeltaU - minStopU) / (safeFollowU - minStopU);
                                desiredSpeed = Math.min(desiredSpeed, leadCarSpeed * followT);
                            }
                        }

                        // 3. Smooth deceleration if approaching our reserved driveway turn-in point
                        if (rc.activeDriveway && rc.entryCurveData) {
                            const distToLead = getForwardDeltaU(rc.u, rc.entryCurveData.uLead, rc.dir);
                            if (distToLead < 0.032) {
                                isBraking = true;
                                const turnEntrySpeed = rc.maxSpeed * 0.52;
                                const slowT = THREE.MathUtils.clamp(distToLead / 0.032, 0.0, 1.0);
                                desiredSpeed = Math.min(desiredSpeed, THREE.MathUtils.lerp(turnEntrySpeed, rc.maxSpeed, slowT));
                            }
                            if (distToLead <= 0.0025 || distToLead > 0.90) {
                                rc.u = rc.entryCurveData.uLead;
                                rc.dwProgress = 0.0;
                                rc.state = 'ENTERING_DRIVEWAY';
                            }
                        }

                        // Smooth acceleration / braking response
                        const accelRate = desiredSpeed < rc.currentSpeed ? 6.5 : 2.8;
                        rc.currentSpeed = THREE.MathUtils.lerp(rc.currentSpeed, desiredSpeed, Math.min(1.0, dt * accelRate));

                        if (rc.state === 'CRUISING_ROAD') {
                            rc.u += rc.dir * rc.currentSpeed * dt;
                            if (rc.u > 0.99) rc.u = 0.01 + (rc.u - 0.99);
                            if (rc.u < 0.01) rc.u = 0.99 - (0.01 - rc.u);

                            const pt = portObjects.roadCurve.getPointAt(rc.u);
                            const tan = portObjects.roadCurve.getTangentAt(rc.u).normalize();
                            const normalX = tan.z;
                            const normalZ = -tan.x;

                            rc.mesh.position.set(
                                pt.x + normalX * rc.laneOffset,
                                pt.y + 0.05,
                                pt.z + normalZ * rc.laneOffset
                            );

                            const yaw = Math.atan2(tan.x * rc.dir, tan.z * rc.dir);
                            const slopePitch = -Math.asin(THREE.MathUtils.clamp(tan.y * rc.dir, -0.35, 0.35));
                            rc.mesh.rotation.set(slopePitch, yaw, 0);
                        }

                    } else if (rc.state === 'ENTERING_DRIVEWAY') {
                        isBraking = true;
                        const dw = rc.activeDriveway;
                        const curve = rc.entryCurveData.curve;
                        // Smoothly glide from turn-in speed to a gentle stop at the garage parking pad
                        const speedFactor = 1.0 - 0.55 * smoothstep(0.4, 1.0, rc.dwProgress);
                        rc.dwProgress = Math.min(1.0, rc.dwProgress + (dt * 0.46 * speedFactor) / dw.lengthFactor);
                        rc.currentSpeed = rc.maxSpeed * 0.45 * speedFactor;

                        const s = smoothstep(0.0, 1.0, rc.dwProgress);
                        const pt = curve.getPointAt(s);
                        const tan = curve.getTangentAt(THREE.MathUtils.clamp(s, 0.005, 0.995)).normalize();

                        rc.mesh.position.set(pt.x, pt.y + 0.05, pt.z);
                        const yaw = Math.atan2(tan.x, tan.z);
                        const slopePitch = -Math.asin(THREE.MathUtils.clamp(tan.y, -0.35, 0.35));
                        rc.mesh.rotation.set(slopePitch, yaw, 0);

                        if (rc.dwProgress >= 1.0) {
                            rc.currentSpeed = 0.0;
                            rc.state = 'PARKED_AT_HOUSE';
                            rc.parkTimer = 3.0 + Math.random() * 4.5;
                        }

                    } else if (rc.state === 'PARKED_AT_HOUSE') {
                        rc.currentSpeed = 0.0;
                        const dw = rc.activeDriveway;
                        if (rc.exitCurveData) {
                            const pt = rc.exitCurveData.curve.getPointAt(0.0);
                            const revTan = rc.exitCurveData.curve.getTangentAt(0.01).normalize();
                            rc.mesh.position.set(pt.x, pt.y + 0.05, pt.z);
                            const yaw = Math.atan2(-revTan.x, -revTan.z);
                            const slopePitch = -Math.asin(THREE.MathUtils.clamp(-revTan.y, -0.35, 0.35));
                            rc.mesh.rotation.set(slopePitch, yaw, 0);
                        }

                        rc.parkTimer -= dt;
                        if (rc.parkTimer <= 0) {
                            // Verify the target lane is clear upstream and downstream before backing out
                            const uMerge = rc.exitCurveData.uMerge;
                            const laneBusy = portObjects.roadCars.some(other => {
                                if (other === rc || other.dir !== rc.dir) return false;
                                if (other.state === 'PARKED_AT_HOUSE') return false;
                                const dAhead = getForwardDeltaU(uMerge, other.u, rc.dir);
                                const dBehind = getForwardDeltaU(other.u, uMerge, rc.dir);
                                return (dAhead < 0.032 || dBehind < 0.058);
                            });
                            if (!laneBusy) {
                                rc.dwProgress = 0.0;
                                rc.state = 'BACKING_OUT_DRIVEWAY';
                            }
                        }

                    } else if (rc.state === 'BACKING_OUT_DRIVEWAY') {
                        isBraking = true;
                        const dw = rc.activeDriveway;
                        const curve = rc.exitCurveData.curve;
                        rc.dwProgress = Math.min(1.0, rc.dwProgress + (dt * 0.40) / dw.lengthFactor);
                        rc.currentSpeed = rc.maxSpeed * 0.35;

                        const s = smoothstep(0.0, 1.0, rc.dwProgress);
                        const pt = curve.getPointAt(s);
                        // revTan points along the reverse travel path; -revTan is the direction the car's front nose faces!
                        const revTan = curve.getTangentAt(THREE.MathUtils.clamp(s, 0.005, 0.995)).normalize();

                        rc.mesh.position.set(pt.x, pt.y + 0.05, pt.z);
                        const noseYaw = Math.atan2(-revTan.x, -revTan.z);
                        const slopePitch = -Math.asin(THREE.MathUtils.clamp(-revTan.y, -0.35, 0.35));
                        rc.mesh.rotation.set(slopePitch, noseYaw, 0);

                        if (rc.dwProgress >= 1.0) {
                            rc.u = rc.exitCurveData.uMerge;
                            rc.currentSpeed = 0.0;
                            rc.shiftTimer = 0.32;
                            rc.state = 'SHIFTING_TO_DRIVE';
                        }

                    } else if (rc.state === 'SHIFTING_TO_DRIVE') {
                        // Brief pause in lane after backing out before accelerating forward in Drive
                        isBraking = true;
                        rc.currentSpeed = 0.0;
                        rc.shiftTimer -= dt;
                        if (rc.shiftTimer <= 0) {
                            if (rc.activeDriveway) {
                                rc.activeDriveway.occupiedBy = null;
                                rc.activeDriveway = null;
                            }
                            rc.entryCurveData = null;
                            rc.exitCurveData = null;
                            rc.cooldown = 4.5 + Math.random() * 5.0;
                            rc.state = 'CRUISING_ROAD';
                        }
                    }

                    // Illuminate bright brake lights when decelerating, turning, or backing out
                    if (rc.brakeLightMat) {
                        rc.brakeLightMat.color.setHex(isBraking ? 0xff2a2a : (NightEnvironment.isNight ? 0xdc2626 : 0x7f1d1d));
                    }
                });
            }

            // 7. Update Selection Ring & Waypoint Ring
            if (PortManager.selectedVessel) {
                const sv = PortManager.selectedVessel;
                selRingMesh.position.set(sv.position.x, sv.heaveY + 0.2, sv.position.z);
                const ringScale = Math.max(1.2, sv.beam * 0.42);
                selRingMesh.scale.set(ringScale, ringScale, 1);
            }
            if (wpRingMat.opacity > 0.01) {
                wpRingMat.opacity *= 0.985;
                wpMarker.scale.setScalar(1.0 + (1.0 - wpRingMat.opacity) * 1.4);
            }

            // 8. Update Expanding Kelvin Wake Ripple Rings & Stern Foam Patches (Pool recycling)
            for (let i = activeWakeParticles.length - 1; i >= 0; i--) {
                const wp = activeWakeParticles[i];
                wp.life -= dt * wp.decay;
                wp.mesh.position.y = sampleOceanSurface(wp.mesh.position.x, wp.mesh.position.z, time) + 0.08;
                const s = wp.baseScale * (1.0 + (1.0 - wp.life) * wp.expandRate);
                wp.mesh.scale.setScalar(s);
                wp.mesh.material.opacity = Math.max(0, wp.life * (wp.maxOpacity || 0.42));
                if (wp.life <= 0) {
                    wp.active = false;
                    wp.mesh.visible = false;
                    activeWakeParticles.splice(i, 1);
                }
            }

            // 9. Auto-Camera Screensaver Cycle & Smooth Camera Transitions (Endlessly looping every 90 seconds)
            if (autoCamEnabled) {
                autoCamTimer += dt;
                if (autoCamTimer >= AUTO_CAM_DURATION) {
                    autoCamTimer = 0;
                    autoCamIndex = (autoCamIndex + 1) % autoCamSequence.length;
                    applyAutoCamStep(autoCamSequence[autoCamIndex]);
                }
            }

            if (PortManager.cameraMode === 'follow' && PortManager.selectedVessel) {
                const sv = PortManager.selectedVessel;
                const targetPos = new THREE.Vector3(sv.position.x, 2, sv.position.z);
                controls.target.lerp(targetPos, 0.04);
                if (autoCamEnabled) {
                    // Slow, cinematic 360-degree drone orbit around the moving vessel (~85s for full rotation)
                    const orbitAngle = time * 0.075;
                    const desiredFollowCam = new THREE.Vector3(
                        sv.position.x + Math.cos(orbitAngle) * 46,
                        22 + Math.sin(time * 0.1) * 3,
                        sv.position.z + Math.sin(orbitAngle) * 46
                    );
                    camera.position.lerp(desiredFollowCam, 0.025);
                }
            } else if (activeCamTransition) {
                activeCamTransition.timer += dt;
                const lerpSpeed = autoCamEnabled ? 0.025 : 0.06;
                camera.position.lerp(activeCamTransition.pos, lerpSpeed);
                controls.target.lerp(activeCamTransition.target, lerpSpeed);
                if (camera.position.distanceTo(activeCamTransition.pos) < 0.9 || activeCamTransition.timer > 4.5) {
                    activeCamTransition = null;
                }
            }

            // Gentle cinematic orbital drift while Auto-Camera is holding a preset angle
            if (autoCamEnabled && PortManager.cameraMode !== 'follow' && cameraPresets[PortManager.cameraMode] && !activeCamTransition) {
                const basePreset = cameraPresets[PortManager.cameraMode];
                // Ultra-slow, majestic panoramic drift across the harbor over the 90-second duration
                const driftPos = basePreset.pos.clone().add(new THREE.Vector3(
                    Math.sin(time * 0.05) * 12.0,
                    Math.sin(time * 0.035) * 3.2,
                    Math.cos(time * 0.045) * 12.0
                ));
                camera.position.lerp(driftPos, 0.015);
                controls.target.lerp(basePreset.target, 0.02);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
